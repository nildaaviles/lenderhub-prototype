      const notches = cv.notches;
      const rtCol = isB?'var(--red)':isW?'var(--yellow)':'var(--green)';
      const notchLabel = notches > 0 ? `+${notches} notch${notches>1?'es':''} sobre trigger`
                       : notches === 0 ? `En el trigger (${cv.triggerFloor})`
                       : `${Math.abs(notches)} notch${Math.abs(notches)>1?'es':''} BAJO trigger`;
      const ratingBgColor = ratingColor(cv.currentRating);
      return `<tr class="${isB?'breach-row':isW?'watch-row':''}">
        <td><div class="qd-cv-name">${cv.abbr}</div><div class="qd-cv-desc">${cv.name}</div></td>
        <td style="font-size:.78rem;white-space:nowrap;">Piso: <strong>${cv.triggerFloor}</strong></td>
        <td style="white-space:nowrap;">
          <span style="display:inline-block;background:${ratingBgColor.bg};color:${ratingBgColor.tc};font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:4px;">${cv.currentRating}</span>
        </td>
        <td style="font-size:.78rem;color:${rtCol};font-weight:700;">
          ${notchLabel}
        </td>
        <td style="font-size:.72rem;"><div style="font-weight:500;">${cv.freq}</div><div style="color:var(--text-muted);margin-top:2px;">Monitoreo continuo</div></td>
        <td>${stHtml}</td>
      </tr>`;
    }

    // ── Numeric covenant (default) ──────────────────────────
    const pct  = cv.big ? Math.min(100,Math.round((cv.actual/(cv.threshold*1.5))*100))
                        : Math.min(100,Math.round(((cv.threshold*1.5-cv.actual)/(cv.threshold*1.5))*100));
    const tpct = cv.big ? Math.round((cv.threshold/(cv.threshold*1.5))*100)
                        : Math.round(((cv.threshold*1.5-cv.threshold)/(cv.threshold*1.5))*100);
    const barCol = isB?'var(--red)':isW?'var(--yellow)':'var(--green)';
    return `<tr class="${isB?'breach-row':isW?'watch-row':''}">
      <td><div class="qd-cv-name">${cv.abbr}</div><div class="qd-cv-desc">${cv.name}</div></td>
      <td style="font-family:var(--font-mono);font-size:.8rem;white-space:nowrap;">${cv.big?'≥':'≤'} ${cv.threshold}${cv.unit}</td>
      <td style="font-family:var(--font-mono);font-size:.8rem;font-weight:700;">${cv.actual}${cv.unit}</td>
      <td>
        <span class="qd-bar-wrap"><span class="qd-bar-fill" style="width:${Math.min(pct,100)}%;background:${barCol};"></span><span class="qd-bar-thresh" style="left:${tpct}%;"></span></span>
        <span style="font-size:.7rem;color:${barCol};margin-left:5px;">${cv.holgura>=0?'+':''}${cv.holgura}${cv.unit}</span>
      </td>
      <td style="font-size:.72rem;"><div style="font-weight:500;">${cv.freq}</div><div style="color:var(--text-muted);margin-top:2px;">${nextMeasDate(cv.freq)}</div></td>
      <td>${stHtml}</td>
    </tr>`;
  }).join('');

  // ── Amortization profile ──────────────────────────────────
  const amortDesc = {
    'Bullet':    `Capital único al vencimiento (${f.fechaVenc}) · ${f.outstanding} · Intereses ${f.rateType} mensuales`,
    'Francés':   `${f.plazo} cuotas mensuales decrecientes (capital + intereses) · Outstanding: ${f.outstanding}`,
    'Alemán':    `Capital fijo $${(f.outNum/f.plazo).toFixed(1)}M/mes · Intereses decrecientes sobre saldo · ${f.plazo} cuotas`,
    'Revolvente':`Intereses sobre saldo dispuesto (${util}% utilizado) · Commitment fee: ${f.commitmentFee}% anual sobre no dispuesto`,
  }[f.creditType];
  const amortHtml = `
    <div class="qd-card">
      <div class="qd-card-hdr">
        <div class="qd-card-title"><i class="ph ph-chart-bar"></i> Perfil de Amortización</div>
        <div class="qd-card-sub">${f.creditType} · WAL ${wal}a</div>
      </div>
      <div style="padding:14px 18px 16px;">
        <div style="display:flex;justify-content:space-between;font-size:.7rem;color:var(--text-muted);margin-bottom:5px;">
          <span>${f.fechaInicio}</span>
          <span style="color:var(--secondary);font-weight:700;">${transcPct}% transcurrido · ${plazoMeses}m de ${f.plazo}m</span>
          <span>${f.fechaVenc}</span>
        </div>
        <div style="height:10px;background:var(--border);border-radius:5px;position:relative;overflow:hidden;">
          <div style="position:absolute;top:0;left:0;height:100%;width:${transcPct}%;background:var(--secondary);opacity:.75;border-radius:5px;"></div>
        </div>
        <div style="font-size:.75rem;color:var(--text-secondary);margin-top:10px;line-height:1.6;">${amortDesc}</div>
        <div style="display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;">
          <span style="font-size:.72rem;color:var(--text-muted);display:flex;align-items:center;gap:4px;"><span style="display:inline-block;width:20px;height:6px;background:var(--secondary);border-radius:2px;opacity:.75;"></span>Plazo transcurrido</span>
          ${f.creditType==='Bullet'?`<span style="font-size:.72rem;color:var(--text-muted);display:flex;align-items:center;gap:4px;"><span style="display:inline-block;width:20px;height:6px;background:var(--red);border-radius:2px;"></span>Bullet ${f.outstanding} al venc.</span>`:''}
        </div>
      </div>
    </div>`;

  // ── Payment schedule rows ─────────────────────────────────
  const psRow = r => {
    const isNext    = r.isNext;
    const isOverdue = r.isOverdue;
    const cls = isNext ? 'ps-next' : isOverdue ? 'ps-overdue' : r.isPast ? 'ps-paid' : r.isBullet ? 'ps-bullet' : '';
    const badge = isOverdue
      ? `<span class="ps-badge ps-badge-overdue">Vencido</span>`
      : isNext
      ? `<span class="ps-badge ps-badge-next">Pendiente</span>`
      : r.isPast
      ? `<span class="ps-badge ps-badge-paid">Pagado</span>`
      : `<span class="ps-badge ps-badge-pending">Pendiente</span>`;
    return `<div class="ps-row ${cls}">
      <div class="ps-date${r.isPast?' ps-paid-date':''}">${r.fecha}</div>
      <div class="ps-concept">
        <div class="ps-concept-main">${r.icon} ${r.concepto}${isNext?'<span class="ps-tag-next">PRÓXIMO</span>':''}</div>
        ${r.sub?`<div class="ps-concept-sub">${r.sub}</div>`:''}
      </div>
      <div class="ps-amount${r.isBullet?' ps-bullet-amt':''}">${r.monto}</div>
      <div>${badge}</div>
    </div>`;
  };
  const futurePsRows = sched.future.map(psRow).join('');
  const pastPsRows   = sched.past.length
    ? `<div class="ps-past-sep">Pagos anteriores</div>` + sched.past.map(psRow).join('')
    : '';
  const psEmptyMsg = f.estadoFacility === 'LIQUIDADO'
    ? 'Facility liquidada · Todos los pagos fueron realizados · Sin saldo pendiente'
    : 'Sin pagos programados · Facility no iniciada o fuera del rango de visualización';
  const psEmptyState = !sched.future.length && !sched.past.length
    ? `<div style="padding:32px 18px;text-align:center;color:var(--text-muted);font-size:.82rem;">
         <i class="ph ph-calendar-slash" style="font-size:28px;display:block;margin-bottom:8px;opacity:.5;"></i>
         ${psEmptyMsg}
       </div>`
    : '';


  // ── Términos del Crédito (enhanced) ──────────────────────
  const fxBadge = '';

  // Garantías — catálogo correcto (TC-07 fix): categorías válidas para quirografario
  // Sesgo a "Sin garantía puro" porque es lo más común; aval/garantía corporativa minoritario
  const garantiasCatalogo = [
    'Sin garantía (quirografario puro)',
    'Sin garantía (quirografario puro)',
    'Sin garantía (quirografario puro)',
    'Sin garantía (quirografario puro)',
    'Garantía corporativa (holding)',
    'Fianza de empresa relacionada',
    'Aval personal de accionistas',
    'Fondo de Garantía NAFINSA',
  ];
  const garanteName = garantiasCatalogo[f.idx % garantiasCatalogo.length];

  // ── Datos quirografario-correctos (seeded por idx) ────────────
  // Tipo de instrumento separado de estructura de amortización
  const instrumentos = ['Crédito Simple','Pagaré Quirografario','Línea Revolvente','Crédito en Cuenta Corriente','CEBUR Largo Plazo','CEBUR Corto Plazo'];
  const instrumento  = f.creditType === 'Revolvente'
    ? instrumentos[2 + (f.idx % 2)]  // Línea Revolvente o Cuenta Corriente
    : f.idx % 6 < 4
      ? instrumentos[f.idx % 2]      // Crédito Simple o Pagaré
      : instrumentos[4 + (f.idx % 2)]; // CEBUR LP/CP
  const esBursatil = instrumento.startsWith('CEBUR');

  // TC-04 fix: ranking de deuda coherente con tipo de instrumento
  //   CEBUR (bursátil)  → Senior No Garantizado o Pari Passu (nunca Bilateral/Sindicado)
  //   Pagaré/Cdto Simple → Bilateral o Sindicado
  //   Revolvente        → Bilateral (típicamente)
  let debtRanking = f.debtRanking;
  if (esBursatil) {
    // Si el seed dio Bilateral/Sindicado, mapear a Senior No Garantizado
    if (debtRanking === 'Senior Bilateral' || debtRanking === 'Senior Sindicado') {
      debtRanking = f.idx % 2 === 0 ? 'Senior No Garantizado' : 'Pari Passu';
    }
  } else if (instrumento === 'Línea Revolvente' || instrumento === 'Crédito en Cuenta Corriente') {
    // Revolventes son siempre bilaterales en práctica
    if (debtRanking === 'Senior Sindicado' || debtRanking === 'Pari Passu') {
      debtRanking = 'Senior Bilateral';
    }
  }

  // Rating externo (HR Ratings) — derivado del rating interno con lag de 0-2 notches
  // En la realidad, agencias califican con retraso vs. el área de riesgo del banco.
  // El interno siempre es igual o más conservador que el externo.
  const HR_SCALE = ['HR AAA','HR AA+','HR AA','HR AA-','HR A+','HR A','HR A-','HR BBB+','HR BBB','HR BBB-','HR BB','HR B','HR CCC'];
  const INT_TO_HR = {'A':5,'A-':6,'BBB+':7,'BBB':8,'BBB-':9,'BB+':10,'BB':11,'BB-':11,'B+':12,'B':12,'B-':12,'CCC':12};
  const hrBase   = INT_TO_HR[f.ratingInterno] ?? 8;
  // Lag: externo 0-2 notches MEJOR que interno (agencia no ha bajado aún)
  const lag      = f.idx % 3; // 0, 1, or 2 notches de lag
  const hrIdx    = Math.max(0, hrBase - lag);
  const ratingExt = HR_SCALE[hrIdx] || 'HR BBB';
  // Outlook correlacionado: deterioro → Negativa, mejora/estable → Estable/Positiva
  const estadoFac = f.estadoFacility || 'ACTIVO';
  const outlook  = ['VENCIDO','EN REESTRUCTURA','SUSPENDIDO'].includes(estadoFac) ? 'Negativa'
                 : f.ratingInterno.startsWith('BB') || f.ratingInterno.startsWith('B') ? (f.idx % 3 === 0 ? 'Negativa' : 'Estable')
                 : ['Estable','Estable','Positiva'][f.idx % 3];
  const outlookCol = outlook === 'Negativa' ? 'var(--red)' : outlook === 'Positiva' ? 'var(--green)' : 'var(--text-secondary)';

  // Cross-default umbral (USD M, escalado por outstanding)
  const xDefUmbral = Math.max(5, Math.round((f.outNum||100) * 0.05));

  // Representante común (sólo CEBUR)
  const repComunes = ['Monex','CIBanco','Banco Actinver','Banco INVEX'];
  const repComun   = esBursatil ? repComunes[f.idx % repComunes.length] : null;

  // Calificadora vinculada (sólo CEBUR)
  const calificadoras = ['HR Ratings + Fitch México','HR Ratings + Moody\'s Local','S&P Global Ratings + HR Ratings','Verum + HR Ratings'];
  const calificadora  = esBursatil ? calificadoras[f.idx % calificadoras.length] : null;

  // Periodicidad de amortización
  const periodicidades = ['Mensual','Trimestral','Semestral'];
  const periodicidad   = f.creditType === 'Bullet' ? 'Al vencimiento (bullet)'
                       : f.creditType === 'Revolvente' ? 'Continua (disposición)'
                       : periodicidades[f.idx % periodicidades.length];

  // Ratting badge helper
  const ratingBadge = `<span style="display:inline-flex;align-items:center;gap:6px;"><span style="font-family:var(--font-mono);font-weight:700;color:${/^HR (AAA|AA|A)/.test(ratingExt)?'var(--green)':/^HR BBB/.test(ratingExt)?'var(--blue)':'var(--yellow)'};">${ratingExt}</span><span style="font-size:.65rem;color:${outlookCol};">· ${outlook}</span></span>`;

  // Número de contrato / ISIN (seeded)
  const isinPrefix = esBursatil ? 'MX' : '';
  const contratoId = esBursatil
    ? `${isinPrefix}91LH${String(f.idx).padStart(4,'0')}01`
    : `CQ-${f.lender}-${f.name.split('-').slice(1).join('-')}`;

  // Jurisdicción
  const jurisdiccion = f.moneda === 'USD' ? 'Estado de Nueva York, EUA' : 'Ciudad de México, México';
  const leyAplicable = f.moneda === 'USD' ? 'Ley del Estado de Nueva York' : 'Legislación mercantil mexicana (LGTOC / LMV)';

  // Negative pledge y pari passu
  const negPledge = debtRanking.includes('Subordinado') ? 'No aplica (subordinado)' : 'Sí — sin gravar activos';
  const pariPassu = debtRanking.includes('Subordinado') ? 'No — subordinado a deuda senior' : 'Sí — igualdad de prelación';

  // Evento de vencimiento anticipado (seeded)
  // TC-03 fix: evento de aceleración derivado del estado (no aleatorio)
  // VENCIDO → siempre Incumplimiento pago; EN REESTRUCTURA → covenants; activo → preventivo cualquiera
  const eventosPreventivos = [
    'Cross-default + incumplimiento material',
    'Cambio de control del acreditado',
    'Incumplimiento de covenants financieros (sin cura en período)',
    'Declaración de concurso mercantil',
  ];
  const eventoAcel = f.estadoFacility === 'VENCIDO'
    ? 'Incumplimiento de pago > 3 días hábiles'
    : f.estadoFacility === 'EN REESTRUCTURA'
      ? 'Incumplimiento de covenants financieros (sin cura en período)'
      : eventosPreventivos[f.idx % eventosPreventivos.length];

  const terms = [
    // Identidad
    ['Instrumento',        instrumento],
    ['No. contrato / ISIN', `<span style="font-family:var(--font-mono);font-size:.75rem;">${contratoId}</span>`],
    ['Estructura',         f.creditType],
    ['Sector',             f.sector],
    ['Moneda',             `${f.moneda}${fxBadge}`],
    // Plazo
    ['Plazo total',        `${f.plazo} meses`],
    ['Plazo transcurrido', `${plazoMeses}m (${transcPct}%)`],
    ['Periodicidad pagos', periodicidad],
    ['Fecha inicio',       f.fechaInicio],
    ['Fecha vencimiento',  f.fechaVenc],
    // Riesgo & ranking
    ['Rating externo',     ratingBadge],
    ['Rating interno',     `<span style="font-family:var(--font-mono);font-weight:700;">${f.ratingInterno}</span>`],
    ['Ranking de deuda',   debtRanking],
    ['Pari passu',         pariPassu],
    ['Negative pledge',    negPledge],
    ['Cross-default',      `≥ $${xDefUmbral}M USD`],
    ['Evento de aceleración', `<span style="font-size:.75rem;">${eventoAcel}</span>`],
    ['Garantías',          garanteName],
    // Legal & jurisdicción
    ['Jurisdicción',       jurisdiccion],
    ['Ley aplicable',      `<span style="font-size:.75rem;">${leyAplicable}</span>`],
    // Contrapartes
    ['Lender',             f.lender],
    ...(repComun ? [['Representante común', repComun]] : []),
    ...(calificadora ? [['Calificadoras', `<span style="font-size:.75rem;">${calificadora}</span>`]] : []),
    ...(f.creditType==='Revolvente'?[['Commitment fee',`${f.commitmentFee}% anual`]]:[]),
  ].map(([l,v])=>`<div class="qd-info-row"><span class="qd-info-label">${l}</span><span class="qd-info-val">${v}</span></div>`).join('');

  // ── Tasa Activa (enhanced: floor + mora + all-in) ─────────
  const tasaItems = [];
  if (f.tasaFija) {
    tasaItems.push([`Tasa Fija`, `${f.tasaFija}%`]);
  } else {
    tasaItems.push([f.rateType, `${f.tiie}%`]);
    if (f.tieeFloor) tasaItems.push([`Floor TIIE`, `${f.tieeFloor}% (aplica)`]);
    tasaItems.push([`Spread contractual`, `+ ${f.spread}%`]);
  }
  // Costo de fondeo estimado — varía por rating del acreditado (transferencia interna FTP)
  // Banca múltiple MX: base TIIE + spread FTP que refleja riesgo de crédito asignado
  const FTP_SPREAD = {'A':0.20,'A-':0.30,'BBB+':0.45,'BBB':0.60,'BBB-':0.80,
    'BB+':1.10,'BB':1.40,'BB-':1.75,'B+':2.20,'B':2.70,'B-':3.20,'CCC':4.00};
  const ftpSpread = FTP_SPREAD[f.ratingInterno] || 0.75;
  const costoFondeoFija = 8.50 + ftpSpread; // costo base fija ~8.50% + FTP
  const costoFondeo = f.tasaFija ? costoFondeoFija : (Math.max(f.tiie || 9.5, f.tieeFloor || 0) + ftpSpread);
  const nim = eff - costoFondeo;
  tasaItems.push([`Costo de Fondeo est.`, `${costoFondeo.toFixed(2)}%`]);
  tasaItems.push([`NIM (margen neto)`, `${nim >= 0 ? '+' : ''}${nim.toFixed(2)}%`]);
  tasaItems.push([`Tasa moratoria`, `${mora}% (all-in + 2.5pp)`]);
  const tasaLinesHtml = tasaItems.map(([l,v])=>`<div class="qd-tasa-line"><span class="qd-tasa-lbl">${l}</span><span class="qd-tasa-val">${v}</span></div>`).join('');

  // ── Lifecycle state banner ─────────────────────────────────
  const estad = f.estadoFacility || 'ACTIVO';
  const estadBannerMap = {
    'LIQUIDADO':       { bg:'#F8FAFC', bc:'#CBD5E1', ic:'ph-check-circle', color:'#64748B',
                         msg:`Facility liquidada — Crédito pagado en su totalidad. Covenants cerrados al ${f.fechaVenc}. Datos históricos únicamente.` },
    'VENCIDO':         { bg:'#FEF2F2', bc:'#FECACA', ic:'ph-clock-countdown', color:'var(--red)',
                         msg:`Facility vencida — El crédito no fue liquidado en fecha ${f.fechaVenc}. Estado de recuperación activo.` },
    'EN REESTRUCTURA': { bg:'#FFFBEB', bc:'#FFFBEB', ic:'ph-arrows-clockwise', color:'#D97706',
                         msg:`Facility en reestructura — Negociación de términos en curso. Monitoreo de covenants activo y reforzado.` },
    'SUSPENDIDO':      { bg:'#FFF7ED', bc:'#FFFBEB', ic:'ph-warning-circle', color:'#EA580C',
                         msg:`Facility suspendida — Desembolsos detenidos por acción administrativa. Requiere revisión del Representante Común.` },
  };
  const eBanner = estadBannerMap[estad]
    ? `<div style="display:flex;align-items:flex-start;gap:10px;padding:10px 14px;background:${estadBannerMap[estad].bg};border:1px solid ${estadBannerMap[estad].bc};border-radius:8px;margin-bottom:14px;">
         <i class="ph ${estadBannerMap[estad].ic}" style="font-size:16px;color:${estadBannerMap[estad].color};margin-top:1px;flex-shrink:0;"></i>
         <span style="font-size:.78rem;color:${estadBannerMap[estad].color};line-height:1.4;">${estadBannerMap[estad].msg}</span>
       </div>`
    : '';

  // ── Assemble ──────────────────────────────────────────────
  return `
    <button class="qd-back" onclick="backToFacilities()"><i class="ph ph-arrow-left"></i> Regresar a Facilities</button>
    ${eBanner}
    <div class="qd-header">
      <div class="qd-name">
        ${f.name}
        <span class="card-tipo card-tipo-quiro" style="font-size:.65rem;padding:2px 8px;">Quirografario</span>
        ${estad!=='ACTIVO'?`<span style="font-size:.62rem;padding:2px 8px;border-radius:12px;font-weight:700;letter-spacing:.3px;background:${estadBannerMap[estad]?.bg||'#F8FAFC'};color:${estadBannerMap[estad]?.color||'#64748B'};border:1px solid ${estadBannerMap[estad]?.bc||'#CBD5E1'};margin-left:6px;">${estad}</span>`:''}
      </div>
      <div class="qd-meta">
        <span><i class="ph ph-building"></i> ${f.borrower}</span>
        <span><i class="ph ph-tag"></i> ${f.sector}</span>
        <span><i class="ph ph-bank"></i> ${f.lender}</span>
        <span><i class="ph ph-calendar-blank"></i> Inicio: ${f.fechaInicio}</span>
        <span><i class="ph ph-calendar-check"></i> Vence: ${f.fechaVenc}</span>
        <span><i class="ph ph-medal"></i> Rating: <span style="display:inline-block;background:${rc.bg};color:${rc.tc};font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:4px;margin-left:2px;">${f.ratingInterno}</span><span style="font-size:.65rem;color:var(--text-muted);margin-left:5px;">${ratingExt} <span style="color:${outlookCol};">· ${outlook}</span></span></span>
      </div>
    </div>
    <!-- Tab bar -->
    <div class="abd-tab-bar">
      <button class="abd-tab active" id="qd-tab-op"  onclick="quiroShowTab('op')"><i class="ph ph-lightning"></i> Insights</button>
      <button class="abd-tab"        id="qd-tab-fin" onclick="quiroShowTab('fin')"><i class="ph ph-chart-line-up"></i> Financieros</button>
      <button class="abd-tab"        id="qd-tab-rr"  onclick="quiroShowTab('rr')"><i class="ph ph-archive-box"></i> Report Repository</button>
    </div>
    <!-- Pane: Operación -->
    <div class="abd-pane active" id="qd-pane-op">
      ${kpis}
      <div class="qd-grid">
        <div class="qd-left">
          <div class="qd-card">
            <div class="qd-card-hdr">
              <div class="qd-card-title"><i class="ph ph-shield-check"></i> Covenants Financieros</div>
              <div class="qd-card-sub">${(()=>{
                if (estad==='LIQUIDADO') return 'Cerrados al cierre';
                const diasSin = f.diasSinReporte || 0;
                const ult = new Date(TODAY); ult.setDate(ult.getDate() - diasSin);
                return `Corte: ${String(ult.getDate()).padStart(2,'0')}/${String(ult.getMonth()+1).padStart(2,'0')}/${ult.getFullYear()}`;
              })()}</div>
            </div>
            ${estad==='LIQUIDADO'
              ? `<div style="padding:28px 18px;text-align:center;color:#64748B;font-size:.82rem;">
                   <i class="ph ph-check-circle" style="font-size:26px;display:block;margin-bottom:8px;opacity:.6;"></i>
                   Covenants cumplidos al cierre · Facility liquidada sin breach registrado
                 </div>`
              : `<table class="qd-cv-table">
                   <thead><tr><th>Covenant</th><th>Umbral</th><th>Actual</th><th>Headroom</th><th>Frecuencia / Próx.</th><th>Estado</th></tr></thead>
                   <tbody>${cvRows}</tbody>
                 </table>`
            }
          </div>
          ${amortHtml}
          <div class="qd-card" style="overflow:hidden;">
            <div class="ps-hdr">
              <div class="ps-hdr-left">
                <h3><i class="ph ph-calendar-dots"></i> Payment Schedule</h3>
                <p>${f.creditType} · ${f.rateType || 'Fija'} · ${eff}% actual</p>
              </div>
              <div class="ps-hdr-actions"></div>
            </div>
            <hr class="ps-divider">
            <div class="ps-col-hdr"><div>Fecha</div><div>Concepto</div><div style="text-align:right">Monto</div><div>Estatus</div></div>
            ${psEmptyState}
            ${futurePsRows}
            ${pastPsRows}
          </div>
        </div>
        <div class="qd-right">
          <div class="qd-card">
            <div class="qd-card-hdr"><div class="qd-card-title"><i class="ph ph-file-text"></i> Términos del Crédito</div></div>
            <div style="padding:4px 18px 10px;">${terms}</div>
          </div>
          <div class="qd-card">
            <div class="qd-card-hdr">
              <div class="qd-card-title"><i class="ph ph-percent"></i> Tasa Activa</div>
              <div class="qd-card-sub">Efectiva al corte</div>
            </div>
            <div style="padding:4px 18px 2px;">${tasaLinesHtml}</div>
            <div class="qd-tasa-total">
              <span class="qd-tasa-total-lbl">All-in Rate hoy</span>
              <span style="font-size:1.2rem;font-weight:700;color:var(--secondary);font-family:var(--font-mono);">${eff}%</span>
            </div>
            ${buildTiieHistory(f)}
          </div>

// ── Financieros helpers ──────────────────────────────────
function qfr(seed) { const x = Math.sin(seed * 6271 + 31337) * 99999; return x - Math.floor(x); }
function qfn(seed, min, max, dec) { return parseFloat((qfr(seed) * (max - min) + min).toFixed(dec ?? 1)); }
function fmtM(v) { return Math.abs(v) >= 1000 ? `$${(v/1000).toFixed(1)}B` : `$${v.toFixed(0)}M`; }

function quiroFinData(f) {
  const base = f.outNum || parseFloat(f.outstanding.replace(/[$MB]/g,'')) * (f.outstanding.includes('B')?1000:1);
  const seed = f.name.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  const QS = ["Q1 '25","Q2 '25","Q3 '25","Q4 '25","Q1 '26"];
  return QS.map((q,k)=>{
    const rev    = qfn(seed*3+k*17, base*0.18, base*0.28);
    const cogs   = qfn(seed*5+k*13, rev*0.45, rev*0.60, 1);
    const gp     = +(rev-cogs).toFixed(1);
    const opex   = qfn(seed*7+k*11, rev*0.12, rev*0.20, 1);
    const ebitda = +(gp-opex).toFixed(1);
    const da     = qfn(seed*9+k*7,  ebitda*0.10, ebitda*0.18, 1);
    const ebit   = +(ebitda-da).toFixed(1);
    const deuda    = qfn(seed*17+k, base*3.0, base*6.0); // total company debt (BBVA is one of several lenders)
    const int_   = qfn(seed*11+k*5, deuda*0.026, deuda*0.042, 1); // quarterly interest: 10–17% annual on total debt
    const ebt    = +(ebit-int_).toFixed(1);
    const tax    = +(Math.max(ebt,0)*0.30).toFixed(1);
    const ni     = +(ebt-tax).toFixed(1);
    // actTotal always > deuda so equity stays positive (leverage ratio 50–77%)
    const actTotal = +(deuda * (1.3 + qfn(seed*13+k, 0, 0.7, 2))).toFixed(1);
    const equity   = +(actTotal-deuda).toFixed(1);
    return {q,rev,cogs,gp,opex,ebitda,da,ebit,int:int_,ebt,tax,ni,actTotal,deuda,equity};
  });
}

function renderFinancieros(f) {
  const data = quiroFinData(f);
  const QS   = data.map(d=>d.q);
  const last = data[data.length-1], prev = data[data.length-2];
  const ebitdaLTM = data.slice(-4).reduce((s,d)=>s+d.ebitda,0);
  const intLTM    = data.slice(-4).reduce((s,d)=>s+d.int,0);
  const margin   = ((last.ebitda/last.rev)*100).toFixed(1);
  const leverage = (last.deuda/ebitdaLTM).toFixed(2);
  const coverage = (ebitdaLTM/intLTM).toFixed(2);
  const revTrend = last.rev >= prev.rev;

  const kpis = `<div class="fin-kpi-row">
    <div class="fin-kpi"><div class="fin-kpi-lbl">Ingresos Q1 '26</div><div class="fin-kpi-val">${fmtM(last.rev)}</div><div class="fin-kpi-sub ${revTrend?'fin-trend-up':'fin-trend-down'}">${revTrend?'▲':'▼'} vs Q4 '25: ${fmtM(prev.rev)}</div></div>
    <div class="fin-kpi"><div class="fin-kpi-lbl">Margen EBITDA</div><div class="fin-kpi-val">${margin}%</div><div class="fin-kpi-sub" style="color:var(--text-muted);">EBITDA: ${fmtM(last.ebitda)}</div></div>
    <div class="fin-kpi"><div class="fin-kpi-lbl">Apalancamiento</div><div class="fin-kpi-val" style="color:${parseFloat(leverage)>3?'var(--red)':parseFloat(leverage)>2?'var(--yellow)':'var(--green)'};">${leverage}x</div><div class="fin-kpi-sub" style="color:var(--text-muted);">Deuda / EBITDA LTM</div></div>
    <div class="fin-kpi"><div class="fin-kpi-lbl">Cobertura Intereses</div><div class="fin-kpi-val" style="color:${parseFloat(coverage)<1.5?'var(--red)':parseFloat(coverage)<2.5?'var(--yellow)':'var(--green)'};">${coverage}x</div><div class="fin-kpi-sub" style="color:var(--text-muted);">EBITDA / Intereses LTM</div></div>
  </div>`;

  const ROWS = [
    {label:'Ingresos Totales',key:'rev',sub:false},{label:'Costo de Ventas',key:'cogs',sub:false},
    {label:'Utilidad Bruta',key:'gp',sub:true},{label:'Gastos Operativos',key:'opex',sub:false},
    {label:'EBITDA',key:'ebitda',sub:true},{label:'D&A',key:'da',sub:false},
    {label:'EBIT',key:'ebit',sub:true},{label:'Intereses',key:'int',sub:false},
    {label:'EBT',key:'ebt',sub:true},{label:'Impuestos (30%)',key:'tax',sub:false},
    {label:'Utilidad Neta',key:'ni',sub:true},
  ];
  const pnlRows = ROWS.map(r=>`<tr class="${r.sub?'fin-subtotal':''}"><td>${r.label}</td>${data.map(d=>`<td>${fmtM(d[r.key])}</td>`).join('')}</tr>`).join('');
  const pnl = `<div class="fin-card" style="grid-column:1/-1;"><div class="fin-card-hdr"><div class="fin-card-title"><i class="ph ph-chart-line-up"></i> Estado de Resultados (P&L)</div><div class="fin-card-sub">$M ${f.moneda||'MXN'} · Últimos 5 trimestres</div></div><div style="overflow-x:auto;"><table class="fin-table"><thead><tr><th>Concepto</th>${QS.map(q=>`<th>${q}</th>`).join('')}</tr></thead><tbody>${pnlRows}</tbody></table></div></div>`;

  const bsMax = Math.max(last.actTotal,last.deuda,last.equity);
  const bsRows = [{label:'Activos Totales',val:last.actTotal,color:'var(--blue)'},{label:'Deuda Total',val:last.deuda,color:'var(--secondary)'},{label:'Capital Contable',val:last.equity,color:'var(--green)'}]
    .map(b=>`<div class="fin-bar-row"><div class="fin-bar-label">${b.label}</div><div class="fin-bar-track"><div class="fin-bar-fill" style="width:${Math.round(b.val/bsMax*100)}%;background:${b.color};"></div></div><div class="fin-bar-val">${fmtM(b.val)}</div></div>`).join('');
  const balance = `<div class="fin-card"><div class="fin-card-hdr"><div class="fin-card-title"><i class="ph ph-scales"></i> Balance General</div><div class="fin-card-sub">Q1 '26</div></div>${bsRows}</div>`;

  const eMax = Math.max(...data.map(d=>d.ebitda));
  const eBars = data.map((d,k)=>`<div class="fin-bar-row"><div class="fin-bar-label">${d.q}</div><div class="fin-bar-track"><div class="fin-bar-fill" style="width:${Math.round(d.ebitda/eMax*100)}%;background:${k===data.length-1?'var(--secondary)':'var(--border-strong)'};"></div></div><div class="fin-bar-val">${fmtM(d.ebitda)}</div></div>`).join('');
  const ebitdaCard = `<div class="fin-card"><div class="fin-card-hdr"><div class="fin-card-title"><i class="ph ph-trend-up"></i> Evolución EBITDA</div><div class="fin-card-sub">Últimos 5 trimestres</div></div>${eBars}</div>`;

  return `${kpis}<div class="fin-grid">${pnl}${balance}${ebitdaCard}</div>`;
}

// Seeded RNG helper for Report Repository
function absr(seed) { const x = Math.sin(seed * 6271 + 31337) * 99999; return x - Math.floor(x); }

function renderReportRepository(f) {
  const seed  = f.name.split('').reduce((a,c) => a + c.charCodeAt(0), 0);
  const rng   = s => { const x = Math.sin(s * 9301 + 49297) * 233280; return x - Math.floor(x); };
  const isLiq = f.estadoFacility === 'LIQUIDADO';
  const isVenc = f.estadoFacility === 'VENCIDO';
  const isRest = f.estadoFacility === 'EN REESTRUCTURA';
  const isBreach = f.status === 'BREACH';
  const isCEBUR  = (f.instrumentType || '').toLowerCase().includes('cebur') ||
                   (f.creditType || '').toLowerCase().includes('cebur');

  // ── Helpers ────────────────────────────────────────────
  const sbadge = (s, extra) => {
    if (s==='uploaded') return `<span class="rr-badge-uploaded"><i class="ph ph-check"></i> Cargado</span>`;
    if (s==='pending')  return `<span class="rr-badge-pending"><i class="ph ph-clock"></i> Pendiente</span>`;
    if (s==='missing')  return `<span class="rr-badge-missing"><i class="ph ph-warning"></i> Faltante</span>`;
    if (s==='expired')  return `<span class="rr-badge-expired"><i class="ph ph-warning-circle"></i> Venció</span>`;
    if (s==='na')       return `<span class="rr-badge-na">N/A</span>`;
    return '';
  };
  const actions = (d) => {
    if (d.status === 'uploaded' || d.status === 'expired')
      return `<button class="rr-btn" onclick="event.stopPropagation()"><i class="ph ph-download-simple"></i> Descargar</button>`;
    if (d.status === 'pending' || d.status === 'missing')
      return `<button class="rr-btn primary" onclick="event.stopPropagation()"><i class="ph ph-upload-simple"></i> Cargar</button>`;
    return '';
  };
  const row = (d) => `
    <tr>
      <td>
        <div class="rr-doc-name">
          <i class="ph ${d.icon||'ph-file-text'} rr-doc-icon"></i>
          <div><div>${d.nombre}</div>${d.sub?`<div class="rr-doc-sub">${d.sub}</div>`:''}</div>
        </div>
      </td>
      <td style="color:var(--text-secondary);font-size:.78rem;white-space:nowrap;">${d.periodo||'—'}</td>
      <td style="color:var(--text-muted);font-size:.76rem;white-space:nowrap;">${d.fecha||'—'}</td>
      <td style="color:var(--text-muted);font-size:.76rem;">${d.pages?d.pages+' págs.':'—'}</td>
      <td>${sbadge(d.status)}</td>
      <td style="text-align:right;">${actions(d)}</td>
    </tr>`;

  const section = (icon, title, color, docs, alert) => {
    const tableRows = docs.map(row).join('');
    return `
      <div class="rr-section">
        <div class="rr-section-hdr">
          <i class="ph ${icon}" style="color:${color};font-size:14px;"></i>
          <span style="color:${color};">${title}</span>
          <span style="margin-left:auto;font-size:.68rem;font-weight:400;color:var(--text-muted);">${docs.length} documento${docs.length!==1?'s':''}</span>
        </div>
        ${alert||''}
        <div class="rr-table-wrap">
          <table class="rr-table">
            <tbody>${tableRows}</tbody>
          </table>
        </div>
      </div>`;
  };

  // ── CATEGORÍA 1 — DOCUMENTOS DE CIERRE ────────────────
  // Existen una sola vez al firmarse el contrato. Status: casi siempre uploaded.
  // Opinión Legal tiene vigencia de ~1 año → alerta si vencida.
  const opinionFecha = f.fechaInicio || '15/03/2024';
  const [od,om,oy] = opinionFecha.split('/').map(Number);
  const opinionVence = `${String(od).padStart(2,'0')}/${String(om).padStart(2,'0')}/${oy+1}`;
  const opinionVencida = (oy+1) < 2026 || ((oy+1)===2026 && om < 5);
  const opinionStatus = isLiq ? 'uploaded' : opinionVencida ? 'expired' : 'uploaded';

  const cierreStatus = (s) => {
    if (isLiq) return 'uploaded'; // en liquidado todo estaba en orden
    return rng(seed + s) > 0.12 ? 'uploaded' : (rng(seed + s + 7) > 0.5 ? 'pending' : 'missing');
  };

  const cierreDocs = [
    { icon:'ph-file-signature', nombre:'Contrato de Crédito', sub:'Acuerdo principal · Firmado ante Notario',
      periodo:f.fechaInicio, fecha:f.fechaInicio, status:'uploaded', pages: 18 + Math.floor(rng(seed)*24) },
    { icon:'ph-note-pencil', nombre:'Pagaré', sub:`${f.creditType} · ${f.moneda} ${f.outstanding}`,
      periodo:f.fechaInicio, fecha:f.fechaInicio, status:'uploaded', pages: 2 },
    { icon:'ph-scales', nombre:'Opinión Legal', sub:`Vigencia hasta ${opinionVence}`,
      periodo:f.fechaInicio, fecha:f.fechaInicio, status:opinionStatus, pages: 8 + Math.floor(rng(seed+1)*12) },
    { icon:'ph-handshake', nombre:'Representaciones & Garantías', sub:'Warranties del emisor al cierre',
      periodo:f.fechaInicio, fecha:f.fechaInicio, status: cierreStatus(3), pages: 5 + Math.floor(rng(seed+2)*8) },
    ...(isCEBUR ? [
      { icon:'ph-certificate', nombre:'Prospecto de Colocación', sub:'Registrado en RNV · CNBV',
        periodo:f.fechaInicio, fecha:f.fechaInicio, status:'uploaded', pages: 120 + Math.floor(rng(seed+4)*80) },
      { icon:'ph-certificate', nombre:'Suplemento Informativo', sub:'Emisión específica · BMV/BIVA',
        periodo:f.fechaInicio, fecha:f.fechaInicio, status: cierreStatus(5), pages: 32 + Math.floor(rng(seed+5)*20) },
      { icon:'ph-stamp', nombre:'Acuerdo con Representante Común', sub:`${['Monex','CIBanco','Banco Actinver','INVEX'][seed%4]} · Custodia Indeval`,
        periodo:f.fechaInicio, fecha:f.fechaInicio, status: cierreStatus(6), pages: 14 },
    ] : []),
  ];

  const alertaOpinion = '';

  // ── CATEGORÍA 2 — DOCUMENTOS DE MONITORING ────────────
  // Se actualizan periódicamente. El campo diasSinReporte mide el lag.
  const dias = f.diasSinReporte || 0;
  const efQ1status   = dias > 45 ? 'missing' : 'uploaded';
  const cvQ1status   = dias > 45 ? (rng(seed+10)>0.5 ? 'pending' : 'missing') : 'uploaded';
  const dictStatus   = rng(seed+11) > 0.15 ? 'uploaded' : 'pending';
  const califStatus  = rng(seed+12) > 0.45 ? 'uploaded' : 'pending';
  const efQ2status   = isLiq ? 'na' : 'missing'; // Q2 2026 aún no vence

  const monitoringDocs = isLiq ? [
    { icon:'ph-file-text',  nombre:'Estado Financiero Q4 2025',     periodo:'Q4 2025',    fecha:'31/01/2026', status:'uploaded', pages:44 },
    { icon:'ph-file-text',  nombre:'Estado Financiero Q3 2025',     periodo:'Q3 2025',    fecha:'31/10/2025', status:'uploaded', pages:40 },
    { icon:'ph-shield-check',nombre:'Certificado Covenants Q4 2025',periodo:'Q4 2025',    fecha:'31/01/2026', status:'uploaded', pages:4  },
    { icon:'ph-book-open',  nombre:'Dictamen Auditado Anual 2024',  periodo:'Anual 2024', fecha:'28/02/2025', status:'uploaded', pages:102 },
  ] : [
    { icon:'ph-file-text',  nombre:'Estado Financiero Q1 2026',       periodo:'Q1 2026',    fecha:'30/04/2026', status:efQ1status, pages:42 },
    { icon:'ph-shield-check',nombre:'Certificado de Covenants Q1 2026',periodo:'Q1 2026',   fecha:'30/04/2026', status:cvQ1status, pages:4  },
    { icon:'ph-book-open',  nombre:'Dictamen Auditado Anual 2025',    periodo:'Anual 2025', fecha:'28/02/2026', status:dictStatus, pages:98 + Math.floor(rng(seed+13)*20) },
    { icon:'ph-medal',      nombre:'Reporte Calificadora',            periodo:'May 2026',   fecha:'13/05/2026', status:califStatus, pages:18 },
    { icon:'ph-file-text',  nombre:'Estado Financiero Q2 2026',       periodo:'Q2 2026',    fecha:'—', sub:'Vence 31/jul/2026', status:efQ2status, pages:null },
    { icon:'ph-shield-check',nombre:'Certificado de Covenants Q2 2026',periodo:'Q2 2026',   fecha:'—', sub:'Vence 31/jul/2026', status:'missing', pages:null },
  ];

  const alertaDias = '';

  // ── CATEGORÍA 3 — DOCUMENTOS DE EVENTOS ───────────────
  // Solo existen si ocurrió un evento específico. Condicionales.
  const eventoDocs = [];

  if (isBreach || isVenc)
    eventoDocs.push({ icon:'ph-envelope-simple-open', nombre:'Notice of Default',
      sub:'Notificación formal al Representante Común', periodo:'May 2026', fecha: isBreach ? '14/05/2026' : '—',
      status: isBreach && rng(seed+20) > 0.5 ? 'uploaded' : 'missing', pages: isBreach ? 3 : null });

  if (isBreach && rng(seed+21) > 0.4)
    eventoDocs.push({ icon:'ph-files', nombre:'Solicitud de Waiver / Dispensa',
      sub:'Dispensa temporal de covenant — requiere asamblea de tenedores', periodo:'May 2026',
      fecha: rng(seed+22) > 0.5 ? '10/05/2026' : '—',
      status: rng(seed+22) > 0.5 ? 'uploaded' : 'pending', pages: rng(seed+22) > 0.5 ? 6 : null });

  if (isRest)
    eventoDocs.push({ icon:'ph-arrows-clockwise', nombre:'Acuerdo de Reestructura',
      sub:'Modificación de términos — en negociación con tenedores', periodo:'2026',
      fecha:'—', status:'pending', pages:null });

  if (isVenc)
    eventoDocs.push({ icon:'ph-gavel', nombre:'Instrucción de Ejecución',
      sub:'Mandato al Representante Común para iniciar recuperación', periodo:'2026',
      fecha:'—', status:'missing', pages:null });

  if (isCEBUR && rng(seed+23) > 0.6)
    eventoDocs.push({ icon:'ph-users-three', nombre:'Acta de Asamblea de Tenedores',
      sub:`${rng(seed+24)>0.5?'Modificación de covenant':'Reapertura del programa'} · Quórum alcanzado`,
      periodo: `${2023 + Math.floor(rng(seed+25)*3)}/Q${1+Math.floor(rng(seed+26)*4)}`,
      fecha: `${1+Math.floor(rng(seed+27)*27)}/${1+Math.floor(rng(seed+28)*11)}/202${3+Math.floor(rng(seed+29)*3)}`,
      status:'uploaded', pages: 8 + Math.floor(rng(seed+30)*10) });

  // ── Completitud global ─────────────────────────────────
  const allDocs = [...cierreDocs, ...monitoringDocs, ...eventoDocs].filter(d => d.status !== 'na');
  const required = allDocs.filter(d => d.status !== 'na');
  const uploaded = required.filter(d => d.status === 'uploaded').length;
  const pending  = required.filter(d => d.status === 'pending').length;
  const missing  = required.filter(d => d.status === 'missing' || d.status === 'expired').length;
  const total    = required.length;
  const pct      = total > 0 ? Math.round((uploaded / total) * 100) : 100;
  const barColor = pct >= 90 ? 'var(--green)' : pct >= 70 ? '#D97706' : 'var(--red)';

  // ── Render ─────────────────────────────────────────────
  return `

    ${section('ph-folder-lock', 'Documentos de Cierre', '#0284C7',
      cierreDocs, alertaOpinion)}

    ${section('ph-chart-line-up', 'Documentos de Monitoring', '#0284C7',
      monitoringDocs, alertaDias)}

    ${eventoDocs.length > 0
      ? section('ph-lightning', 'Documentos de Eventos', '#C2410C', eventoDocs, '')
      : `<div style="padding:10px 16px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);font-size:.76rem;color:var(--text-muted);">
           <i class="ph ph-lightning" style="margin-right:6px;opacity:.5;"></i>
           Sin eventos contractuales registrados · Waiver, Notice of Default o Actas de Asamblea aparecen aquí cuando aplican.
         </div>`
    }`;
}

function buildDropdowns() {
  // Covenant Status — filtro prioritario (por job del lender)
  const covenantOpts = [
    {v:'BREACH',    l:'Breach',    col:'var(--red)',    bg:'var(--red-bg)'},
    {v:'WATCH',     l:'Watch',     col:'var(--yellow)', bg:'var(--yellow-bg)'},
    {v:'COMPLIANT', l:'Compliant', col:'var(--green)',  bg:'var(--green-bg)'},
  ];
  const breachN    = window.QUIRO_FACILITIES.filter(f=>f.status==='BREACH'    && f.estadoFacility!=='LIQUIDADO').length;
  const watchN     = window.QUIRO_FACILITIES.filter(f=>f.status==='WATCH'     && f.estadoFacility!=='LIQUIDADO').length;
  const compliantN = window.QUIRO_FACILITIES.filter(f=>f.status==='COMPLIANT' && f.estadoFacility!=='LIQUIDADO').length;
  const covenantCounts = {BREACH:breachN, WATCH:watchN, COMPLIANT:compliantN};
  document.getElementById('dd-covenant').innerHTML =
    '<div class="dd-header">Covenant Status</div>' +
    covenantOpts.map(o=>`<label>
      <input type="checkbox" value="${o.v}" onchange="filterChange('covenant','${o.v}',this.checked)">
      <span class="dd-status-dot" style="background:${o.col};"></span>
      ${o.l} <span style="margin-left:auto;font-size:.7rem;color:var(--text-muted);font-family:var(--font-mono);">${covenantCounts[o.v]}</span>
    </label>`).join('') +
    '<button class="dd-clear" onclick="clearFilter(\'covenant\')">Limpiar</button>';

  // Acreditados (borrowers únicos)
  const originators = [...new Set(window.QUIRO_FACILITIES.map(f=>f.borrower))].sort();
  document.getElementById('dd-originators').innerHTML =
    '<div class="dd-header">Acreditado</div>' +
    originators.map(o=>`<label><input type="checkbox" value="${o}" onchange="filterChange('originators','${o}',this.checked)">${o.replace(', S.A.P.I. de C.V.','').replace(', S.A. de C.V.','').replace(', S. de R.L. de C.V.','')}</label>`).join('') +
    '<button class="dd-clear" onclick="clearFilter(\'originators\')">Limpiar</button>';

  // Tipo de Crédito / Amortización
  const types = ['Bullet','Francés','Alemán','Revolvente'];
  document.getElementById('dd-facilities').innerHTML =
    '<div class="dd-header">Estructura</div>' +
    types.map(t=>`<label><input type="checkbox" value="${t}" onchange="filterChange('facilities','${t}',this.checked)">${t}</label>`).join('') +
    '<button class="dd-clear" onclick="clearFilter(\'facilities\')">Limpiar</button>';

  // Estado de Facility (ciclo de vida)
  const states = [['ACTIVO','Activo'],['EN REESTRUCTURA','En Reestructura'],['VENCIDO','Vencido'],['LIQUIDADO','Liquidado'],['SUSPENDIDO','Suspendido']];
  document.getElementById('dd-lifecycle').innerHTML =
    '<div class="dd-header">Estado</div>' +
    states.map(([v,l])=>`<label><input type="checkbox" value="${v}" onchange="filterChange('lifecycle','${v}',this.checked)">${l}</label>`).join('') +
    '<button class="dd-clear" onclick="clearFilter(\'lifecycle\')">Limpiar</button>';

  // Sprint B.4: Rating interno por bucket
  const fs = window.QUIRO_FACILITIES;
  const ratingBucketCount = (k) => fs.filter(f => {
    const r = f.ratingInterno || '';
    if (k === 'A') return /^A/.test(r);
    if (k === 'BBB') return /^BBB/.test(r);
    if (k === 'BB') return /^BB/.test(r);
    if (k === 'B') return /^B[+-]?$/.test(r);
    if (k === 'CCC') return r === 'CCC';
    return false;
  }).length;
  const ratingOpts = [
    {v:'A',   l:'A / A−',     col:'var(--green)', sub:'Investment Grade'},
    {v:'BBB', l:'BBB',         col:'var(--blue)',  sub:'Investment Grade'},
    {v:'BB',  l:'BB',          col:'var(--yellow)',sub:'High Yield'},
    {v:'B',   l:'B',           col:'var(--red)',   sub:'High Yield'},
    {v:'CCC', l:'CCC',         col:'var(--red)',   sub:'Distress'},
  ];
  document.getElementById('dd-rating').innerHTML =
    '<div class="dd-header">Rating Interno</div>' +
    ratingOpts.map(o=>`<label>
      <input type="checkbox" value="${o.v}" onchange="filterChange('rating','${o.v}',this.checked)">
      <span style="font-family:var(--font-mono);font-weight:700;color:${o.col};margin-right:6px;">${o.l}</span>
      <span style="font-size:.7rem;color:var(--text-muted);">${o.sub}</span>
      <span style="margin-left:auto;font-size:.7rem;color:var(--text-muted);font-family:var(--font-mono);">${ratingBucketCount(o.v)}</span>
    </label>`).join('') +
    '<button class="dd-clear" onclick="clearFilter(\'rating\')">Limpiar</button>';

  // Sprint B.5: Sector
  const sectors = [...new Set(fs.map(f => f.sector).filter(Boolean))].sort();
  const sectorCount = (s) => fs.filter(f => f.sector === s).length;
  document.getElementById('dd-sector').innerHTML =
    '<div class="dd-header">Sector</div>' +
    sectors.map(s=>`<label>
      <input type="checkbox" value="${s}" onchange="filterChange('sector','${s}',this.checked)">
      ${s}
      <span style="margin-left:auto;font-size:.7rem;color:var(--text-muted);font-family:var(--font-mono);">${sectorCount(s)}</span>
    </label>`).join('') +
    '<button class="dd-clear" onclick="clearFilter(\'sector\')">Limpiar</button>';

  // Sprint B.6: Moneda
  const monedas = [...new Set(fs.map(f => f.moneda).filter(Boolean))].sort();
  const monedaCount = (m) => fs.filter(f => f.moneda === m).length;
  document.getElementById('dd-moneda').innerHTML =
    '<div class="dd-header">Moneda</div>' +
    monedas.map(m=>`<label>
      <input type="checkbox" value="${m}" onchange="filterChange('moneda','${m}',this.checked)">
      ${m}
      <span style="margin-left:auto;font-size:.7rem;color:var(--text-muted);font-family:var(--font-mono);">${monedaCount(m)}</span>
    </label>`).join('') +
    '<button class="dd-clear" onclick="clearFilter(\'moneda\')">Limpiar</button>';

  // Sprint B.7: Bucket de Vencimiento
  const MAT_TODAY = new Date(2026,4,14);
  const matBucketCount = (k) => fs.filter(f => {
    if (!f.fechaVenc || f.estadoFacility === 'LIQUIDADO') return false;
    const [d,m,y] = f.fechaVenc.split('/').map(Number);
    const dt = new Date(y, m-1, d);
    const days = Math.round((dt - MAT_TODAY) / 86400000);
    if (k === 'overdue') return days < 0;
    if (k === '30d')     return days >= 0 && days <= 30;
    if (k === '90d')     return days > 30 && days <= 90;
    if (k === '12m')     return days > 90 && days <= 365;
    if (k === '>12m')    return days > 365;
    return false;
  }).length;
  const matOpts = [
    {v:'overdue', l:'Vencido', col:'var(--red)'},
    {v:'30d',     l:'≤ 30 días', col:'var(--red)'},
    {v:'90d',     l:'31–90 días', col:'var(--yellow)'},
    {v:'12m',     l:'91 días – 12 meses', col:'var(--blue)'},
    {v:'>12m',    l:'> 12 meses', col:'var(--text-secondary)'},
  ];
  document.getElementById('dd-maturity').innerHTML =
    '<div class="dd-header">Bucket de Vencimiento</div>' +
    matOpts.map(o=>`<label>
      <input type="checkbox" value="${o.v}" onchange="filterChange('maturity','${o.v}',this.checked)">
      <span style="color:${o.col};">${o.l}</span>
      <span style="margin-left:auto;font-size:.7rem;color:var(--text-muted);font-family:var(--font-mono);">${matBucketCount(o.v)}</span>
    </label>`).join('') +
    '<button class="dd-clear" onclick="clearFilter(\'maturity\')">Limpiar</button>';
}

function toggleDropdown(name, event) {
  event && event.stopPropagation();
  FILTER_GROUPS.forEach(n => {
    const dd   = document.getElementById('dd-'+n);
    const pill = document.getElementById('pill-'+n);
    if (!dd || !pill) return;
    if (n === name) {
      const isOpen = dd.style.display !== 'none';
      dd.style.display = isOpen ? 'none' : 'block';
      pill.setAttribute('aria-expanded', String(!isOpen));
      // Focus primer checkbox al abrir
      if (!isOpen) { const first = dd.querySelector('input'); if (first) first.focus(); }
    } else {
      dd.style.display = 'none';
      pill.setAttribute('aria-expanded', 'false');
    }
  });
}

function filterChange(group, value, checked) {
  if (checked) activeFilters[group].add(value); else activeFilters[group].delete(value);
  updateFilterBadge(group);
  renderFacilities();
}

function clearFilter(group) {
  activeFilters[group].clear();
  document.querySelectorAll('#dd-'+group+' input[type=checkbox]').forEach(cb => cb.checked = false);
  updateFilterBadge(group);
  renderFacilities();
}

function clearAllFilters(silent) {
  FILTER_GROUPS.forEach(g => {
    activeFilters[g].clear();
    document.querySelectorAll('#dd-'+g+' input[type=checkbox]').forEach(cb => cb.checked = false);
    updateFilterBadge(g);
  });
  window.MATURITY_FILTER = null;
  window.LATE_REPORT_FILTER = null;
  // Sprint C.12: limpiar search
  window.SEARCH_QUERY = '';
  const searchInput = document.getElementById('fac-search');
  if (searchInput) searchInput.value = '';
  renderFacilities();
}

function updateFilterBadge(group) {
  const n     = activeFilters[group].size;
  const badge = document.getElementById('badge-'+group);
  const pill  = document.getElementById('pill-'+group);
  if (badge) { badge.textContent = n; badge.style.display = n > 0 ? '' : 'none'; }
  if (pill)  {
    pill.classList.toggle('active', n > 0);
    // Mostrar check icon solo cuando hay selecciones
    let chk = pill.querySelector('i.fp-check');
    if (n > 0 && !chk) {
      chk = document.createElement('i');
      chk.className = 'ph ph-check fp-check';
      pill.insertBefore(chk, pill.firstChild);
    } else if (n === 0 && chk) {
      chk.remove();
    }
  }
}

// Cerrar dropdowns al hacer click fuera
document.addEventListener('click', e => {
  if (!e.target.closest('.filter-pill-wrap')) {
    FILTER_GROUPS.forEach(n => {
      const dd   = document.getElementById('dd-'+n);
      const pill = document.getElementById('pill-'+n);
      if (dd)   dd.style.display = 'none';
      if (pill) pill.setAttribute('aria-expanded', 'false');
    });
  }
});

// Escape cierra el dropdown activo y devuelve el foco a la pill
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  // Filter dropdowns
  FILTER_GROUPS.forEach(n => {
    const dd   = document.getElementById('dd-'+n);
    const pill = document.getElementById('pill-'+n);
    if (dd && dd.style.display !== 'none') {
      dd.style.display = 'none';
      if (pill) { pill.setAttribute('aria-expanded', 'false'); pill.focus(); }
    }
  });
  // Currency dropdown
  const ccyDd = document.getElementById('ccy-dd');
  const ccyTr = document.getElementById('ccy-trigger');
  if (ccyDd && ccyDd.classList.contains('open')) {
    ccyDd.classList.remove('open');
    if (ccyTr) { ccyTr.setAttribute('aria-expanded','false'); ccyTr.focus(); }
  }
});

// Close currency dropdown on outside click
document.addEventListener('click', e => {
  const wrap = document.getElementById('ccy-dd-wrap');
  if (wrap && !wrap.contains(e.target)) {
    const dd = document.getElementById('ccy-dd');
    const tr = document.getElementById('ccy-trigger');
    if (dd) dd.classList.remove('open');
    if (tr) tr.setAttribute('aria-expanded','false');
  }
});

/* ─── Init ───────────────────────────────────────────── */
updateCounts();
buildDropdowns();
renderFacilities();

// Badge de alertas: cuenta facilities BREACH + WATCH activas
(function updateNotifBadge() {
  const alerts = (window.QUIRO_FACILITIES || []).filter(f => f.status === 'BREACH' && f.estadoFacility !== 'LIQUIDADO').length;
  const badge  = document.getElementById('notif-badge');
  if (badge) {
    badge.textContent = alerts > 9 ? '9+' : alerts;
    badge.style.display = alerts > 0 ? '' : 'none';
  }
})();
</script>
