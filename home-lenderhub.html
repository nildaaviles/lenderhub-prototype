<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LenderHub — Home</title>

  <!-- Phosphor Icons -->
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />

  <!-- Fonts — DS CXC §2: Sofia Pro · Clear Sans · Noto Sans · Space Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;700&family=Sofia+Sans+Condensed:wght@400;500;700&family=Noto+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <!-- Sofia Pro y Clear Sans no están en Google Fonts; fallback al stack del DS -->
  <style>
    /* DS CXC §2: stack tipográfico con fallbacks correctos a fuentes del sistema */
    :root {
      --font-stack-primary: 'Sofia Pro', 'Sofia Sans', 'Noto Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-stack-ui: 'Clear Sans', 'Noto Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
  </style>

  <style>
    /* ─── CSS Variables ─────────────────────────────────────────── */
    :root {
      --primary:          #1F2733;
      --secondary:        #910057;
      --secondary-active: #840058;

      --bg:               #F8FAFC;
      --surface:          #FFFFFF;
      --border:           #E2E8F0;
      --border-strong:    #CBD5E1;
      --text:             #334155;
      --text-secondary:   #64748B;
      --text-muted:       #94A3B8;

      --green:    #16A34A; --green-bg:  #F0FDF4;
      --yellow:   #D97706; --yellow-bg: #FFFBEB;
      --red:      #DC2626; --red-bg:    #FEF2F2;
      --blue:     #0284C7; --blue-bg:   #F0F9FF;

      --radius:    8px;
      --radius-sm: 6px;
      --radius-lg: 12px;

      --shadow:    0 1px 3px rgba(0,0,0,.10), 0 1px 2px rgba(0,0,0,.06);
      --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.06);

      /* DS CXC §2: tipografía obligatoria */
      --font-primary: 'Sofia Pro', 'Sofia Sans', 'Noto Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-ui:      'Clear Sans', 'Noto Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono:    'Space Mono', monospace;

      --topbar-height: 52px;
      --sidebar-width: 220px;
    }
    /* F3.2: Tabular nums — UX skill §5.3 — los dígitos deben tener ancho fijo o las columnas no alinean */
    [class*="mono"], [style*="font-mono"], .home-kpi-val, .ov-kpi-val, .card-metric-value,
    .tbl-facility-name, td, th, .facilities-table td, .facilities-table th,
    .ov-status-amt, .ov-mat-val, .ov-rating-info, .ov-dist-pct, .ov-hist-val, .ov-hist-pct {
      font-variant-numeric: tabular-nums;
    }
    /* F4.1: Vista Risk Committee — densidad baja, foco en KPIs + excepciones (skill §10.2) */
    .rc-mode .ov-row-3,                       /* Composition row */
    .rc-mode #ov-pane-pricing,                /* Pricing tab innecesario para Comité */
    .rc-mode .ov-card-title .ov-card-sub,     /* Subtítulos verbosos */
    .rc-mode #ov-pane-capital .ov-row:not(:first-child) { /* Solo KPI strip de Capital */
      display: none !important;
    }
    .rc-mode .ov-card { padding: 12px; }
    .rc-mode .ov-kpi-val { font-size: 1.6rem; }
    .rc-mode::before {
      content: '👥 VISTA RISK COMMITTEE — Densidad baja, foco en KPIs + excepciones';
      display: block;
      padding: 8px 14px;
      background: var(--secondary);
      color: #fff;
      font-size: .75rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      margin-bottom: 12px;
    }
    /* F4.2: CSS @media print — vista PDF limpia */
    @media print {
      body { background: #fff; }
      .topbar, .sidebar, .ccy-selector, .rc-toggle-btn, .rc-export-btn,
      .ov-tab-btn, .filter-pill-wrap, .filter-result-row { display: none !important; }
      .main { margin-left: 0 !important; padding: 0 !important; }
      .main-content { padding: 0 !important; }
      .ov-card { break-inside: avoid; box-shadow: none; border: 1px solid #999; }
      .ov-row, .ov-row-2, .ov-row-3 { break-inside: avoid; }
      .ov-pane:not(.active) { display: none; }
      h1, h2 { color: #000 !important; }
    }

    /* ─── Reset ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      font-family: var(--font-ui);
      font-size: 1rem;
      color: var(--text);
      min-height: 100vh;
    }

    /* ─── Topbar ─────────────────────────────────────────────────── */
    .topbar {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--topbar-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 1100;
    }

    .topbar-logo {
      height: 24px;
      width: auto;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Notification button */
    .notif-btn {
      position: relative;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      transition: background 0.15s;
    }
    .notif-btn:hover { background: var(--border); }
    .notif-btn i { font-size: 18px; }

    .notif-badge {
      position: absolute;
      top: 2px;
      right: 2px;
      background: var(--secondary);
      color: #fff;
      font-family: var(--font-ui);
      font-size: 0.625rem;
      font-weight: 700;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 10px;
      min-width: 16px;
      text-align: center;
    }

    /* User pill */
    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px 4px 4px;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.15s;
      border: none;
      background: transparent;
    }
    .user-pill:hover { background: var(--border); }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .user-avatar i { font-size: 16px; color: #fff; }

    .user-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.2;
    }
    .user-org {
      font-family: var(--font-ui);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text);
    }
    .user-name {
      font-family: var(--font-ui);
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--text-secondary);
    }

    .user-pill .caret {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* ─── Sidebar ─────────────────────────────────────────────────── */
    .sidebar {
      background: var(--bg);
      border-right: 1px solid var(--border);
      position: fixed;
      top: var(--topbar-height);
      left: 0;
      width: var(--sidebar-width);
      height: calc(100vh - var(--topbar-height));
      overflow-y: auto;
      overflow-x: hidden;
      z-index: 1000;
      padding: 8px 0;
    }

    /* Scrollbar subtle */
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      height: 40px;
      cursor: pointer;
      border-radius: 0;
      transition: background 0.12s;
      text-decoration: none;
      color: var(--text);
    }
    .nav-item:hover { background: var(--border-strong); }
    .nav-item.active { background: var(--border); }
    .nav-item.active .nav-icon { color: var(--secondary-active); }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-icon {
      font-size: 18px;
      color: var(--text);
      flex-shrink: 0;
      width: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-label {
      font-family: var(--font-ui);
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
    }
    .nav-item.active .nav-label { font-weight: 700; }

    .nav-caret {
      font-size: 14px;
      color: var(--text-muted);
      flex-shrink: 0;
      transition: transform .2s;
    }
    .nav-item.expanded .nav-caret { transform: rotate(90deg); }

    /* Sub-items (Portfolio Monitoring) */
    .nav-subitems { overflow: hidden; }
    .nav-subitem {
      display: flex; align-items: center; gap: 10px;
      padding: 0 14px 0 44px; height: 34px; cursor: pointer;
      font-size: 0.85rem; font-weight: 500; color: var(--text-secondary);
      text-decoration: none; transition: background 0.12s;
      border-left: 2px solid transparent;
    }
    .nav-subitem:hover { background: var(--border-strong); color: var(--text); }
    .nav-subitem.active {
      color: var(--secondary-active); font-weight: 700;
      border-left-color: var(--secondary-active);
      background: rgba(145,0,87,0.06);
    }
    /* Focus visible — accesibilidad WCAG 2.4.7 */
    .nav-item:focus-visible,
    .nav-subitem:focus-visible,
    .filter-pill:focus-visible,
    .type-tab:focus-visible,
    .notif-btn:focus-visible,
    .user-pill:focus-visible { outline: 2px solid var(--secondary); outline-offset: 2px; }

    /* ─── Sections (SPA routing) ─────────────────────────────────── */
    .section { display: none; }
    .section.active { display: block; }

    /* ─── Page Header ────────────────────────────────────────────── */
    .page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
    .page-title  { font-family: var(--font-primary); font-size: 2.0rem; font-weight: 700; color: var(--text); line-height: 1.2; }
    .page-subtitle { font-size: 0.9rem; color: var(--text-secondary); margin-top: 4px; }
    .btn-primary {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 0 16px; height: 36px; border-radius: var(--radius-sm);
      background: var(--primary); color: #fff;
      font-family: var(--font-ui); font-size: 0.85rem; font-weight: 500;
      border: none; cursor: pointer; transition: background .15s; white-space: nowrap;
    }
    .btn-primary:hover { background: #2d3a4a; }
    .btn-primary:focus-visible { outline: 2px solid var(--secondary); outline-offset: 2px; }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary i { font-size: 14px; }

    /* ─── Currency selector ──────────────────────────────────────── */
    .ccy-selector { display:flex; align-items:center; gap:6px; flex-shrink:0; overflow:visible; }
    .ccy-label    { font-size:.75rem; font-weight:500; color:var(--text-secondary); font-family:var(--font-ui); }
    .ccy-info-wrap { position:relative; display:inline-flex; align-items:center; }
    .ccy-info-btn  { background:none; border:none; cursor:pointer; color:var(--text-muted); padding:0; display:flex; align-items:center; line-height:1; }
    .ccy-info-btn i { font-size:14px; }
    .ccy-info-btn:hover { color:var(--text-secondary); }
    .ccy-tooltip {
      display: none; position: absolute;
      top: calc(100% + 8px); left: 50%; transform: translateX(-50%);
      width: 220px; background: #1E293B; color: #fff;
      border-radius: var(--radius-sm); padding: 10px 12px;
      font-size: .75rem; line-height: 1.5; z-index: 9999;
      font-family: var(--font-ui); font-weight: 400;
      pointer-events: none; white-space: normal;
      box-shadow: var(--shadow-md);
    }
    .ccy-tooltip::before {
      content: ''; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
      border: 5px solid transparent; border-bottom-color: #1E293B;
    }
    .ccy-info-wrap { overflow: visible !important; }
    .ccy-info-wrap:hover .ccy-tooltip { display: block; }
    .ccy-dd-wrap  { position: relative; }
    .ccy-trigger  {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 10px; border: 1px solid var(--border);
      border-radius: var(--radius-sm); background: var(--surface);
      font-family: var(--font-ui); font-size: .82rem; font-weight: 500;
      color: var(--text); cursor: pointer; min-width: 94px;
      transition: border-color .12s;
    }
    .ccy-trigger:hover { border-color: var(--border-strong); }
    .ccy-trigger:focus-visible { outline: 2px solid var(--secondary); outline-offset: 2px; }
    .ccy-trigger i { font-size: 11px; color: var(--text-muted); margin-left: auto; transition: transform .15s; }
    .ccy-trigger[aria-expanded="true"] i { transform: rotate(180deg); }
    .ccy-dd {
      display: none; position: absolute; top: calc(100% + 4px); right: 0;
      min-width: 110px; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      box-shadow: var(--shadow-md); z-index: 200; overflow: hidden;
    }
    .ccy-dd.open { display: block; }
    .ccy-opt {
      display: flex; align-items: center; gap: 8px;
      width: 100%; padding: 8px 12px; border: none;
      background: var(--surface); cursor: pointer;
      font-family: var(--font-ui); font-size: .82rem;
      font-weight: 400; color: var(--text); text-align: left;
      transition: background .1s;
    }
    .ccy-opt:hover  { background: var(--bg); }
    .ccy-opt.active { background: var(--bg); font-weight: 700; }

    /* ─── Filters ────────────────────────────────────────────────── */
    .filters-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
    .filter-pill {
      display: inline-flex; align-items: center; gap: 6px;
      height: 36px; padding: 0 12px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--surface);
      font-family: var(--font-ui); font-size: 0.82rem; color: var(--text-secondary);
      cursor: pointer; transition: border-color .12s, color .12s, background .12s;
    }
    .filter-pill:hover { border-color: var(--border-strong); color: var(--text); }
    .filter-pill.active {
      border-color: var(--secondary); color: var(--secondary);
      background: rgba(145,0,87,.08); font-weight: 500;
    }
    .filter-pill.active .fp-caret { transform: rotate(0deg); }  /* caret stays down when active but filter has selections */
    .filter-pill i.fp-caret { font-size: 11px; transition: transform .15s; }
    .filter-pill[aria-expanded="true"] i.fp-caret { transform: rotate(180deg); }
    .filter-pill i.fp-check { font-size: 12px; color: var(--secondary); }

    /* Result row (clear all button only) */
    .filter-result-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; min-height: 0; }
    .filter-result-count { font-size: .78rem; color: var(--text-muted); font-family: var(--font-ui); }
    .filter-result-count strong { color: var(--text); font-weight: 700; }

    /* Facilities Stat Bar — barra horizontal unida */
    .fac-stats {
      display: flex; align-items: stretch;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-lg); margin-bottom: 14px;
      grid-column: 1 / -1; /* span full width when inside cards-grid */
    }
    .fac-stat {
      flex: 1 1 0; min-width: 0; padding: 14px 20px;
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; justify-content: center;
    }
    .fac-stat:last-child { border-right: none; }
    .fac-stat-lbl {
      font-size: .62rem; color: var(--text-muted);
      font-family: var(--font-ui); font-weight: 700;
      text-transform: uppercase; letter-spacing: .5px;
      margin-bottom: 4px; white-space: nowrap;
    }
    .fac-stat-val {
      font-family: var(--font-mono); font-size: 1.25rem; font-weight: 700;
      color: var(--text); line-height: 1.2; letter-spacing: -.3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .fac-stat-meta {
      font-size: .62rem; color: var(--text-secondary); font-family: var(--font-ui);
      margin-top: 2px; white-space: nowrap;
    }
    @media (max-width: 760px) {
      .fac-stats { flex-wrap: wrap; }
      .fac-stat { flex: 1 1 48%; border-bottom: 1px solid var(--border); }
      .fac-stat:nth-last-child(-n+2) { border-bottom: none; }
    }
    .filter-clear-all {
      display: none; align-items: center; gap: 6px;
      padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border);
      background: none; font-size: .75rem; color: var(--text-secondary);
      font-family: var(--font-ui); cursor: pointer; transition: all .12s;
    }
    .filter-clear-all:hover { border-color: var(--red); color: var(--red); }
    .filter-clear-all.visible { display: inline-flex; }
    .filter-clear-all i { font-size: 11px; }

    /* ─── Facilities cards grid ──────────────────────────────────── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    @media (max-width: 780px) { .cards-grid { grid-template-columns: 1fr; } }

    .facility-card {
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 18px 18px 14px; cursor: pointer;
      transition: box-shadow .15s, border-color .15s;
      display: flex; flex-direction: column; gap: 12px;
      background: var(--surface);
    }
    .facility-card:hover { box-shadow: var(--shadow-md); border-color: var(--border-strong); }

    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .card-lender { font-size: 0.68rem; font-weight: 700; color: var(--text-muted); letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 2px; }
    .card-name { font-size: 0.95rem; font-weight: 700; color: var(--text); letter-spacing: -0.2px; line-height: 1.25; }
    .card-servicer {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.78rem; color: var(--text-secondary);
      padding-left: 8px; border-left: 2px solid var(--secondary); margin-top: 5px;
    }
    .card-servicer i { font-size: 12px; color: var(--text-muted); }

    /* Badges */
    .fc-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 9px; border-radius: 20px;
      font-size: 0.72rem; font-weight: 700; white-space: nowrap; flex-shrink: 0;
    }
    .fc-badge-compliant { background: var(--green-bg);  color: var(--green);  border: 1px solid var(--green-bg); }
    .fc-badge-watch     { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-bg); }
    .fc-badge-breach    { background: var(--red-bg);    color: var(--red);    border: 1px solid var(--red-bg); }

    /* Metric */
    .card-metric-label    { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }
    .card-metric-value    { font-size: 2.0rem; font-weight: 700; letter-spacing: -1px; color: var(--text); line-height: 1; margin: 4px 0; font-family: var(--font-mono); }
    .card-metric-required { font-size: 0.75rem; color: var(--text-muted); }

    /* Chart */
    .card-chart-title { font-size: 0.75rem; font-weight: 700; color: var(--secondary); letter-spacing: 0.1px; margin-bottom: 6px; }

    /* Legend */
    .card-legend { display: flex; gap: 16px; margin-top: 6px; }
    .fc-legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.7rem; color: var(--text-muted); }
    .leg-line { width: 22px; height: 0; position: relative; }
    .leg-line::before { content: ''; position: absolute; top: -3px; left: 7px; width: 6px; height: 6px; border-radius: 50%; }
    .leg-required { border-top: 2px dashed var(--text-muted); }
    .leg-required::before { background: white; border: 1.5px solid var(--text-muted); }
    .leg-reported { border-top: 2px solid var(--secondary); }
    .leg-reported::before { background: var(--secondary); border: 1.5px solid white; }

    /* Card footer */
    .card-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 10px; border-top: 1px solid var(--border);
      font-size: 0.72rem; color: var(--text-muted);
    }
    .card-footer-status { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; font-weight: 500; color: var(--text-secondary); }
    .dot-active     { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    .dot-inactive   { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); }
    .dot-vencido    { width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
    .dot-liquidado  { width: 7px; height: 7px; border-radius: 50%; background: #64748B; }
    .dot-restruct   { width: 7px; height: 7px; border-radius: 50%; background: #D97706; }
    .dot-suspended  { width: 7px; height: 7px; border-radius: 50%; background: #EA580C; }

    /* ─── Type filter tabs — patrón underline (DS consistente con ov-tab-nav) ── */
    .type-tabs { display: flex; gap: 2px; margin-bottom: 16px; flex-wrap: wrap; border-bottom: 2px solid var(--border); }
    .type-tab {
      padding: 8px 18px; border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      font-family: var(--font-ui); font-size: 0.82rem; font-weight: 500;
      border: none; border-bottom: 2px solid transparent; margin-bottom: -2px;
      background: none; color: var(--text-secondary); cursor: pointer; transition: color .15s, border-color .15s;
    }
    .type-tab:hover { color: var(--primary); background: var(--bg); }
    .type-tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 700; }
    .type-tab.quiro.active { color: var(--secondary); border-bottom-color: var(--secondary); }
    .type-tab.abs.active   { color: var(--blue); border-bottom-color: var(--blue); }

    /* Tipo badge on card / table */
    .card-tipo { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.2px; margin-top: 4px; }
    .card-tipo-abs   { background: var(--blue-bg); color: var(--blue); }
    .card-tipo-quiro { background: rgba(145,0,87,0.08); color: var(--secondary); }

    /* ─── Facilities table ───────────────────────────────────────── */
    .tbl-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow-y: auto;
      max-height: calc(100vh - 340px);
      grid-column: 1 / -1; /* span all grid columns when inside cards-grid */
    }
    .facilities-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .facilities-table thead { position: sticky; top: 0; z-index: 2; }
    .facilities-table thead th {
      background: #F8FAFC; padding: 10px 16px;
      text-align: left; font-size: 0.72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-muted);
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    .facilities-table thead th.sortable { cursor: pointer; user-select: none; transition: color .12s, background .12s; }
    .facilities-table thead th.sortable:hover { color: var(--primary); background: #F1F5F9; }
    .facilities-table tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
    .facilities-table tbody tr:last-child { border-bottom: none; }
    .facilities-table tbody tr:hover { background: #F8FAFC; }
    .facilities-table td { padding: 12px 16px; vertical-align: middle; }
    .tbl-facility-name { font-family: var(--font-mono); font-weight: 700; color: var(--text); font-size: 0.82rem; white-space: nowrap; }
    .tbl-estado { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--text-secondary); font-weight: 500; }

    /* ─── Main ───────────────────────────────────────────────────── */
    .main {
      margin-left: var(--sidebar-width);
      margin-top: var(--topbar-height);
      padding: 24px;
      min-height: calc(100vh - var(--topbar-height));
    }

    .main-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px;
      min-height: calc(100vh - var(--topbar-height) - 48px);
    }
    /* Home empty state centers itself */
    #section-home.active { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - var(--topbar-height) - 96px); }
    .home-header { margin-bottom: 24px; }
    .home-header h1 { font-size: 1.25rem; font-weight: 700; color: var(--primary); margin-bottom: 2px; }
    .home-header p  { font-size: 0.82rem; color: var(--text-secondary); }
    .home-kpi-grid  { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .home-kpi       { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; }
    .home-kpi-lbl   { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); margin-bottom: 4px; }
    .home-kpi-val   { font-size: 1.6rem; font-weight: 700; color: var(--primary); line-height: 1; margin-bottom: 4px; font-family: var(--font-mono); }
    .home-kpi-sub   { font-size: .72rem; color: var(--text-secondary); }
    .home-alerts-hdr{ font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); margin-bottom: 10px; }
    .home-alert-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); margin-bottom: 8px; cursor: pointer; transition: background .12s; }
    .home-alert-row:hover { background: var(--bg); }
    .home-alert-name{ font-family: var(--font-mono); font-size: .8rem; font-weight: 700; color: var(--primary); flex: 1; }
    .home-alert-bwr { font-size: .78rem; color: var(--text-secondary); flex: 2; }
    .home-alert-amt { font-size: .8rem; font-weight: 700; color: var(--text); font-family: var(--font-mono); white-space: nowrap; }
    .home-two-col   { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .home-section   { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
    .home-section-title { font-size: .82rem; font-weight: 700; color: var(--primary); margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
    .home-dist-row  { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .home-dist-lbl  { font-size: .78rem; color: var(--text-secondary); width: 90px; }
    .home-dist-bar  { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
    .home-dist-fill { height: 100%; border-radius: 4px; }
    .home-dist-val  { font-size: .78rem; font-weight: 700; width: 32px; text-align: right; color: var(--text); }

    /* ─── Overview Dashboard ────────────────────────────────────── */
    .ov-strip       { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:20px; }
    @media (max-width:1200px) { .ov-strip { grid-template-columns:repeat(3,1fr); } }
    @media (max-width:780px)  { .ov-strip { grid-template-columns:repeat(2,1fr); } }
    .ov-kpi         { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; }
    .ov-kpi-lbl     { font-size:.65rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--text-muted); margin-bottom:4px; }
    .ov-kpi-val     { font-size:1.4rem; font-weight:700; font-family:var(--font-mono); color:var(--primary); line-height:1.1; }
    .ov-kpi-sub     { font-size:.68rem; color:var(--text-secondary); margin-top:3px; }
    .ov-row         { display:grid; gap:16px; margin-bottom:16px; }
    .ov-row-2       { grid-template-columns:1fr 1fr; }
    .ov-row-3       { grid-template-columns:repeat(3,1fr); }
    .ov-row-25      { grid-template-columns:2fr 1fr; }
    .ov-row-12      { grid-template-columns:1fr 2fr; }
    .ov-card        { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; }
    .ov-card-title  { font-size:.78rem; font-weight:700; color:var(--primary); margin-bottom:14px; display:flex; align-items:center; gap:6px; }
    .ov-card-sub    { font-size:.65rem; color:var(--text-muted); font-weight:400; margin-left:auto; }
    /* Status blocks */
    .ov-status-block{ display:flex; flex-direction:column; gap:10px; }
    .ov-status-row  { display:flex; align-items:center; gap:10px; }
    .ov-status-dot  { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .ov-status-lbl  { font-size:.78rem; color:var(--text-secondary); width:80px; }
    .ov-status-bar  { flex:1; height:8px; background:var(--border); border-radius:4px; overflow:hidden; }
    .ov-status-fill { height:100%; border-radius:4px; }
    .ov-status-n    { font-size:.72rem; font-family:var(--font-mono); font-weight:700; width:28px; text-align:right; color:var(--text); }
    .ov-status-amt  { font-size:.68rem; color:var(--text-secondary); width:52px; text-align:right; }
    /* Rating stacked */
    .ov-rating-row  { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
    .ov-rating-badge{ font-size:.65rem; font-weight:700; padding:2px 7px; border-radius:4px; width:52px; text-align:center; flex-shrink:0; }
    .ov-rating-bar  { flex:1; height:7px; background:var(--border); border-radius:3px; overflow:hidden; }
    .ov-rating-fill { height:100%; border-radius:3px; }
    .ov-rating-info { font-size:.68rem; color:var(--text-secondary); width:70px; text-align:right; white-space:nowrap; }
    /* ICR distribution */
    .ov-icr-row     { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
    .ov-icr-lbl     { font-size:.73rem; color:var(--text-secondary); width:70px; flex-shrink:0; }
    .ov-icr-bar     { flex:1; height:7px; background:var(--border); border-radius:3px; overflow:hidden; }
    .ov-icr-fill    { height:100%; border-radius:3px; }
    .ov-icr-val     { font-size:.68rem; font-weight:700; width:32px; text-align:right; color:var(--text); }
    /* Horizontal dist */
    .ov-dist-row    { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
    .ov-dist-lbl    { font-size:.73rem; color:var(--text-secondary); flex:1.2; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .ov-dist-bar    { flex:2; height:7px; background:var(--border); border-radius:3px; overflow:hidden; }
    .ov-dist-fill   { height:100%; border-radius:3px; }
    .ov-dist-pct    { font-size:.68rem; font-weight:700; width:32px; text-align:right; color:var(--text); }
    /* Maturity bars */
    .ov-mat-row     { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
    .ov-mat-lbl     { font-size:.72rem; color:var(--text-secondary); width:110px; flex-shrink:0; }
    .ov-mat-bar     { flex:1; height:10px; background:var(--border); border-radius:4px; overflow:hidden; }
    .ov-mat-fill    { height:100%; border-radius:4px; }
    .ov-mat-val     { font-size:.7rem; font-family:var(--font-mono); font-weight:700; width:48px; text-align:right; color:var(--text); }
    .ov-mat-n       { font-size:.65rem; color:var(--text-muted); width:28px; text-align:right; }
    /* Risk table */
    .ov-tbl         { width:100%; border-collapse:collapse; font-size:.76rem; }
    .ov-tbl th      { font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--text-muted); padding:0 8px 8px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap; }
    .ov-tbl td      { padding:7px 8px; border-bottom:1px solid var(--border); vertical-align:middle; }
    .ov-tbl tr:last-child td { border-bottom:none; }
    .ov-tbl tr      { cursor:pointer; transition:background .1s; }
    .ov-tbl tr:hover td { background:var(--bg); }
    .ov-tbl .mono   { font-family:var(--font-mono); font-weight:700; font-size:.72rem; }
    /* Mini badge */
    .ov-badge       { display:inline-block; font-size:.62rem; font-weight:700; padding:1px 6px; border-radius:3px; }
    /* Concentration bar (full-width stacked) */
    .ov-conc-track  { display:flex; height:14px; border-radius:6px; overflow:hidden; gap:1px; margin-bottom:10px; }
    .ov-conc-seg    { height:100%; transition:width .3s; }
    .ov-conc-legend { display:flex; flex-wrap:wrap; gap:6px 14px; }
    .ov-conc-item   { display:flex; align-items:center; gap:6px; font-size:.68rem; color:var(--text-secondary); }
    .ov-conc-dot    { width:8px; height:8px; border-radius:2px; flex-shrink:0; }

    /* ─── Overview Tabs ─────────────────────────────────────────── */
    .ov-tab-nav     { display:flex; gap:2px; margin-bottom:20px; border-bottom:2px solid var(--border); }
    .ov-tab-btn     { padding:8px 18px; font-size:.78rem; font-weight:500; color:var(--text-secondary); background:none; border:none; border-bottom:2px solid transparent; margin-bottom:-2px; cursor:pointer; transition:color .15s, border-color .15s; border-radius:var(--radius-sm) var(--radius-sm) 0 0; white-space:nowrap; font-family:var(--font-ui); }
    .ov-tab-btn:hover { color:var(--primary); background:var(--bg); }
    .ov-tab-btn.active { color:var(--secondary); border-bottom-color:var(--secondary); font-weight:700; }
    .ov-tab-btn:focus-visible { outline:2px solid var(--secondary); outline-offset:2px; }
    .ov-pane        { display:none; }
    .ov-pane.active { display:block; }

    /* Responsive ov-row grids */
    @media (max-width:1100px) { .ov-row-2 { grid-template-columns:1fr; } .ov-row-3 { grid-template-columns:1fr 1fr; } }
    @media (max-width:780px)  { .ov-row-3 { grid-template-columns:1fr; } }

    /* Pricing & WAL specific */
    .ov-hist-row    { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
    .ov-hist-lbl    { font-size:.72rem; color:var(--text-secondary); width:96px; flex-shrink:0; }
    .ov-hist-bar    { flex:1; height:18px; background:var(--border); border-radius:3px; overflow:hidden; position:relative; }
    .ov-hist-fill   { height:100%; border-radius:3px; display:flex; align-items:center; padding-left:6px; font-size:.62rem; font-weight:700; color:#fff; white-space:nowrap; min-width:2px; }
    .ov-hist-val    { font-size:.68rem; font-family:var(--font-mono); font-weight:700; width:42px; text-align:right; color:var(--text); }
    .ov-hist-pct    { font-size:.65rem; color:var(--text-muted); width:30px; text-align:right; }

    /* ─── Roll Rate Heatmap ─────────────────────────────────────── */
    .rr-grid        { display:grid; gap:2px; }
    .rr-cell        { display:flex; align-items:center; justify-content:center; font-size:.62rem; font-family:var(--font-mono); font-weight:700; border-radius:3px; min-height:28px; min-width:0; }
    .rr-hdr         { font-size:.58rem; font-weight:700; text-transform:uppercase; letter-spacing:.3px; color:var(--text-muted); display:flex; align-items:center; justify-content:center; }
    .rr-row-lbl     { font-size:.68rem; font-weight:700; color:var(--text-secondary); display:flex; align-items:center; padding-right:4px; }
    /* ─── Vintage Chart ──────────────────────────────────────────── */
    .vint-legend     { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:10px; }
    .vint-item       { display:flex; align-items:center; gap:6px; font-size:.68rem; color:var(--text-secondary); cursor:pointer; }
    .vint-dot        { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

    /* ─── Empty State ────────────────────────────────────────────── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
      padding: 48px 24px;
    }

    .empty-icon-wrap {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      line-height: 1;
    }

    .empty-title {
      font-family: var(--font-primary);
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }

    .empty-sub {
      font-family: var(--font-ui);
      font-size: 1rem;
      font-weight: 400;
      color: var(--text-secondary);
      max-width: 420px;
      line-height: 1.5;
    }

    /* ── Quirografario Detail Panel ─────────────────────────── */
    .qd-back { display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);font-size:0.82rem;font-weight:500;color:var(--text-secondary);cursor:pointer;margin-bottom:16px;transition:all .12s; }
    .qd-back:hover { border-color:var(--secondary);color:var(--secondary); }
    .qd-header { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:14px; }
    .qd-name { font-family:var(--font-primary);font-size:1.2rem;font-weight:700;color:var(--text);display:flex;align-items:center;gap:10px;flex-wrap:wrap; }
    .qd-meta { display:flex;gap:18px;margin-top:10px;font-size:0.78rem;color:var(--text-secondary);flex-wrap:wrap; }
    .qd-meta span { display:flex;align-items:center;gap:4px; }
    .qd-alert { display:flex;align-items:flex-start;gap:8px;padding:10px 14px;border-radius:var(--radius-sm);font-size:0.8rem;margin-bottom:12px;line-height:1.5; }
    .qd-alert-breach { background:#FEF2F2;border:1px solid var(--red);color:#DC2626; }
    .qd-alert-watch  { background:var(--yellow-bg);border:1px solid var(--yellow);color:#D97706; }
    .qd-alert-info   { background:var(--blue-bg);border:1px solid var(--blue);color:#0284C7; }
    .qd-alert-pending { background:var(--bg);border:1px solid var(--border-strong);color:var(--text-secondary); }
    .qd-kpi-row { display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px; }
    .qd-kpi { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px; }
    .qd-kpi-label { font-size:0.68rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px; }
    .qd-kpi-val { font-size:1.25rem;font-weight:700;color:var(--text);line-height:1.2; }
    .qd-kpi-val.alert { color:var(--red); }
    .qd-kpi-sub { font-size:0.72rem;color:var(--text-muted);margin-top:3px; }
    .qd-grid { display:grid;grid-template-columns:2fr 1fr;gap:14px; }
    .qd-left,.qd-right { display:flex;flex-direction:column;gap:14px; }
    .qd-card { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden; }
    .qd-card-hdr { display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--border); }
    .qd-card-title { font-size:0.85rem;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px; }
    .qd-card-sub { font-size:0.72rem;color:var(--text-muted); }
    .qd-cv-table { width:100%;border-collapse:collapse;font-size:0.82rem; }
    .qd-cv-table th { padding:8px 16px;font-size:0.68rem;font-weight:700;color:var(--text-muted);background:var(--bg);text-transform:uppercase;letter-spacing:.4px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap; }
    .qd-cv-table td { padding:10px 16px;border-bottom:1px solid var(--border);vertical-align:middle; }
    .qd-cv-table tr:last-child td { border-bottom:none; }
    .qd-cv-table tr.breach-row { background:rgba(220,38,38,.03); }
    .qd-cv-table tr.watch-row  { background:rgba(217,119,6,.03); }
    .qd-cv-name { font-weight:700;color:var(--text);font-size:0.82rem; }
    .qd-cv-desc { font-size:0.7rem;color:var(--text-muted);margin-top:1px; }
    .qd-cv-ok    { color:var(--green);font-weight:700;font-size:0.78rem; }
    .qd-cv-watch { color:var(--yellow);font-weight:700;font-size:0.78rem; }
    .qd-cv-breach{ color:var(--red);font-weight:700;font-size:0.78rem; }
    .qd-cv-pending { color:var(--text-muted);font-weight:500;font-size:0.78rem; }
    .qd-bar-wrap { width:72px;height:5px;background:var(--border);border-radius:3px;display:inline-block;position:relative;vertical-align:middle; }
    .qd-bar-fill { height:100%;border-radius:3px;position:absolute;top:0;left:0; }
    .qd-bar-thresh { position:absolute;top:-4px;width:2px;height:13px;background:var(--red);border-radius:1px; }
    /* ─── Payment Schedule (redesign) ─────────────────────── */
    .ps-hdr { display:flex;justify-content:space-between;align-items:flex-start;padding:14px 18px 10px; }
    .ps-hdr-left h3 { font-size:.88rem;font-weight:700;color:var(--text);margin:0;display:flex;align-items:center;gap:6px; }
    .ps-hdr-left p  { font-size:.72rem;color:var(--text-muted);margin:4px 0 0; }
    .ps-hdr-actions { display:flex;gap:8px;flex-shrink:0; }
    .ps-btn-gen  { display:flex;align-items:center;gap:6px;padding:6px 12px;border:1.5px solid var(--yellow);border-radius:var(--radius-sm);background:transparent;color:var(--yellow);font-size:.75rem;font-weight:700;cursor:pointer;font-family:var(--font-ui); }
    .ps-btn-gen:hover { background:var(--yellow-bg); }
    .ps-btn-edit { display:flex;align-items:center;gap:5px;padding:5px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text-secondary);font-size:.75rem;font-weight:500;cursor:pointer;font-family:var(--font-ui); }
    .ps-btn-edit:hover { border-color:var(--border-strong);color:var(--text); }
    .ps-divider { border:none;border-top:1px solid var(--border);margin:0; }
    .ps-col-hdr { display:grid;grid-template-columns:130px 1fr 140px 100px;gap:16px;padding:7px 18px;background:var(--bg);font-size:.67rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border); }
    .ps-row { display:grid;grid-template-columns:130px 1fr 140px 100px;gap:16px;padding:11px 18px;border-bottom:1px solid var(--border);font-size:.8rem;align-items:start;transition:background .1s; }
    .ps-row:last-child { border-bottom:none; }
    .ps-row:hover { background:var(--bg); }
    .ps-row.ps-next    { background:rgba(245,158,11,.05);border:1px solid var(--yellow);border-radius:var(--radius-sm);margin:4px 12px;padding:10px 6px; }
    .ps-row.ps-overdue { background:rgba(220,38,38,.04);border-left:3px solid var(--red); }
    .ps-row.ps-paid    { opacity:.6; }
    .ps-row.ps-bullet  { background:rgba(220,38,38,.02); }
    .ps-date     { font-weight:700;color:var(--text);font-size:.8rem; }
    .ps-date.ps-paid-date { font-weight:400;color:var(--text-muted); }
    .ps-concept  { display:flex;flex-direction:column;gap:2px;color:var(--text-secondary);font-size:.78rem; }
    .ps-concept-main { display:flex;align-items:center;gap:6px; }
    .ps-concept-sub  { font-size:.67rem;color:var(--text-muted);font-family:var(--font-mono);line-height:1.3;padding-left:2px; }
    .ps-tag-next { display:inline-block;padding:1px 7px;border-radius:20px;background:var(--yellow);color:#fff;font-size:.62rem;font-weight:700;letter-spacing:.3px;margin-left:6px; }
    .ps-amount   { text-align:right;font-weight:700;font-family:var(--font-mono);font-size:.8rem;color:var(--text); }
    .ps-amount.ps-bullet-amt { color:var(--red); }
    .ps-badge    { display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:.68rem;font-weight:700;white-space:nowrap; }
    .ps-badge-next     { background:var(--yellow-bg);color:var(--yellow);border:1px solid #FFFBEB; }
    .ps-badge-pending  { background:var(--yellow-bg);color:var(--yellow);border:1px solid #FFFBEB;opacity:.7; }
    .ps-badge-paid     { background:var(--green-bg);color:var(--green);border:1px solid #F0FDF4; }
    .ps-badge-overdue  { background:var(--red-bg);color:var(--red);border:1px solid #FECACA; }
    .ps-past-sep { padding:6px 18px;font-size:.67rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;background:var(--bg);border-top:1px solid var(--border);border-bottom:1px solid var(--border); }
    .qd-info-row   { display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:0.8rem; }
    .qd-info-row:last-child { border-bottom:none; }
    .qd-info-label { color:var(--text-secondary); }
    .qd-info-val   { font-weight:500;color:var(--text);text-align:right; }
    .qd-tasa-line  { display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:0.8rem; }
    .qd-tasa-line:last-child { border-bottom:none; }
    .qd-tasa-lbl   { color:var(--text-secondary); }
    .qd-tasa-val   { font-weight:700;color:var(--text);font-family:var(--font-mono); }
    .qd-tasa-total { display:flex;justify-content:space-between;align-items:center;background:rgba(145,0,87,.06);border-radius:var(--radius-sm);padding:10px 14px;margin:12px 18px 14px; }
    .qd-tasa-total-lbl { font-size:0.8rem;font-weight:700;color:var(--secondary); }
    .badge-reest  { background:var(--yellow-bg);color:var(--yellow);border-radius:20px;padding:2px 8px;font-size:0.68rem;font-weight:700; }
    .badge-liq    { background:var(--green-bg);color:var(--green);border-radius:20px;padding:2px 8px;font-size:0.68rem;font-weight:700; }
    .badge-susp   { background:var(--red-bg);color:var(--red);border-radius:20px;padding:2px 8px;font-size:0.68rem;font-weight:700; }
    .badge-pend   { background:var(--bg);color:var(--text-muted);border:1px solid var(--border-strong);border-radius:20px;padding:2px 8px;font-size:0.68rem;font-weight:700; }
    #section-quiro-detail { padding:0; }

    /* ─── Financieros (Quiro) ────────────────────────────────── */
    .fin-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
    .fin-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); }
    .fin-card-hdr { display:flex; justify-content:space-between; align-items:center; padding:14px 18px 12px; border-bottom:1px solid var(--border); }
    .fin-card-title { font-size:0.85rem; font-weight:700; color:var(--text); display:flex; align-items:center; gap:8px; }
    .fin-card-sub { font-size:0.72rem; color:var(--text-muted); }
    .fin-table { width:100%; border-collapse:collapse; font-size:0.8rem; }
    .fin-table th { padding:8px 14px; text-align:right; font-weight:700; color:var(--text-secondary); font-size:0.73rem; border-bottom:1px solid var(--border); background:var(--bg); }
    .fin-table th:first-child { text-align:left; }
    .fin-table td { padding:8px 14px; text-align:right; border-bottom:1px solid var(--border); color:var(--text); }
    .fin-table td:first-child { text-align:left; color:var(--text-secondary); font-size:0.78rem; }
    .fin-table tr.fin-subtotal td { font-weight:700; background:rgba(145,0,87,.04); color:var(--secondary); }
    .fin-table tr:last-child td { border-bottom:none; }
    .fin-bar-row { display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px solid var(--border); font-size:0.8rem; }
    .fin-bar-row:last-child { border-bottom:none; }
    .fin-bar-label { width:140px; flex-shrink:0; color:var(--text-secondary); font-size:0.78rem; }
    .fin-bar-track { flex:1; height:8px; background:var(--border); border-radius:4px; overflow:hidden; }
    .fin-bar-fill  { height:100%; border-radius:4px; background:var(--secondary); }
    .fin-bar-val   { width:70px; text-align:right; font-weight:700; font-family:var(--font-mono); font-size:0.78rem; color:var(--text); }
    .fin-kpi-row { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:14px; }
    .fin-kpi { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 18px; }
    .fin-kpi-lbl { font-size:0.72rem; color:var(--text-muted); margin-bottom:4px; }
    .fin-kpi-val { font-size:1.35rem; font-weight:700; font-family:var(--font-mono); color:var(--text); line-height:1; }
    .fin-kpi-sub { font-size:0.7rem; color:var(--text-secondary); margin-top:4px; }
    .fin-trend-up   { color:var(--green); }
    .fin-trend-down { color:var(--red); }

    /* ─── ABS Detail ──────────────────────────────────────────── */
    #section-abs-detail { padding:0; }

    /* Tab bar */
    .abd-tab-bar {
      display:flex; gap:0; border-bottom:2px solid var(--border);
      margin-bottom:20px; background:var(--surface);
      border-radius:var(--radius) var(--radius) 0 0;
      padding:0 24px;
    }
    .abd-tab {
      display:flex; align-items:center; gap:8px;
      padding:14px 18px 12px; font-size:0.85rem; font-weight:500;
      color:var(--text-secondary); cursor:pointer; border:none; background:none;
      border-bottom:2px solid transparent; margin-bottom:-2px;
      transition:color .15s, border-color .15s; white-space:nowrap;
      font-family:var(--font-ui);
    }
    .abd-tab:hover { color:var(--text); }
    .abd-tab.active { color:var(--secondary); border-bottom-color:var(--secondary); font-weight:700; }
    .abd-tab i { font-size:15px; }

    /* Tab content panes */
    .abd-pane { display:none; }
    .abd-pane.active { display:block; }

    /* Financieros layout */

    /* Report Repository — Paquete Contractual */
    .rr-completitud { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 18px; margin-bottom:14px; }
    .rr-comp-bar-track { height:6px; background:var(--border); border-radius:3px; overflow:hidden; margin:8px 0 6px; }
    .rr-comp-bar-fill  { height:100%; border-radius:3px; transition:width .4s; }
    .rr-comp-stats { display:flex; gap:18px; font-size:.74rem; flex-wrap:wrap; }
    .rr-section { margin-bottom:12px; }
    .rr-section-hdr { display:flex; align-items:center; gap:8px; padding:8px 16px; background:var(--bg);
      border:1px solid var(--border); border-radius:var(--radius) var(--radius) 0 0;
      font-size:.72rem; font-weight:700; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.5px; }
    .rr-table-wrap { background:var(--surface); border:1px solid var(--border); border-top:none;
      border-radius:0 0 var(--radius) var(--radius); overflow:hidden; }
    .rr-table { width:100%; border-collapse:collapse; font-size:0.81rem; }
    .rr-table td { padding:9px 16px; border-bottom:1px solid var(--border); color:var(--text); vertical-align:middle; }
    .rr-table tr:last-child td { border-bottom:none; }
    .rr-table tr:hover td { background:var(--bg); }
    .rr-doc-name { font-weight:500; display:flex; align-items:center; gap:8px; }
    .rr-doc-icon { color:var(--secondary); font-size:15px; flex-shrink:0; }
    .rr-doc-sub  { font-size:.68rem; color:var(--text-muted); margin-top:1px; }
    .rr-badge-uploaded { background:var(--green-bg); color:var(--green); border:1px solid #F0FDF4;
      border-radius:20px; padding:2px 9px; font-size:0.68rem; font-weight:700; white-space:nowrap; }
    .rr-badge-pending  { background:var(--yellow-bg); color:var(--yellow); border:1px solid #FFFBEB;
      border-radius:20px; padding:2px 9px; font-size:0.68rem; font-weight:700; white-space:nowrap; }
    .rr-badge-missing  { background:var(--red-bg); color:var(--red); border:1px solid #FECACA;
      border-radius:20px; padding:2px 9px; font-size:0.68rem; font-weight:700; white-space:nowrap; }
    .rr-badge-expired  { background:#FFF7ED; color:#C2410C; border:1px solid #FFFBEB;
      border-radius:20px; padding:2px 9px; font-size:0.68rem; font-weight:700; white-space:nowrap; }
    .rr-badge-na       { background:var(--bg); color:var(--text-muted); border:1px solid var(--border);
      border-radius:20px; padding:2px 10px; font-size:0.68rem; font-weight:500; white-space:nowrap; }
    .rr-btn { display:inline-flex; align-items:center; gap:6px; padding:4px 10px;
      border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface);
      font-size:0.72rem; font-weight:500; color:var(--text-secondary); cursor:pointer; white-space:nowrap; }
    .rr-btn:hover { border-color:var(--secondary); color:var(--secondary); }
    .rr-btn.primary { border-color:var(--secondary); color:var(--secondary); background:rgba(145,0,87,.05); }
    .rr-upload-btn { display:flex; align-items:center; gap:6px; padding:8px 14px;
      border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface);
      font-size:0.8rem; font-weight:500; color:var(--text-secondary); cursor:pointer; }
    .rr-upload-btn:hover { border-color:var(--secondary); color:var(--secondary); }
    .rr-dias-alerta { display:flex; align-items:center; gap:8px; padding:8px 12px; margin:0 0 4px;
      background:#FFFBEB; border-left:3px solid #D97706; font-size:.75rem; color:#D97706; }
    .filter-pill-wrap { position:relative; display:inline-block; }
    .filter-dropdown {
      position:absolute; top:calc(100% + 6px); left:0; z-index:200;
      background:var(--surface); border:1px solid var(--border-strong);
      border-radius:var(--radius); box-shadow:var(--shadow-md);
      min-width:220px; padding:6px 0;
      max-height:280px; overflow-y:auto; overflow-x:hidden;
    }
    /* Scrollbar subtle igual que sidebar */
    .filter-dropdown::-webkit-scrollbar { width:4px; }
    .filter-dropdown::-webkit-scrollbar-track { background:transparent; }
    .filter-dropdown::-webkit-scrollbar-thumb { background:var(--border-strong); border-radius:2px; }
    .filter-dropdown label { display:flex; align-items:center; gap:8px; padding:8px 14px; font-size:.8rem; cursor:pointer; color:var(--text); white-space:nowrap; transition:background .1s; }
    .filter-dropdown label:hover { background:var(--bg); }
    .filter-dropdown label input[type=checkbox] { accent-color:var(--secondary); width:14px; height:14px; flex-shrink:0; }
    .filter-dropdown .dd-header { padding:6px 14px 5px; font-size:.65rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; border-bottom:1px solid var(--border); margin-bottom:2px; position:sticky; top:0; background:var(--surface); z-index:1; }
    .filter-dropdown .dd-clear { display:block; width:100%; padding:6px 14px; font-size:.74rem; color:var(--secondary); cursor:pointer; background:none; border:none; border-top:1px solid var(--border); margin-top:2px; text-align:left; font-family:var(--font-ui); transition:background .1s; }
    .filter-dropdown .dd-clear:hover { background:var(--bg); }
    .filter-badge { background:var(--secondary); color:#fff; border-radius:10px; font-size:.62rem; font-weight:700; padding:1px 6px; margin-left:3px; }
    /* Covenant status dots in dropdown */
    .dd-status-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

    /* Empty state al filtrar sin resultados */
    .filter-empty { padding:32px 16px; text-align:center; color:var(--text-muted); font-size:.82rem; }
    .filter-empty i { font-size:1.6rem; display:block; margin-bottom:8px; color:var(--border-strong); }
    .filter-empty button { margin-top:10px; padding:5px 16px; border-radius:20px; border:1px solid var(--border-strong); background:none; font-size:.78rem; font-family:var(--font-ui); color:var(--secondary); cursor:pointer; }
  </style>
</head>
<body>

  <!-- ── Topbar ──────────────────────────────────────────────────── -->
  <header class="topbar">
    <a href="#" onclick="goHome(); return false;" style="display:flex;align-items:center;line-height:0;">

        class="topbar-logo"
        src="https://stg.suite.cxc.com.mx/logos/cxc_fullcolor.svg"

      />

  <!-- ── Sidebar ─────────────────────────────────────────────────── -->

    <a class="nav-item" href="data-studio-lenderhub.html">

  <!-- ── Main ───────────────────────────────────────────────────── -->
  <main class="main">
    <div class="main-card" id="main-card">

      <!-- ── Home ──────────────────────────────────────────────────── -->
      <div class="section active" id="section-home">
        <div class="empty-state">
          <div class="empty-icon-wrap" role="img" aria-label="Cohete">🚀</div>
          <h1 class="empty-title">Hi Nilda!</h1>
          <p class="empty-sub">Usa el menú lateral para explorar el portafolio, las facilities y el análisis de riesgo.</p>
        </div>
      </div>

      <!-- ── PM: Overview ──────────────────────────────────────── -->
      <div class="section" id="section-overview">
        <div id="overview-dashboard"></div>
      </div>

      <!-- ── PM: Facilities ──────────────────────────────────────── -->
      <div class="section" id="section-facilities">
        <div class="page-header">
          <div>
            <h1 class="page-title">Facilities</h1>
            <p class="page-subtitle">Monitoreo del portafolio quirografario y ABS</p>
          </div>
          <button class="btn-primary" onclick="window.location.href='company-detail-lenderhub.html#new-facility'" title="Crear nueva facility — abre el wizard en Companies">
            <i class="ph ph-plus"></i>
            Agregar facility
          </button>
        </div>

        <!-- Type tabs primero: definen QUÉ tipo de activo se ve -->
        <div class="type-tabs" id="type-tabs">
          <button class="type-tab active" data-filter="all"   onclick="filterFacilities('all',this)">Todas (<span id="count-all">0</span>)</button>
          <button class="type-tab quiro"  data-filter="QUIRO" onclick="filterFacilities('QUIRO',this)">Quirografario (<span id="count-quiro">0</span>)</button>
          <button class="type-tab abs"    data-filter="ABS"   onclick="filterFacilities('ABS',this)">ABS (<span id="count-abs">0</span>)</button>
        </div>

        <!-- Sprint C.12: Search bar -->
        <div style="position:relative;margin-top:14px;max-width:420px;">
          <i class="ph ph-magnifying-glass" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:15px;pointer-events:none;"></i>
          <input id="fac-search" type="text" placeholder="Buscar por borrower o nombre de facility…" oninput="window.SEARCH_QUERY=this.value;renderFacilities();" autocomplete="off" style="width:100%;padding:8px 12px 8px 36px;border:1px solid var(--border-strong);border-radius:8px;font-family:var(--font-ui);font-size:.85rem;color:var(--text);background:var(--surface);outline:none;transition:border-color .15s;" onfocus="this.style.borderColor='var(--secondary)'" onblur="this.style.borderColor='var(--border-strong)'">
        </div>

        <!-- Filter pills: refinan dentro del tipo seleccionado -->
        <div class="filters-row" style="margin-top:14px;">
          <!-- Covenant Status — filtro prioritario para el lender -->
          <div class="filter-pill-wrap" id="wrap-covenant">
            <button class="filter-pill" id="pill-covenant" aria-expanded="false" aria-controls="dd-covenant" onclick="toggleDropdown('covenant',event)">
              <i class="ph ph-shield-check" style="font-size:13px;"></i>
              Covenant <span class="filter-badge" id="badge-covenant" style="display:none">0</span>
              <i class="ph ph-caret-down fp-caret"></i>
            </button>
            <div class="filter-dropdown" id="dd-covenant" style="display:none;" role="listbox" aria-label="Filtro de Covenant Status"></div>
          </div>
          <!-- Acreditado (antes "Originadores") -->
          <div class="filter-pill-wrap" id="wrap-originators">
            <button class="filter-pill" id="pill-originators" aria-expanded="false" aria-controls="dd-originators" onclick="toggleDropdown('originators',event)">
              Acreditado <span class="filter-badge" id="badge-originators" style="display:none">0</span>
              <i class="ph ph-caret-down fp-caret"></i>
            </button>
            <div class="filter-dropdown" id="dd-originators" style="display:none;" role="listbox" aria-label="Filtro de Acreditado"></div>
          </div>
          <!-- Estructura (amortización) -->
          <div class="filter-pill-wrap" id="wrap-facilities">
            <button class="filter-pill" id="pill-facilities" aria-expanded="false" aria-controls="dd-facilities" onclick="toggleDropdown('facilities',event)">
              Estructura <span class="filter-badge" id="badge-facilities" style="display:none">0</span>
              <i class="ph ph-caret-down fp-caret"></i>
            </button>
            <div class="filter-dropdown" id="dd-facilities" style="display:none;" role="listbox" aria-label="Filtro de Estructura"></div>
          </div>
          <!-- Estado de Facility -->
          <div class="filter-pill-wrap" id="wrap-lifecycle">
            <button class="filter-pill" id="pill-lifecycle" aria-expanded="false" aria-controls="dd-lifecycle" onclick="toggleDropdown('lifecycle',event)">
              Estado <span class="filter-badge" id="badge-lifecycle" style="display:none">0</span>
              <i class="ph ph-caret-down fp-caret"></i>
            </button>
            <div class="filter-dropdown" id="dd-lifecycle" style="display:none;" role="listbox" aria-label="Filtro de Estado de Facility"></div>
          </div>
          <!-- Rating interno -->
          <div class="filter-pill-wrap" id="wrap-rating">
            <button class="filter-pill" id="pill-rating" aria-expanded="false" aria-controls="dd-rating" onclick="toggleDropdown('rating',event)">
              <i class="ph ph-medal" style="font-size:13px;"></i>
              Rating <span class="filter-badge" id="badge-rating" style="display:none">0</span>
              <i class="ph ph-caret-down fp-caret"></i>
            </button>
            <div class="filter-dropdown" id="dd-rating" style="display:none;" role="listbox" aria-label="Filtro de Rating"></div>
          </div>
          <!-- Sector -->
          <div class="filter-pill-wrap" id="wrap-sector">
            <button class="filter-pill" id="pill-sector" aria-expanded="false" aria-controls="dd-sector" onclick="toggleDropdown('sector',event)">
              <i class="ph ph-tag" style="font-size:13px;"></i>
              Sector <span class="filter-badge" id="badge-sector" style="display:none">0</span>

(function generateQuiro() {
  // Seeded PRNG: deterministic, unique per facility+field
  function sr(seed) { const x = Math.sin(seed * 9301 + 49297) * 233280; return x - Math.floor(x); }
  function spick(seed, arr) { return arr[Math.floor(sr(seed) * arr.length)]; }
  function snum(seed, min, max, dec) { return parseFloat((sr(seed)*(max-min)+min).toFixed(dec||2)); }

  const BORROWERS = [
    ['Aplazo, S.A.P.I. de C.V.',        'APL'],
    ['Konfío, S.A.P.I. de C.V.',         'KNF'],
    ['Kueski, S.A. de C.V.',             'KSK'],

  // Sesgo a cartera SANA: 88% COMPLIANT, 9% WATCH, 3% BREACH (sin contar override por estado)
  const STATUSES      = [
    ...Array(31).fill('COMPLIANT'),

  const MONTOS        = [200,300,400,500,600,750,1000,1200,1500,2000,2500,3000];
  const COMMITS       = [200,300,400,500,600,750,1000,1200,1500,2000,2500,3000,3500];

  const INSTRUMENT_TYPES = ['Crédito Simple','Crédito Simple','Crédito Simple','Crédito Simple','Crédito Simple','Crédito Simple','CEBUR LP','CEBUR LP','CEBUR CP','Pagaré','Pagaré']; // i%11
  // Sector per borrower index — aligned to actual business model of each fintech
  const BORROWER_SECTORS = [
    'Consumo',    // 0  Aplazo — BNPL
    'PyME',       // 1  Konfío — SME credit
    'Consumo',    // 2  Kueski — personal loans
    'PyME',       // 3  Credijusto — SME / asset-backed
    'Educación',  // 4  FINAE — education loans
    'Consumo',    // 5  Mimoni — digital consumer
    'PyME',       // 6  Covalto — commercial / SME
    'Factoraje',  // 7  R2 — working capital / factoring
    'Consumo',    // 8  Graviti — consumer
    'Consumo',    // 9  Addi — BNPL / consumer
    'Consumo',    // 10 Baubap — personal loans
    'Factoraje',  // 11 Pagos Reales — payments / factoring
    'PyME',       // 12 Sempli — SME
    'Consumo',    // 13 Yotepresto — P2P consumer
    'Consumo',    // 14 Prestadero — P2P consumer
    'Factoraje',  // 15 Clip — payments / factoring
    'Factoraje',  // 16 Facturedo — invoice factoring
    'Consumo',    // 17 Concrédito — consumer credit
    'Nómina',     // 18 Afirme Soluciones — payroll
    'Consumo',    // 19 Mango Financial — consumer
  ];
  // Distribución sesgo a CARTERA SANA (objetivo BBVA IB&F Head):
  // ACTIVO 85% / LIQUIDADO 7% / EN REESTRUCTURA 3% / SUSPENDIDO 2% / VENCIDO 3%
  // 100 elementos para distribución precisa con i%100
  const ESTADOS_FAC   = [
    ...Array(85).fill('ACTIVO'),
    ...Array(7).fill('LIQUIDADO'),
    ...Array(3).fill('EN REESTRUCTURA'),
    ...Array(2).fill('SUSPENDIDO'),
    ...Array(3).fill('VENCIDO')
  ]; // 100 elements — usar i%100 para hit exact ratio
  const MONEDAS       = ['MXN','MXN','MXN','MXN','MXN','USD'];               // i%6
  // E3.7: incluir plazos más largos para reducir muro de vencimientos a ≤12m
  const PLAZOS        = [18,24,30,36,48,60,84];                              // i%7
  const TIIE_MX       = 9.50;
  const TIIE_91       = 9.68; // Fix #3: TIIE 91d ~18bps above TIIE 28d
  const SOFR          = 5.33;

  // Fix #1: Spread ranges by rating (bps over reference, skill §6)
  // HR AAA: 10-40pb, AA: 80-130pb, A: 130-250pb, BBB: 250-500pb, HY: 500-900pb
  const SPREAD_BY_RATING = {
    'A':    [1.30, 2.00],  'A-':   [1.50, 2.50],
    'BBB+': [2.50, 3.50],  'BBB':  [3.00, 4.00],  'BBB-': [3.50, 5.00],
    'BB+':  [5.00, 6.50],  'BB':   [5.50, 7.00],  'BB-':  [6.00, 7.50],
    'B+':   [6.50, 8.00],  'B':    [7.00, 8.50],  'B-':   [7.50, 9.00],
    'CCC':  [8.00, 10.00],
  };

  // Fix #2: Tasa fija ranges by rating (all-in, not spread)
  const FIJA_BY_RATING = {
    'A':    [10.5, 12.0],  'A-':   [11.0, 12.5],
    'BBB+': [12.0, 13.5],  'BBB':  [12.5, 14.0],  'BBB-': [13.0, 15.0],
    'BB+':  [14.5, 16.0],  'BB':   [15.0, 17.0],  'BB-':  [15.5, 18.0],
    'B+':   [16.0, 19.0],  'B':    [17.0, 20.0],  'B-':   [18.0, 22.0],
    'CCC':  [20.0, 25.0],
  };

  function fmtD(d,m,y) { return `${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y}`; }

  window.QUIRO_FACILITIES = [];
  for (let i = 0; i < 250; i++) {
    const b          = BORROWERS[i % BORROWERS.length];
    const yr         = YEARS[i % YEARS.length];
    const seq        = String(Math.floor(i / BORROWERS.length) + 1).padStart(2,'0');
    let   status     = STATUSES[i % STATUSES.length];
    const creditType = CREDIT_TYPES[i % 4];
    const sector     = BORROWER_SECTORS[i % BORROWERS.length];
    const estadoFac  = ESTADOS_FAC[i % ESTADOS_FAC.length];
    const moneda_seed = MONEDAS[i % 6]; // ya está computado abajo, lo necesitamos aquí
    // Sprint A.2: VENCIDO/EN REESTRUCTURA limitados a montos pequeños/medianos
    // En realidad las facilities en default suelen ser las más chicas (las grandes se renegocian o restructuran antes)
    const MONTOS_SMALL = [100,150,200,250,300,400,500]; // ≤$500M
    // E1.2 fix: USD facilities tienen montos nativos chicos ($20-200M USD)
    // Una facility USD de fintech MX típicamente es 20-150M USD, no 1-3B USD
    const MONTOS_USD = [20,30,50,75,100,125,150,180,200];
    const baseOut    = (estadoFac === 'VENCIDO' || estadoFac === 'EN REESTRUCTURA')
      ? MONTOS_SMALL[i % MONTOS_SMALL.length]
      : moneda_seed === 'USD'
        ? MONTOS_USD[i % MONTOS_USD.length]
        : MONTOS[i % MONTOS.length];
    const out        = baseOut;
    const com        = moneda_seed === 'USD'
      ? Math.max(out, MONTOS_USD[(i+2) % MONTOS_USD.length])
      : Math.max(out, COMMITS[i % COMMITS.length]);
    // ── Domain override: lifecycle state drives covenant status ──────────────
    // A LIQUIDADO loan is paid-off → covenants are moot (keep COMPLIANT, not BREACH)
    // A VENCIDO loan is past-due/defaulted → always BREACH
    // EN REESTRUCTURA is under negotiation → minimum WATCH
    // SUSPENDIDO is administratively halted → minimum WATCH
    if (estadoFac === 'LIQUIDADO'                            ) status = 'COMPLIANT';
    else if (estadoFac === 'VENCIDO'                         ) status = 'BREACH';
    else if (estadoFac === 'EN REESTRUCTURA' && status==='COMPLIANT') status = 'WATCH';
    else if (estadoFac === 'SUSPENDIDO') status = 'WATCH'; // always WATCH, never BREACH for admin suspension
    // Sprint A.2 reinforcement: facilities ACTIVO con outstanding >$500M no pueden estar en BREACH
    // En la realidad, una facility grande con breach se reestructura antes de quedar marcada
    if (status === 'BREACH' && out > 500 && estadoFac === 'ACTIVO') status = 'WATCH';
    const moneda     = moneda_seed; // ya computado arriba
    // ── Currency-consistent rate type ─────────────────────────────────────────
    // Rule: MXN loans → TIIE or Fija only; USD loans → SOFR only.
    const MXN_RATES  = ['TIIE 28d','TIIE 28d','TIIE 91d','Fija']; // ~50% TIIE28, ~25% TIIE91, ~25% Fija
    const rateType   = moneda === 'USD' ? 'SOFR' : MXN_RATES[(i * 7 + 1) % 4];
    const plazo      = PLAZOS[i % 7];
    // ── Fechas derivadas del estado (TC-05 fix) ─────────────────────────────
    // Today = 2026-05-15. fechaInicio se calcula working backwards desde el estado:
    //   ACTIVO        → progreso 15-90% del plazo (vencimiento futuro)
    //   LIQUIDADO     → vencimiento 1-18m en el pasado
    //   VENCIDO       → vencimiento 0-4m en el pasado (mora reciente)
    //   EN REESTRUCT. → progreso 40-95% (cerca de vencer)
    //   SUSPENDIDO    → progreso 30-80%
    const TODAY = new Date(2026, 4, 15); // May 15, 2026
    let monthsSinceStart; // cuántos meses han pasado desde inicio hasta hoy
    if (estadoFac === 'LIQUIDADO') {
      monthsSinceStart = plazo + Math.floor(sr(i*53)*18) + 1; // plazo + 1-18m extra (ya venció)
    } else if (estadoFac === 'VENCIDO') {
      monthsSinceStart = plazo + Math.floor(sr(i*53)*4); // plazo + 0-3m (mora reciente)
    } else if (estadoFac === 'EN REESTRUCTURA') {
      monthsSinceStart = Math.floor(plazo * (0.40 + sr(i*53)*0.55)); // 40-95% del plazo
    } else if (estadoFac === 'SUSPENDIDO') {
      monthsSinceStart = Math.floor(plazo * (0.30 + sr(i*53)*0.50)); // 30-80%
    } else { // ACTIVO
      // E3.7: progreso 15-70% — equilibrio entre muro corto (alarmista) y muy largo (irreal)
      monthsSinceStart = Math.floor(plazo * (0.15 + sr(i*53)*0.55));
    }
    const inicioDate = new Date(TODAY.getFullYear(), TODAY.getMonth() - monthsSinceStart, 1);
    const sd  = Math.floor(sr(i*5+3) * 28) + 1;
    inicioDate.setDate(sd);
    const sm  = inicioDate.getMonth() + 1;
    const syr = inicioDate.getFullYear();
    const vencDate = new Date(inicioDate.getFullYear(), inicioDate.getMonth() + plazo, sd);
    const em  = vencDate.getMonth() + 1;
    const ey  = vencDate.getFullYear();
    const fechaInicio = fmtD(sd, sm, syr);
    const fechaVenc   = fmtD(sd, em, ey);
    // Rating first (needed for spread/tasa fija derivation)
    // E3.8: distribución rating balanceada — target A:30% / BBB:50% / BB:20% para cartera sana realista
    const ratingInterno = estadoFac === 'VENCIDO'          ? spick(i*37, ['BB-','B+','B','B-','CCC'])
                        : estadoFac === 'EN REESTRUCTURA'  ? spick(i*37, ['BB+','BB','BB-','B+'])
                        : estadoFac === 'LIQUIDADO'        ? spick(i*37, ['BBB','BBB-','BB+','BB'])
                        : /* ACTIVO / SUSPENDIDO */          spick(i*37, ['A','A','A','A-','A-','A-','BBB+','BBB+','BBB+','BBB','BBB','BBB-','BBB-','BB+','BB']);

    // Rate — Fix #1/#2/#3: spread and tasa fija derived from rating
    const isFija  = rateType === 'Fija';
    const isSofr  = rateType === 'SOFR';
    const isTiie91 = rateType === 'TIIE 91d';
    const tiie    = isFija ? null : isSofr ? SOFR : isTiie91 ? TIIE_91 : TIIE_MX;
    const sprdRange = SPREAD_BY_RATING[ratingInterno] || [4.0, 7.0];
    const spread  = snum(i*11+4, sprdRange[0], sprdRange[1]);
    const fijaRange = FIJA_BY_RATING[ratingInterno] || [14.0, 18.0];
    const tasaFija = isFija ? snum(i*13+5, fijaRange[0], fijaRange[1]) : null;

    window.QUIRO_FACILITIES.push({
      idx: i, tipo: 'QUIRO', lender: 'BBVA',
      name: `CQ-${b[1]}-${yr}-${seq}`,
      borrower: b[0],
      status, outstanding: `$${out}M`, commitment: `$${com}M`,
      outNum: out, comNum: com,
      estado: estadoFac,
      // Detail fields
      creditType, instrumentType: INSTRUMENT_TYPES[i % INSTRUMENT_TYPES.length], rateType, sector, estadoFacility: estadoFac,
      moneda, plazo, fechaInicio, fechaVenc,
      tiie, spread, tasaFija,
      // Risk & positioning
      tieeFloor:      i % 3 === 0 ? snum(i*17, 9.0, 10.5) : null,
      curePeriod:     spick(i*19, [10, 15, 20, 30]),
      debtTotalMult:  snum(i*29, 3.0, 7.0, 1),
      debtRanking:    spick(i*31, ['Senior No Garantizado','Senior Bilateral','Senior Sindicado','Pari Passu','Subordinado Quirografario']),
      ratingInterno,
      // E2.5: ICR sesgo a sano — rango por rating; cartera con mayoría ICR ≥2.5x
      // Per skill §6: BBB tiene ICR típicamente 2.5-4.5x; A: 4-6x; HY: 1.5-2.5x
      icr: (function(){
        const r = ratingInterno;
        const ranges = {
          'A':[5.0,7.0], 'A-':[4.5,6.5],
          'BBB+':[3.5,5.0], 'BBB':[3.0,4.5], 'BBB-':[2.7,4.0],
          'BB+':[2.3,3.0], 'BB':[2.0,2.7], 'BB-':[1.8,2.5],
          'B+':[1.5,2.2], 'B':[1.3,2.0], 'B-':[1.1,1.7], 'CCC':[0.8,1.4],
        };
        const [lo, hi] = ranges[r] || [2.0,3.5];
        return snum(i*41, lo, hi);
      })(),
      diasSinReporte: Math.floor(sr(i*43) * 120), // Fix #4: extended to 0-120 days (skill: "lag de 9 meses mata")
      commitmentFee:  snum(i*47, 0.25, 1.0),
    });
  }
})();

window.FX_RATE = 17.20;

// Convierte un monto en su moneda nativa a MXN equivalente
window.toMXN   = function(num, moneda) {
  if (!num || isNaN(num)) return 0;
  return moneda === 'USD' ? num * window.FX_RATE : num;
};
// Parsea outstanding/commitment string ABS ("$185M", "$1.2B") a número MXN
window.parseAmt = function(s) {
  if (typeof s === 'number') return s;
  if (!s) return 0;
  const m = String(s).match(/\$?([\d.]+)\s*([MB]?)/i);
  if (!m) return 0;
  const v = parseFloat(m[1]);
  return m[2].toUpperCase() === 'B' ? v * 1000 : v;
};
// Outstanding/Commitment en MXN equivalente para cualquier facility (QUIRO o ABS)
window.outMXN  = function(f) {
  // Sprint A.1: LIQUIDADO siempre tiene outstanding $0 (ya pagada)
  if (f.estadoFacility === 'LIQUIDADO') return 0;
  if (f.outNum != null) return window.toMXN(f.outNum, f.moneda || 'MXN');
  return window.parseAmt(f.outstanding); // ABS: asumimos MXN
};
window.comMXN  = function(f) {
  if (f.comNum != null) return window.toMXN(f.comNum, f.moneda || 'MXN');
  return window.parseAmt(f.commitment); // ABS: asumimos MXN
};
// Formatea monto en MXN-equivalente al CCY display actual
// v está en M (millones). 1,000 M = 1 B (mil millones).
window.fmtCCY  = function(mxnVal) {
  const ccy = window.OV_CCY || 'MXN';
  const v   = ccy === 'USD' ? mxnVal / window.FX_RATE : mxnVal;
  if (v >= 100000) return `$${(v/1000).toFixed(0)}B`;       // 100,000M+ → "$150B"
  if (v >= 1000)   return `$${(v/1000).toFixed(1)}B`;       // 1,000M+   → "$1.5B"
  if (v >= 1)      return `$${Math.round(v)}M`;             // 1M+       → "$200M"
  return `$${v.toFixed(1)}M`;
};

/* ─── SVG line chart ─────────────────────────────────── */
function buildChart(history, required) {
  if (!history || history.length < 2) return '<div style="text-align:center;padding:24px 0;color:var(--text-muted);font-size:.8rem;">Sin historial</div>';
  const W=280, H=110, PL=34, PR=6, PT=8, PB=20;
  const cW=W-PL-PR, cH=H-PT-PB;
  const allV=[...history, required];
  const minV=Math.min(...allV)*0.93, maxV=Math.max(...allV)*1.07;
  const ys=v=>PT+cH-((v-minV)/(maxV-minV))*cH;
  const xs=i=>PL+(i/(history.length-1))*cW;

  let grid='';
  for(let i=0;i<=3;i++){
    const v=minV+(i/3)*(maxV-minV), y=ys(v).toFixed(1);
    grid+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#E2E8F0" stroke-width="1"/>`;
    grid+=`<text x="${PL-4}" y="${(+y+3.5).toFixed(1)}" text-anchor="end" font-size="8.5" fill="#94A3B8" font-family="sans-serif">${v.toFixed(1)}</text>`;
  }
  const reqY=ys(required).toFixed(1);
  const reqLine=`<line x1="${PL}" y1="${reqY}" x2="${W-PR}" y2="${reqY}" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,3"/>`;
  const reqDots=history.map((_,i)=>`<circle cx="${xs(i).toFixed(1)}" cy="${reqY}" r="3" fill="white" stroke="#94A3B8" stroke-width="1.5"/>`).join('');
  const pts=history.map((v,i)=>`${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join(' ');
  const line=`<polyline points="${pts}" fill="none" stroke="#910057" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const dots=history.map((v,i)=>`<circle cx="${xs(i).toFixed(1)}" cy="${ys(v).toFixed(1)}" r="3.5" fill="#910057" stroke="white" stroke-width="1.5"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible">${grid}${reqLine}${reqDots}${line}${dots}</svg>`;
}

  FILTER_GROUPS.forEach(g => {

      else if (g === 'maturity') display = MATURITY_LABELS[v] || v;

window.SORT_KEY = null; // null = default sort (sortQuiro)
window.SORT_DIR = 'desc';
function toggleSort(key) {
  if (window.SORT_KEY === key) {
    window.SORT_DIR = window.SORT_DIR === 'desc' ? 'asc' : 'desc';
  } else {
    window.SORT_KEY = key;
    window.SORT_DIR = (key === 'borrower' || key === 'sector' || key === 'venc') ? 'asc' : 'desc';
  }
  renderFacilities();
}
function sortIndicator(key) {
  if (window.SORT_KEY !== key) return '<span style="color:var(--text-muted);opacity:.4;font-size:.65rem;">⇅</span>';
  return window.SORT_DIR === 'asc'
    ? '<span style="color:var(--secondary);font-size:.7rem;">▲</span>'
    : '<span style="color:var(--secondary);font-size:.7rem;">▼</span>';
}
function applyCustomSort(list) {
  const k = window.SORT_KEY;
  if (!k) return list;
  const RAT = {'A':12,'A-':11,'BBB+':10,'BBB':9,'BBB-':8,'BB+':7,'BB':6,'BB-':5,'B+':4,'B':3,'B-':2,'CCC':1};
  const SP = { BREACH:0, WATCH:1, COMPLIANT:2 };
  const getVal = (f) => {
    switch(k) {
      case 'borrower':    return f.borrower || '';
      case 'sector':      return f.sector || '';
      case 'status':      return SP[f.status] ?? 9;
      case 'rating':      return RAT[f.ratingInterno] || 0;
      case 'outstanding': return window.outMXN(f);
      case 'spread':      return f.spread || 0;
      case 'allin':       return f.tasaFija || (Math.max(f.tiie||0, f.tieeFloor||0) + (f.spread||0));
      case 'wal':         {
        if (!f.plazo) return 0;
        if (f.creditType === 'Bullet')     return f.plazo/12;
        if (f.creditType === 'Revolvente') return f.plazo/12*0.5;
        if (f.creditType === 'Alemán')     return (f.plazo+1)/2/12;
        return f.plazo*0.57/12;
      }
      case 'venc':        {
        if (!f.fechaVenc) return 0;
        const [d,m,y] = f.fechaVenc.split('/').map(Number);
        return new Date(y,m-1,d).getTime();
      }
      default: return 0;
    }
  };
  const dir = window.SORT_DIR === 'asc' ? 1 : -1;
  return [...list].sort((a,b) => {
    const av = getVal(a), bv = getVal(b);
    if (typeof av === 'string') return av.localeCompare(bv) * dir;
    return (av - bv) * dir;
  });
}

    if (!r) return 'var(--text-muted)';
