/* ─── Sort ───────────────────────────────────────────── */
function sortQuiro(list) {
  const SP = { BREACH:0, WATCH:1, COMPLIANT:2 };
  const EP = { VENCIDO:0, SUSPENDIDO:1, 'EN REESTRUCTURA':2, ACTIVO:3, LIQUIDADO:9 };
  return [...list].sort((a,b) => {
    const aL = a.estadoFacility==='LIQUIDADO'?1:0, bL = b.estadoFacility==='LIQUIDADO'?1:0;
    if (aL!==bL) return aL-bL;
    const sp = (SP[a.status]??2)-(SP[b.status]??2);
    if (sp!==0) return sp;
    const ep = (EP[a.estadoFacility]??3)-(EP[b.estadoFacility]??3);
    if (ep!==0) return ep;
    return (b.outNum||0)-(a.outNum||0);
  });
}

/* ─── Filter helpers ─────────────────────────────────── */
function applyFilters(list) {
  // Maturity filter (banner-driven, sin pill)
  const MAT_TODAY = new Date(2026,4,14);
  const matCutoffs = { '30d': 30, '90d': 90, '12m': 365 };
  const matLimit   = window.MATURITY_FILTER ? matCutoffs[window.MATURITY_FILTER] : null;

  const searchQ = (window.SEARCH_QUERY || '').trim().toLowerCase();
  return list.filter(f => {
    // Sprint C.12: Búsqueda libre — borrower o name
    if (searchQ) {
      const haystack = `${f.borrower || ''} ${f.name || ''}`.toLowerCase();
      if (!haystack.includes(searchQ)) return false;
    }
    // Covenant Status (BREACH / WATCH / COMPLIANT) — solo si el campo existe
    if (activeFilters.covenant.size>0    && f.status        != null && !activeFilters.covenant.has(f.status))        return false;
    // Acreditado / Borrower
    if (activeFilters.originators.size>0 && f.borrower      != null && !activeFilters.originators.has(f.borrower))   return false;
    // Tipo de Crédito / Amortización
    if (activeFilters.facilities.size>0  && f.creditType    != null && !activeFilters.facilities.has(f.creditType))   return false;
    // Estado de Facility (ciclo de vida)
    if (activeFilters.lifecycle.size>0   && f.estadoFacility!= null && !activeFilters.lifecycle.has(f.estadoFacility)) return false;
    // Sprint B.4: Rating interno (bucket: IG / HY / Distress)
    if (activeFilters.rating.size>0 && f.ratingInterno != null) {
      const r = f.ratingInterno;
      const bucket = /^A/.test(r) ? 'A' : /^BBB/.test(r) ? 'BBB' : /^BB/.test(r) ? 'BB' : /^B/.test(r) ? 'B' : 'CCC';
      if (!activeFilters.rating.has(bucket)) return false;
    }
    // Sprint B.5: Sector
    if (activeFilters.sector.size>0 && f.sector != null && !activeFilters.sector.has(f.sector)) return false;
    // Sprint B.6: Moneda
    if (activeFilters.moneda.size>0 && f.moneda != null && !activeFilters.moneda.has(f.moneda)) return false;
    // Sprint B.7: Bucket de vencimiento — excluye LIQUIDADO (ya pagada, vencimiento es histórico)
    if (activeFilters.maturity.size>0) {
      if (!f.fechaVenc || f.estadoFacility === 'LIQUIDADO') return false;
      const [d,m,y] = f.fechaVenc.split('/').map(Number);
      const dt = new Date(y, m-1, d);
      const days = Math.round((dt - MAT_TODAY) / 86400000);
      let bucket;
      if (days < 0)        bucket = 'overdue';
      else if (days <= 30) bucket = '30d';
      else if (days <= 90) bucket = '90d';
      else if (days <= 365)bucket = '12m';
      else                 bucket = '>12m';
      if (!activeFilters.maturity.has(bucket)) return false;
    }
    // Maturity filter (vence en X días) — banner-driven, sólo QUIRO con fechaVenc
    if (matLimit != null) {
      if (!f.fechaVenc) return false;
      const [d,m,y] = f.fechaVenc.split('/').map(Number);
      const dt = new Date(y, m-1, d);
      const days = (dt - MAT_TODAY) / 86400000;
      if (days < 0 || days > matLimit) return false;
      if (f.estadoFacility === 'LIQUIDADO' || f.estadoFacility === 'VENCIDO') return false;
    }
    // Late report filter (días sin reporte > N)
    if (window.LATE_REPORT_FILTER != null) {
      if ((f.diasSinReporte || 0) <= window.LATE_REPORT_FILTER) return false;
      if (f.estadoFacility === 'LIQUIDADO' || f.estadoFacility === 'VENCIDO') return false;
    }
    return true;
  });
}

function hasActiveFilters() {
  return FILTER_GROUPS.some(g => activeFilters[g].size > 0) || !!window.MATURITY_FILTER || !!window.LATE_REPORT_FILTER || !!(window.SEARCH_QUERY && window.SEARCH_QUERY.trim());
}

/* ─── Dispatch render ─────────────────────────────────── */
function renderFacilities() {
  const grid = document.getElementById('cards-grid');
  let list;

  if (currentFilter === 'ABS') {
    list = applyFilters(ABS_FACILITIES);         // ← ABS también se filtra
    grid.style.gridTemplateColumns = list.length ? `repeat(${list.length},minmax(0,1fr))` : '';
  } else {
    const quiroFiltered = sortQuiro(applyFilters(window.QUIRO_FACILITIES));
    if (currentFilter === 'QUIRO') {
      list = quiroFiltered;
    } else {
      // FIX P0: ambas fuentes pasan por applyFilters
      list = [...quiroFiltered, ...applyFilters(ABS_FACILITIES)];
    }
    grid.style.gridTemplateColumns = '';
  }

  // Empty state cuando filtros no dan resultados
  if (!list.length) {
    grid.innerHTML = `<div class="filter-empty" style="grid-column:1/-1;">
      <i class="ph ph-funnel-x"></i>
      Sin facilities con los filtros aplicados.
      <br>
      <button onclick="clearAllFilters()">Limpiar filtros</button>
    </div>`;
  } else {
    grid.innerHTML = currentFilter === 'ABS' ? renderCardGrid(list) : renderTable(list);
  }

  updateResultCount(list.length);
  renderActiveChips(); // Sprint D.14
}

function goToFacilitiesFiltered(group, value) {
  // Reset todos los filtros
  if (typeof FILTER_GROUPS !== 'undefined' && typeof activeFilters !== 'undefined') {
    FILTER_GROUPS.forEach(g => {
      activeFilters[g].clear();
      document.querySelectorAll('#dd-'+g+' input[type=checkbox]').forEach(cb => cb.checked = false);
      if (typeof updateFilterBadge === 'function') updateFilterBadge(g);
    });
  }
  window.MATURITY_FILTER = null;
  window.LATE_REPORT_FILTER = null;

  // Reset type-tab a "Todas" para que cualquier filtro encuentre resultados
  currentFilter = 'all';
  document.querySelectorAll('.type-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.filter === 'all');
  });

  // Aplicar filtro solicitado
  if (group === 'maturity') {
    window.MATURITY_FILTER = value;
  } else if (group === 'late_report') {
    window.LATE_REPORT_FILTER = Number(value);
  } else if (activeFilters[group]) {
    activeFilters[group].add(value);
  }

  // Navegar a Facilities
  if (typeof showSection === 'function') showSection('facilities');

  // Sincronizar checkbox del dropdown (si aplica)
  setTimeout(()=>{
    if (group !== 'maturity') {
      const cb = document.querySelector(`#dd-${group} input[value="${value}"]`);
      if (cb) cb.checked = true;
      if (typeof updateFilterBadge === 'function') updateFilterBadge(group);
    }
    if (typeof renderFacilities === 'function') renderFacilities();
  }, 50);
}

function renderOverview() {
  const el = document.getElementById('overview-dashboard');
  if (!el) return;

  const ALL = window.QUIRO_FACILITIES || [];
  const ac  = ALL.filter(f => f.estadoFacility !== 'LIQUIDADO');
  const n   = ac.length;
  if (!n) {
    const nLiq = ALL.filter(f => f.estadoFacility === 'LIQUIDADO').length;
    el.innerHTML = `
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap;">
        <div>
          <h1 style="font-size:1.15rem;font-weight:700;color:var(--primary);margin-bottom:2px;">Portfolio Overview — Quirografario</h1>
          <p style="font-size:.78rem;color:var(--text-secondary);">Sin facilities activas</p>
        </div>
      </div>
      <div style="text-align:center;padding:60px 24px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);">
        <i class="ph ph-check-circle" style="font-size:2.5rem;color:var(--green);"></i>
        <h2 style="font-size:1.05rem;font-weight:700;color:var(--text);margin-top:14px;">Portafolio liquidado</h2>
        <p style="font-size:.85rem;color:var(--text-secondary);margin-top:6px;max-width:480px;margin-left:auto;margin-right:auto;line-height:1.5;">
          ${nLiq > 0 ? `${nLiq} facilities ${nLiq===1?'cerrada':'cerradas'} sin breach al vencimiento.` : 'No hay facilities en el portafolio.'}
          Las facilities liquidadas se mantienen como histórico — consúltalas en la vista de Facilities con el filtro <strong>Estado = Liquidado</strong>.
        </p>
        ${nLiq > 0 ? `<button onclick="goToFacilitiesFiltered('lifecycle','LIQUIDADO')" style="margin-top:18px;padding:8px 18px;font-size:.82rem;font-weight:500;font-family:var(--font-ui);background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);cursor:pointer;">Ver facilities liquidadas →</button>` : ''}
      </div>`;
    return;
  }

  const FX     = 17.20; // USD → MXN (tipo de cambio fijo prototipo)
  const CCY    = window.OV_CCY || 'MXN';
  const toMXN  = (num, moneda) => moneda === 'USD' ? num * FX : num;
  const fmtB   = mxn => { const v = CCY === 'USD' ? mxn / FX : mxn; return v >= 100000 ? `$${(v/1000).toFixed(0)}B` : v >= 1000 ? `$${(v/1000).toFixed(1)}B` : `$${Math.round(v)}M`; };
  const pctN   = (a,b) => b ? Math.round(a/b*100) : 0;
  // E2.4: Formato de porcentaje con "<1%" para valores no-cero menores a 1%
  const pctFmt = (a,b) => {
    if (!b) return '0%';
    const r = a/b*100;
    if (r === 0) return '0%';
    if (r < 1) return '<1%';
    return Math.round(r) + '%';
  };

  // ── Core KPIs ──────────────────────────────────────────
  const totalOut    = ac.reduce((s,f) => s + toMXN(f.outNum, f.moneda), 0);
  const totalCommit = ac.reduce((s,f) => s + toMXN(f.comNum, f.moneda), 0);
  const utilRate    = pctN(totalOut, totalCommit);
  const varFac      = ac.filter(f => f.rateType !== 'Fija');
  const wSpread     = (varFac.reduce((s,f) => s+f.spread*toMXN(f.outNum,f.moneda),0) / varFac.reduce((s,f) => s+toMXN(f.outNum,f.moneda),0)).toFixed(2);
  const IG          = ['A','A-','BBB+','BBB','BBB-'];
  const igPct       = pctN(ac.filter(f=>IG.includes(f.ratingInterno)).reduce((s,f)=>s+toMXN(f.outNum,f.moneda),0), totalOut);
  // Covenant Breach = breach por covenant violado (NO incluye VENCIDO/payment default)
  // E1.1 fix: nBreach incluye TODAS las facilities con status='BREACH' (covenant breach + payment default)
  // Antes excluía VENCIDOS mostrando 0 cuando en realidad las 6 vencidas estaban en breach
  const nBreach     = ac.filter(f=>f.status==='BREACH').length;
  const nVencido    = ac.filter(f=>f.estadoFacility === 'VENCIDO').length;
  const nBreachCov  = nBreach - nVencido; // breaches por covenant, sin contar vencidos
  const avgDias     = Math.round(ac.reduce((s,f)=>s+(f.diasSinReporte||0),0)/n);

  // ── Status ──────────────────────────────────────────────
  const ST = { COMPLIANT:{n:0,out:0}, WATCH:{n:0,out:0}, BREACH:{n:0,out:0} };
  ac.forEach(f => { if(ST[f.status]){ST[f.status].n++; ST[f.status].out+=toMXN(f.outNum,f.moneda);} });

  // ── Rating groups ─ DS CXC §1: tokens de estados (success/info/amber/danger)
  const RG = [
    {lbl:'A / A−',  keys:['A','A-'],            bg:'#F0FDF4',tc:'#16A34A', n:0,out:0},
    {lbl:'BBB',     keys:['BBB+','BBB','BBB-'],  bg:'#F0F9FF',tc:'#0284C7', n:0,out:0},
    {lbl:'BB',      keys:['BB+','BB','BB-'],     bg:'#FFFBEB',tc:'#D97706', n:0,out:0},
    {lbl:'B / CCC', keys:['B+','B','B-','CCC'],  bg:'#FEF2F2',tc:'#DC2626', n:0,out:0},
  ];
  ac.forEach(f=>{ const g=RG.find(g=>g.keys.includes(f.ratingInterno)); if(g){g.n++;g.out+=toMXN(f.outNum,f.moneda);} });

  // ── ICR distribution ────────────────────────────────────
  const ICR_BANDS = [
    {lbl:'≥ 3.0x', min:3.0, max:Infinity, col:'#16A34A', n:0,out:0},
    {lbl:'2.5–3.0x',min:2.5,max:3.0,      col:'#4ADE80', n:0,out:0},
    {lbl:'2.0–2.5x',min:2.0,max:2.5,      col:'#D97706', n:0,out:0},
    {lbl:'< 2.0x',  min:0,  max:2.0,      col:'#DC2626', n:0,out:0},
  ];
  ac.forEach(f=>{ const b=ICR_BANDS.find(b=>f.icr>=b.min&&f.icr<b.max); if(b){b.n++;b.out+=toMXN(f.outNum,f.moneda);} });

  // ── Sector ─────────────────────────────────────────────
  const secMap={};
  ac.forEach(f=>{ secMap[f.sector]=secMap[f.sector]||{n:0,out:0}; secMap[f.sector].n++; secMap[f.sector].out+=toMXN(f.outNum,f.moneda); });
  const topSec = Object.entries(secMap).sort((a,b)=>b[1].out-a[1].out);

  // ── Instrument type ─────────────────────────────────────
  const insMap={};
  ac.forEach(f=>{ insMap[f.instrumentType]=insMap[f.instrumentType]||{n:0,out:0}; insMap[f.instrumentType].n++; insMap[f.instrumentType].out+=toMXN(f.outNum,f.moneda); });
  const topIns = Object.entries(insMap).sort((a,b)=>b[1].out-a[1].out);

  // ── Credit type ─────────────────────────────────────────
  const ctMap={};
  ac.forEach(f=>{ ctMap[f.creditType]=ctMap[f.creditType]||{n:0,out:0}; ctMap[f.creditType].n++; ctMap[f.creditType].out+=toMXN(f.outNum,f.moneda); });
  const topCt = Object.entries(ctMap).sort((a,b)=>b[1].out-a[1].out);

  // ── Currency & rate ─────────────────────────────────────
  // Porciones en MXN-equivalente (para % del total y para fmtB)
  const mxnOut = ac.filter(f=>f.moneda==='MXN').reduce((s,f)=>s+f.outNum,0); // ya en MXN
  const usdOut = ac.filter(f=>f.moneda==='USD').reduce((s,f)=>s+f.outNum*FX,0); // USD→MXN
  const usdOutNative = ac.filter(f=>f.moneda==='USD').reduce((s,f)=>s+f.outNum,0); // USD nativo

  // ── Maturity profile ────────────────────────────────────
  function parseFV(s){ const[d,m,y]=s.split('/').map(Number); return new Date(y,m-1,d); }
  const T=new Date(2026,4,14), m6=new Date(2026,10,14), m12=new Date(2027,4,14), m24=new Date(2028,4,14);
  const MAT=[
    {lbl:'Vencido/En mora', chk:f=>f.estadoFacility==='VENCIDO',                                  col:'#DC2626', n:0,out:0, igOut:0, hyOut:0},
    {lbl:'≤ 6 meses',       chk:f=>{ const d=parseFV(f.fechaVenc); return f.estadoFacility!=='VENCIDO'&&d>T&&d<=m6;  }, col:'#EA580C', n:0,out:0, igOut:0, hyOut:0},
    {lbl:'6–12 meses',      chk:f=>{ const d=parseFV(f.fechaVenc); return d>m6&&d<=m12;  }, col:'#D97706', n:0,out:0, igOut:0, hyOut:0},
    {lbl:'12–24 meses',     chk:f=>{ const d=parseFV(f.fechaVenc); return d>m12&&d<=m24; }, col:'#0284C7', n:0,out:0, igOut:0, hyOut:0},
    {lbl:'> 24 meses',      chk:f=>parseFV(f.fechaVenc)>m24,                                col:'#16A34A', n:0,out:0, igOut:0, hyOut:0},
  ];
  // F1.5: segmentación por rating dentro de cada bucket (IG vs HY)
  const IG_SET = ['A','A-','BBB+','BBB','BBB-'];
  ac.forEach(f=>{
    const b=MAT.find(b=>b.chk(f));
    if(b){
      b.n++;
      const fAum = toMXN(f.outNum,f.moneda);
      b.out += fAum;
      if (IG_SET.includes(f.ratingInterno)) b.igOut += fAum;
      else b.hyOut += fAum;
    }
  });
  const matMax = Math.max(...MAT.map(b=>b.out), 1);

  // ── Top borrowers (consolidated) ────────────────────────
  const brwMap={};
  ac.forEach(f=>{
    if(!brwMap[f.borrower]) brwMap[f.borrower]={out:0,n:0,sec:f.sector,b:0,w:0,rating:f.ratingInterno};
    brwMap[f.borrower].out+=toMXN(f.outNum,f.moneda); brwMap[f.borrower].n++;
    if(f.status==='BREACH') brwMap[f.borrower].b++;
    if(f.status==='WATCH')  brwMap[f.borrower].w++;
  });
  const topBrw = Object.entries(brwMap).sort((a,b)=>b[1].out-a[1].out).slice(0,10);

  // ── BREACH top facilities ────────────────────────────────
  const breachTop = [...ac].filter(f=>f.status==='BREACH').sort((a,b)=>b.outNum-a.outNum).slice(0,5);

  // ── Late reporters ───────────────────────────────────────
  const lateRep = [...ac].filter(f=>(f.diasSinReporte||0)>30&&f.estadoFacility!=='VENCIDO')
                         .sort((a,b)=>(b.diasSinReporte||0)-(a.diasSinReporte||0)).slice(0,5);

  // ── Concentration stacked bar ────────────────────────────
  // DS CXC §1: derivados del gradient linear_1 (#910057 → #F9E6F1)
  const CONC_COLORS = ['#910057','#840058','#A02D6F','#B25086','#C4739E','#D596B5','#E7B8CC','#F9E6F1','#3E5066','#1F2733'];
  const concBar = topBrw.map(([nm,d],k)=>`<div class="ov-conc-seg" title="${nm}: ${fmtB(d.out)}" style="width:${pctN(d.out,totalOut)}%;background:${CONC_COLORS[k]||'#ccc'};"></div>`).join('');
  const otherOut = totalOut - topBrw.reduce((s,[,d])=>s+d.out,0);
  const concLegend = topBrw.map(([nm,d],k)=>`<div class="ov-conc-item"><div class="ov-conc-dot" style="background:${CONC_COLORS[k]};"></div>${nm.split(',')[0]} <strong style="color:var(--text);">${pctN(d.out,totalOut)}%</strong></div>`).join('');

  // ── HTML helpers ─────────────────────────────────────────
  const badge = (s)=>{
    const cfg = {COMPLIANT:{bg:'var(--green-bg)',tc:'var(--green)',lbl:'COMPLIANT'},WATCH:{bg:'var(--yellow-bg)',tc:'var(--yellow)',lbl:'WATCH'},BREACH:{bg:'var(--red-bg)',tc:'var(--red)',lbl:'BREACH'}};
    const c = cfg[s]||cfg.COMPLIANT;
    return `<span class="ov-badge" style="background:${c.bg};color:${c.tc};">${c.lbl}</span>`;
  };
  const rBadge = r=>{
    const g=RG.find(g=>g.keys.includes(r));
    return g ? `<span class="ov-badge" style="background:${g.bg};color:${g.tc};">${r}</span>` : `<span class="ov-badge" style="background:#F8FAFC;color:#64748B;">${r}</span>`;
  };

  // ── Pricing & WAL computations ──────────────────────────
  function allInRate(f) {
    if (f.rateType === 'Fija') return f.tasaFija || (f.spread || 0) + 9.5;
    const base = f.tiie || (f.rateType === 'SOFR' ? 5.33 : 9.50);
    const floor = f.tieeFloor || 0;
    return Math.max(base, floor) + (f.spread || 0);
  }
  // BUGFIX: usar MXN-equivalent (toMXN) en lugar de outNum nativo para consistencia con totalOut
  // Si se usa outNum nativo, las facilities USD quedan sub-ponderadas (1/17.20 factor) en yield/WAL/spread distribution
  const airByFac   = ac.map(f => ({ air: allInRate(f), wal: calcWAL(f), out: toMXN(f.outNum, f.moneda), spread: f.spread||0, rateType: f.rateType, ratingInterno: f.ratingInterno, floor: f.tieeFloor||0, tiie: f.tiie||9.5 }));
  const portfolioYield = (airByFac.reduce((s,x) => s + x.air * x.out, 0) / totalOut).toFixed(2);
  const portfolioWAL   = (airByFac.reduce((s,x) => s + x.wal * x.out, 0) / totalOut).toFixed(2);

  // Spread buckets (variable only)
  const vFac = airByFac.filter(x => x.rateType !== 'Fija');
  const SPRD_BUCKETS = [
    {lbl:'3.50–4.50%', min:3.5, max:4.5, col:'#16A34A', n:0, out:0},
    {lbl:'4.50–5.50%', min:4.5, max:5.5, col:'#0284C7', n:0, out:0},
    {lbl:'5.50–6.50%', min:5.5, max:6.5, col:'#D97706', n:0, out:0},
    {lbl:'6.50–8.00%', min:6.5, max:8.0, col:'#DC2626', n:0, out:0},
  ];
  vFac.forEach(x => { const b = SPRD_BUCKETS.find(b => x.spread >= b.min && x.spread < b.max); if(b){b.n++;b.out+=x.out;} });
  const sprdMax = Math.max(...SPRD_BUCKETS.map(b=>b.out), 1);

  // WAL buckets (all active)
  const WAL_BUCKETS = [
    {lbl:'< 1 año',    min:0,   max:1,   col:'#EA580C', n:0, out:0},
    {lbl:'1–2 años',   min:1,   max:2,   col:'#D97706', n:0, out:0},
    {lbl:'2–3 años',   min:2,   max:3,   col:'#0284C7', n:0, out:0},
    {lbl:'3–5 años',   min:3,   max:5,   col:'#0284C7', n:0, out:0},
    {lbl:'> 5 años',   min:5,   max:99,  col:'#16A34A', n:0, out:0},
  ];
  airByFac.forEach(x => { const b = WAL_BUCKETS.find(b => x.wal >= b.min && x.wal < b.max); if(b){b.n++;b.out+=x.out;} });
  const walMax = Math.max(...WAL_BUCKETS.map(b=>b.out), 1);

  // All-in rate by rating group
  const airByRating = RG.map(g => {
    const facs = airByFac.filter(x => g.keys.includes(x.ratingInterno));
    const wavg = facs.length ? (facs.reduce((s,x)=>s+x.air*x.out,0)/facs.reduce((s,x)=>s+x.out,0)).toFixed(2) : null;
    return { ...g, air: wavg };
  });

  // Rate type breakdown (by outstanding)
  const rateTypeMap = {};
  ac.forEach(f => { rateTypeMap[f.rateType] = rateTypeMap[f.rateType] || {n:0, out:0}; rateTypeMap[f.rateType].n++; rateTypeMap[f.rateType].out += toMXN(f.outNum,f.moneda); });
  const rateTypes = Object.entries(rateTypeMap).sort((a,b) => b[1].out - a[1].out);

  // WAL by credit type
  const walByCt = {};
  ac.forEach(f => {
    const ct = f.creditType;
    if (!walByCt[ct]) walByCt[ct] = {sumWalOut:0, out:0, n:0};
    walByCt[ct].sumWalOut += calcWAL(f) * toMXN(f.outNum,f.moneda);
    walByCt[ct].out += toMXN(f.outNum,f.moneda);
    walByCt[ct].n++;
  });
  const walCtList = Object.entries(walByCt).map(([ct,d]) => ({ct, wal:(d.sumWalOut/d.out).toFixed(1), out:d.out, n:d.n})).sort((a,b) => b.out - a.out);
  const walCtMax = Math.max(...walCtList.map(x=>parseFloat(x.wal)), 1);

  // Floor utilization
  const floorFac = vFac.filter(x => x.floor > 0);
  const floored  = floorFac.filter(x => x.tiie < x.floor); // TIIE below floor → floor binding
  const floorUtilPct = floorFac.length ? Math.round(floored.length / floorFac.length * 100) : 0;

  // ── RAROC & RWA computations ─────────────────────────────
  // Simplified IRB-like risk weights by rating (CNBV / Basel III standardized proxy)
  const RW_MAP = {'A':0.20,'A-':0.20,'BBB+':0.50,'BBB':0.50,'BBB-':0.50,'BB+':1.00,'BB':1.00,'BB-':1.00,'B+':1.50,'B':1.50,'B-':1.50,'CCC':1.50};
  // PD proxy by rating (annual, bps) — simplified for prototype
  const PD_MAP = {'A':15,'A-':25,'BBB+':40,'BBB':60,'BBB-':100,'BB+':175,'BB':250,'BB-':400,'B+':600,'B':900,'B-':1400,'CCC':2500};
  // LGD for unsecured (quirografario) = 45% standard Basel
  const LGD = 0.45;
  // Capital ratio (Tier 1)
  const CAP_RATIO = 0.10; // 10% economic capital

  let totalRWA = 0;
  let totalEL = 0;
  let totalNII = 0;
  let totalFees = 0;
  const facRAROC = [];

  // FTP spread by rating — alineado con facility detail (banca múltiple MX, FTP por rating)
  const FTP_SPREAD = {'A':0.20,'A-':0.30,'BBB+':0.45,'BBB':0.60,'BBB-':0.80,
    'BB+':1.10,'BB':1.40,'BB-':1.75,'B+':2.20,'B':2.70,'B-':3.20,'CCC':4.00};
  ac.forEach(f => {
    const outMXN = toMXN(f.outNum, f.moneda);
    const rw = RW_MAP[f.ratingInterno] || 1.00;
    const pd = (PD_MAP[f.ratingInterno] || 250) / 10000; // bps → decimal
    const rwa = outMXN * rw;
    const el = outMXN * pd * LGD;
    const air = allInRate(f);
    // Cost of funds realista: TIIE/base + FTP_SPREAD por rating (banca real, no flat TIIE)
    const ftp = FTP_SPREAD[f.ratingInterno] || 0.75;
    const baseRate = f.rateType === 'Fija' ? (8.50 + ftp) : ((f.tiie || 9.5) + ftp);
    const nim = (air - baseRate) / 100; // net interest margin as decimal
    const nii = outMXN * nim;
    // Commitment fee solo aplica a revolventes (en práctica bancaria real)
    const fee = f.creditType === 'Revolvente' ? outMXN * (f.commitmentFee || 0.5) / 100 : 0;
    const revenue = nii + fee;
    const opex = outMXN * 0.002; // 20bps operating cost
    const econCap = rwa * CAP_RATIO;
    const raroc = econCap > 0 ? ((revenue - el - opex) / econCap * 100) : 0;

    totalRWA += rwa;
    totalEL += el;
    totalNII += nii;
    totalFees += fee;
    facRAROC.push({ f, rwa, el, nii, fee, raroc, outMXN, econCap, revenue, opex, rw, pd });
  });

  const totalEconCap = totalRWA * CAP_RATIO;
  const totalRevenue = totalNII + totalFees;
  const totalOpex = ac.reduce((s,f) => s + toMXN(f.outNum,f.moneda) * 0.002, 0);
  const portfolioRAROC = totalEconCap > 0 ? ((totalRevenue - totalEL - totalOpex) / totalEconCap * 100) : 0;

  // RAROC by rating group
  const rarocByRG = RG.map(g => {
    const facs = facRAROC.filter(x => g.keys.includes(x.f.ratingInterno));
    const sumRev = facs.reduce((s,x) => s + x.revenue, 0);
    const sumEL = facs.reduce((s,x) => s + x.el, 0);
    const sumOpex = facs.reduce((s,x) => s + x.opex, 0);
    const sumEC = facs.reduce((s,x) => s + x.econCap, 0);
    const raroc = sumEC > 0 ? ((sumRev - sumEL - sumOpex) / sumEC * 100) : 0;
    const sumRWA = facs.reduce((s,x) => s + x.rwa, 0);
    return { ...g, raroc, rwa: sumRWA, nFacs: facs.length, revenue: sumRev, el: sumEL };
  });

  // IFRS 9 ECL staging (simplified)
  const stage1 = ac.filter(f => f.status === 'COMPLIANT');
  const stage2 = ac.filter(f => f.status === 'WATCH');
  const stage3 = ac.filter(f => f.status === 'BREACH' || f.estadoFacility === 'VENCIDO');
  const eclStage1 = stage1.reduce((s,f) => { const pd=(PD_MAP[f.ratingInterno]||250)/10000; return s + toMXN(f.outNum,f.moneda)*pd*LGD; }, 0); // 12-month ECL
  const eclStage2 = stage2.reduce((s,f) => { const pd=(PD_MAP[f.ratingInterno]||250)/10000; return s + toMXN(f.outNum,f.moneda)*pd*LGD*3; }, 0); // lifetime ≈ 3x
  const eclStage3 = stage3.reduce((s,f) => s + toMXN(f.outNum,f.moneda)*LGD*0.5, 0); // credit-impaired ≈ 50% LGD
  const totalECL = eclStage1 + eclStage2 + eclStage3;

  // ── Roll Rate Matrix (simulated quarterly migration) ──────
  const RATING_ORDER = ['A','A-','BBB+','BBB','BBB-','BB+','BB','BB-','B+','B','B-','CCC'];
  const RR_LABELS = ['A/A-','BBB','BB','B/CCC'];
  const RR_KEYS = [['A','A-'],['BBB+','BBB','BBB-'],['BB+','BB','BB-'],['B+','B','B-','CCC']];
  // Simulated transition matrix (% staying or migrating) — realistic for MX quirografario
  const ROLL_MATRIX = [
    [92, 6, 1.5, 0.5],   // A/A- → stays 92%, down to BBB 6%, down to BB 1.5%, down to B/CCC 0.5%
    [3, 88, 7, 2],        // BBB → up 3%, stays 88%, down 7%, down 2%
    [0.5, 5, 85, 9.5],    // BB → up 0.5%, up 5%, stays 85%, down 9.5%
    [0, 1, 8, 91],         // B/CCC → up 0%, up 1%, up 8%, stays 91%
  ];
  // Count facilities per bucket for context
  const rrCounts = RR_KEYS.map(keys => ac.filter(f => keys.includes(f.ratingInterno)).length);

  // ── Vintage Analysis (simulated default curves by origination quarter) ──
  const VINTAGE_COLORS = ['#910057','#0284C7','#D97706','#16A34A','#DC2626','#6366F1'];
  const vintages = [];
  const qNow = `${2026}-Q2`;
  // Group facilities by origination quarter
  const vintMap = {};
  ac.forEach(f => {
    const [d,m,y] = f.fechaInicio.split('/').map(Number);
    const q = `${y}-Q${Math.ceil(m/3)}`;
    if (!vintMap[q]) vintMap[q] = {n:0, out:0, breach:0, watch:0, breachOut:0, watchOut:0};
    vintMap[q].n++;
    const fOut = toMXN(f.outNum, f.moneda);
    vintMap[q].out += fOut;
    if (f.status === 'BREACH') { vintMap[q].breach++; vintMap[q].breachOut += fOut; }
    if (f.status === 'WATCH')  { vintMap[q].watch++;  vintMap[q].watchOut  += fOut; }
  });
  // H1.1: filtrar cohortes con n < 5 (sample size insuficiente) per skill §5.1
  // H1.2: tomar las últimas 8 cohortes (no 6) que pasen el filtro
  // H1.3: vintAll mantiene TODAS las cohortes para búsqueda de "peor" real
  const MIN_COHORT_N = 5;
  const allQKeys = Object.keys(vintMap).sort();
  const validQKeys = allQKeys.filter(q => vintMap[q].n >= MIN_COHORT_N);
  const vintKeys = validQKeys.slice(-8); // 8 cohortes más recientes con n≥5
  const hiddenOlderCount = validQKeys.length - vintKeys.length; // cohortes anteriores agrupadas
  const tinyCohortsCount = allQKeys.length - validQKeys.length; // cohortes excluidas por n<5

  const buildVintEntry = (q) => ({
    q, ...vintMap[q],
    breachRate:   vintMap[q].n > 0 ? (vintMap[q].breach / vintMap[q].n * 100) : 0,
    watchRate:    vintMap[q].n > 0 ? (vintMap[q].watch / vintMap[q].n * 100) : 0,
    distressRate: vintMap[q].n > 0 ? ((vintMap[q].breach + vintMap[q].watch) / vintMap[q].n * 100) : 0,
    // H1.4: distress también ponderado por AUM
    distressOutPct: vintMap[q].out > 0 ? ((vintMap[q].breachOut + vintMap[q].watchOut) / vintMap[q].out * 100) : 0,
  });
  const vintData = vintKeys.map(buildVintEntry);
  // H1.3: cohorts completas (filtradas por n≥5) para búsqueda de "peor" real
  const vintAll = validQKeys.map(buildVintEntry);

  // ── Stress Scenario computations ──────────────────────────
  // Base vs Stress — F2.1 waterfall: descompone drivers per skill §5.7
  const stressDeltaBps = 200;
  let stressBreaches = 0;
  ac.forEach(f => {
    if (f.rateType === 'Fija') return;
    const newRate = (f.tiie || 9.5) + stressDeltaBps/100;
    const newICR = f.icr * (f.tiie || 9.5) / newRate;
    if (newICR < 2.0 && f.status !== 'BREACH') stressBreaches++;
  });
  // F2.1: Stress waterfall components — base ECL + PD shock + LGD shock + cure rate decline
  const stressECL = {
    base: totalECL,
    pdShock: 0,    // PD ×1.5 escenario adverso
    lgdShock: 0,   // LGD +15pp (de 45% a 60%) — recovery deteriora
    cureRate: 0,   // cure rate ↓ — algunos Stage 2 migran a Stage 3
  };
  ac.forEach(f => {
    const baseEad = toMXN(f.outNum, f.moneda);
    const basePD = (PD_MAP[f.ratingInterno] || 250) / 10000;
    // PD shock: PD ×1.5 → delta = baseEad × (PD×0.5) × LGD
    stressECL.pdShock += baseEad * basePD * 0.5 * LGD;
    // LGD shock: LGD de 0.45 a 0.60 → delta = baseEad × PD × 0.15
    stressECL.lgdShock += baseEad * basePD * 0.15;
    // Cure rate ↓: 10% adicional de Stage 2 migra a Stage 3 (× 3 lifetime)
    const isStage2 = f.status === 'WATCH';
    if (isStage2) stressECL.cureRate += baseEad * basePD * LGD * 0.10 * 2;
  });
  const stressTotalECL = stressECL.base + stressECL.pdShock + stressECL.lgdShock + stressECL.cureRate;

  // ────────────────── RENDER ──────────────────────────────
  el.innerHTML = `
  <!-- Header -->
  <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap;">
    <div>
      <h1 style="font-size:1.15rem;font-weight:700;color:var(--primary);margin-bottom:2px;">Portfolio Overview — Quirografario</h1>
      <p style="font-size:.78rem;color:var(--text-secondary);">${n} facilities activas${CCY==='USD' ? ` · TC: $${FX} MXN/USD` : ''}</p>
    </div>
    <!-- Currency selector -->
    <div class="ccy-selector">
      <span class="ccy-label">Moneda</span>
      <div class="ccy-info-wrap">
        <button class="ccy-info-btn" tabindex="0" aria-label="Información sobre conversión de moneda">
          <i class="ph ph-info"></i>
        </button>
        <div class="ccy-tooltip">
          La conversión usa el tipo de cambio a la fecha de corte, según datos de Banxico.<br>
          <strong style="color:rgba(255,255,255,.7);font-size:.68rem;">TC referencia: $${FX} MXN/USD</strong>
        </div>
      </div>
      <div class="ccy-dd-wrap" id="ccy-dd-wrap">
        <button class="ccy-trigger" id="ccy-trigger" aria-expanded="false" aria-haspopup="listbox"
                onclick="(function(){const dd=document.getElementById('ccy-dd');const tr=document.getElementById('ccy-trigger');const open=dd.classList.toggle('open');tr.setAttribute('aria-expanded',open);})()">
          <span>${CCY==='MXN'?'🇲🇽':'🇺🇸'}</span>
          <span>${CCY}</span>
          <i class="ph ph-caret-down"></i>
        </button>
        <div class="ccy-dd" id="ccy-dd" role="listbox">
          ${[{code:'MXN',flag:'🇲🇽'},{code:'USD',flag:'🇺🇸'}].map(opt=>`
          <button class="ccy-opt${CCY===opt.code?' active':''}" role="option" aria-selected="${CCY===opt.code}"
                  onclick="toggleOvCCY('${opt.code}')">
            <span>${opt.flag}</span><span>${opt.code}</span>
          </button>`).join('')}
        </div>
      </div>
    </div>
  </div>

  <!-- Tab Nav -->
  <nav class="ov-tab-nav">
    <button class="ov-tab-btn active" data-tab="resumen"  onclick="switchOvTab('resumen')">Resumen</button>
    <button class="ov-tab-btn"        data-tab="capital"  onclick="switchOvTab('capital')">Capital &amp; Risk</button>
    <button class="ov-tab-btn"        data-tab="pricing"  onclick="switchOvTab('pricing')">Pricing &amp; WAL</button>
  </nav>

  <!-- ═══════════════ PANE: RESUMEN ═══════════════ -->
  <div id="ov-pane-resumen" class="ov-pane active">

  <!-- Atención Esta Semana — removido -->

  <!-- KPI Strip -->
  <div class="ov-strip">
    <div class="ov-kpi" style="border-color:${nBreach>0?'rgba(220,38,38,.4)':'var(--border)'};">
      <div class="ov-kpi-lbl">Covenant Breaches</div>
      <div class="ov-kpi-val" style="color:${nBreach>0?'var(--red)':'var(--green)'};">${nBreach}</div>
      <div class="ov-kpi-sub">${ST.WATCH.n} en Watch · ${nVencido>0?`<span style="color:var(--red);font-weight:700;">${nVencido} en mora</span>`:'0 en mora'}${nBreachCov>0?` · ${nBreachCov} covenant`:''}</div>
    </div>
    <div class="ov-kpi" title="Outstanding total exacto: $${Math.round(totalOut).toLocaleString('es-MX')}M MXN equivalente · ${n} facilities activas (excl. liquidadas)">
      <div class="ov-kpi-lbl">Outstanding Total</div>
      <div class="ov-kpi-val">${fmtB(totalOut)}</div>
      <div class="ov-kpi-sub">${CCY} · ${n} facilities activas</div>

    <div class="ov-kpi" title="Commitment total: $${Math.round(totalCommit).toLocaleString('es-MX')}M · Utilización: ${pctN(totalOut,totalCommit)}%">
      <div class="ov-kpi-lbl">Commitment Total</div>

      <div class="ov-kpi-val">+${wSpread}%</div>

      <div class="ov-kpi-sub">Por AUM outstanding (A–BBB-)</div>
    </div>
  </div>

  <!-- Row: Status + Rating -->
  <div class="ov-row ov-row-2">
    <!-- Status AUM breakdown -->
    <div class="ov-card">
      <div class="ov-card-title"><i class="ph ph-shield-check" style="color:var(--secondary);"></i> Covenant Status <span class="ov-card-sub">Por AUM outstanding</span></div>
      <div class="ov-status-block">
        ${['COMPLIANT','WATCH','BREACH'].map(s=>{
          const col = s==='COMPLIANT'?'var(--green)':s==='WATCH'?'var(--yellow)':'var(--red)';
          const pctOut = pctN(ST[s].out, totalOut);
          // E2.4: usar pctFmt para mostrar "<1%" en lugar de "0%" cuando hay AUM
          const pctOutDisp = pctFmt(ST[s].out, totalOut);
          return `<div class="ov-status-row">
            <div class="ov-status-dot" style="background:${col};"></div>
            <span class="ov-status-lbl">${s}</span>
            <div class="ov-status-bar"><div class="ov-status-fill" style="width:${Math.max(pctOut, ST[s].out>0?0.5:0)}%;background:${col};"></div></div>
            <span class="ov-status-n">${ST[s].n}</span>
            <span class="ov-status-amt">${fmtB(ST[s].out)}</span>
            <span style="font-size:.62rem;font-weight:700;color:${col};width:38px;text-align:right;">${pctOutDisp}</span>
          </div>`;
        }).join('')}
        <div style="padding-top:10px;border-top:1px solid var(--border);display:flex;gap:16px;flex-wrap:wrap;">
          ${[

  <!-- ═══ Payment History — Principal & Interest ═══ -->
  ${(()=>{
    // Generate ALL payment rows for all active facilities, bucketed by quarter
    const qKey = dt => {
      const q = Math.floor(dt.getMonth() / 3) + 1;
      return dt.getFullYear() + '-Q' + q;
    };
    const qLabel = k => k.replace('-',' ');
    const todayTs = new Date(2026, 4, 14).getTime();

    const buckets = {}; // { '2024-Q3': { principal, interest, isPast } }

    ac.forEach(f => {
      const [sd2,sm2,sy2] = f.fechaInicio.split('/').map(Number);
      const start2 = new Date(sy2, sm2-1, sd2);
      const annR2 = f.tasaFija || ((f.tiie||0) + f.spread);
      const r2    = annR2 / 100 / 12;
      const P2    = f.outNum; // keep in M (millions) native currency
      const C2    = f.comNum;
      const n2    = f.plazo;
      const fx2   = f.moneda === 'USD' ? FX : 1; // convert to MXN-equiv

      const addBucket = (dt, prin, inte) => {
        const k = qKey(dt);
        if (!buckets[k]) buckets[k] = { principal: 0, interest: 0, isPast: dt.getTime() < todayTs };
        buckets[k].principal += prin * fx2;
        buckets[k].interest  += inte * fx2;
        // If any payment in bucket is past, mark isPast based on quarter end
        if (dt.getTime() < todayTs) buckets[k].isPast = true;
      };

      if (f.creditType === 'Bullet') {
        const intPmt = P2 * r2;
        for (let m2=1; m2<=n2-1; m2++) {
          const dt2 = new Date(start2); dt2.setMonth(dt2.getMonth()+m2);
          addBucket(dt2, 0, intPmt);
        }
        const bt2 = new Date(start2); bt2.setMonth(bt2.getMonth()+n2);
        addBucket(bt2, P2, P2*r2);

      } else if (f.creditType === 'Francés') {
        const pmt2 = r2>0 ? P2*r2/(1-Math.pow(1+r2,-n2)) : P2/n2;
        let bal2 = P2;
        for (let m2=1; m2<=n2; m2++) {
          const dt2 = new Date(start2); dt2.setMonth(dt2.getMonth()+m2);
          const intP2 = bal2*r2;
          const prinP2 = Math.min(pmt2-intP2, bal2);
          bal2 = Math.max(0, bal2-prinP2);
          addBucket(dt2, prinP2, intP2);
        }

      } else if (f.creditType === 'Alemán') {
        const prinP2 = P2/n2;
        let bal2 = P2;
        for (let m2=1; m2<=n2; m2++) {
          const dt2 = new Date(start2); dt2.setMonth(dt2.getMonth()+m2);
          const intP2 = bal2*r2;
          bal2 = Math.max(0, bal2-prinP2);
          addBucket(dt2, prinP2, intP2);
        }

      } else { // Revolvente
        for (let m2=1; m2<=n2; m2++) {
          const dt2 = new Date(start2); dt2.setMonth(dt2.getMonth()+m2);
          const drawn = Math.min(P2,C2)*Math.min(1,Math.max(0.10,qr(f.idx*7+m2)));
          const intP2 = drawn*r2;
          addBucket(dt2, 0, intP2);
        }
        const bt2 = new Date(start2); bt2.setMonth(bt2.getMonth()+n2);
        addBucket(bt2, P2, 0);
      }
    });

    // Sort buckets chronologically, limit to reasonable range
    const sorted = Object.entries(buckets)
      .sort((a,b) => a[0].localeCompare(b[0]))
      .filter(([k]) => k >= '2024-Q1' && k <= '2029-Q4');

    if (!sorted.length) return '';

    // Find max for scaling
    const maxVal = Math.max(...sorted.map(([,d]) => d.principal + d.interest), 1);

    // Format value in selected currency
    const fmtPH = v => {
      const cv = CCY === 'USD' ? v / FX : v;
      return cv >= 100000 ? `$${(cv/1000).toFixed(0)}B` : cv >= 1000 ? `$${(cv/1000).toFixed(1)}B` : cv >= 1 ? `$${Math.round(cv)}M` : `$${cv.toFixed(1)}M`;
    };

    // Totals
    const totPrin = sorted.reduce((s,[,d])=>s+d.principal,0);
    const totInt  = sorted.reduce((s,[,d])=>s+d.interest,0);

          <div style="position:absolute;left:0;right:0;bottom:${pct*chartH}px;border-top:1px dashed var(--border);z-index:0;">

          <div style="position:absolute;bottom:0;top:0;left:${todayLeftPct}%;width:2px;background:var(--red);opacity:.4;z-index:1;" title="Hoy"></div>
          <div style="position:absolute;top:-4px;left:${todayLeftPct}%;transform:translateX(-50%);font-size:.6rem;font-weight:700;color:var(--red);background:var(--surface);padding:1px 6px;border-radius:3px;border:1px solid var(--red);z-index:3;">HOY</div>
          ` : ''}
          <!-- Bars (flex:1 → cada barra ocupa equal share del ancho disponible) -->
          ${sorted.map(([k,d]) => {
            const total = d.principal + d.interest;
            const hTotal = Math.round((total / maxVal) * chartH);
            const hPrin  = Math.round((d.principal / maxVal) * chartH);
            const hInt   = hTotal - hPrin;
            const opacity = d.isPast ? '1' : '.65';
            const pattern = d.isPast ? '' : 'background-image:repeating-linear-gradient(135deg,transparent,transparent 3px,rgba(255,255,255,.18) 3px,rgba(255,255,255,.18) 6px);';
            return '<div style="display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;flex:1 1 0;min-width:0;height:100%;z-index:2;position:relative;cursor:default;" title="'+qLabel(k)+': Principal '+fmtPH(d.principal)+' · Intereses '+fmtPH(d.interest)+' · Total '+fmtPH(total)+'">'
              + (hInt > 0 ? '<div style="width:100%;height:'+hInt+'px;background:var(--blue);opacity:'+opacity+';border-radius:4px 4px 0 0;'+pattern+'"></div>' : '')
              + (hPrin > 0 ? '<div style="width:100%;height:'+hPrin+'px;background:var(--secondary);opacity:'+opacity+';'+pattern+'border-radius:'+(hInt>0?'0':'4px 4px')+' 0 0;"></div>' : '')
              + '</div>';
          }).join('')}
        </div>
        <!-- X labels (flex:1 igual que las barras para alineación perfecta) -->
        <div style="display:flex;gap:4px;margin-top:6px;">

          }).join('')}

      <!-- Insight -->
      <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:.68rem;color:var(--text-secondary);line-height:1.4;">
        <i class="ph ph-info" style="margin-right:4px;"></i>
        ${(()=>{
          // Find peak quarter
          const peak = sorted.reduce((best,[k,d]) => {
            const t = d.principal + d.interest;
            return t > best.val ? {k, val:t, d} : best;
          }, {k:'',val:0,d:{}});
          const peakPrin = peak.d.principal || 0;

        })()}
      </div>
    </div>`;
  })()}

      </div>

      <!-- Vintage Analysis — F2.2: per skill §5.1, eje X = MOB (months on book), no calendario -->
      <div class="ov-card">
        <div class="ov-card-title"><i class="ph ph-calendar-dots" style="color:var(--secondary);"></i> Análisis de Cosechas (Vintage) <span class="ov-card-sub">Distress acumulado por MOB (Months on Book) · skill §5.1</span></div>
        ${(()=>{
          if (!vintData.length) return '<div style="text-align:center;padding:20px;font-size:.82rem;color:var(--text-muted);">Sin datos de vintage</div>';

          // Compute current MOB for each cohort (today = May 2026)
          const TODAY_Y = 2026, TODAY_M = 5;
          const cohorts = vintData.map((v, i) => {
            const [year, qPart] = v.q.split('-Q');
            const startM = (parseInt(qPart) - 1) * 3 + 1; // Q1→1, Q2→4...
            const currentMOB = (TODAY_Y - parseInt(year)) * 12 + (TODAY_M - startM);
            // Simulate cumulative curve: 0 at MOB=0, growing to currentDistress at currentMOB
            const finalRate = v.distressRate;
            const maxMOB = Math.max(currentMOB, 1);
            const points = [];
            for (let m = 0; m <= maxMOB; m += 3) {
              // Sigmoid-like growth: slow start, accel mid, plateau late
              const t = m / maxMOB;
              const cumPct = finalRate * (1 - Math.exp(-3 * t));
              points.push({mob: m, rate: cumPct});
            }
            // Ensure last point matches finalRate exactly
            if (points.length && points[points.length-1].mob < maxMOB) {
              points.push({mob: maxMOB, rate: finalRate});
            } else if (points.length) {
              points[points.length-1].rate = finalRate;
            }
            return {q: v.q, points, currentMOB, finalRate, n: v.n, isWorst: false};
          }).sort((a,b) => parseInt(b.q.replace('-Q','')) - parseInt(a.q.replace('-Q','')));
          // Mark worst
          const worstRate = Math.max(...cohorts.map(c => c.finalRate));
          cohorts.forEach(c => c.isWorst = c.finalRate === worstRate && worstRate > 15);

          const maxRate = Math.max(...cohorts.map(c => c.finalRate), 10);
          const maxMOBChart = Math.max(...cohorts.map(c => c.currentMOB), 24);
          const W = 460, H = 160, ML = 32, MR = 8, MT = 8, MB = 24;
          const xs = mob => ML + (mob/maxMOBChart) * (W-ML-MR);
          const ys = rate => MT + (1 - rate/maxRate) * (H-MT-MB);

          // Y-axis gridlines
          const grid = [0, 25, 50, 75, 100].map(p => {
            const y = ys(maxRate*p/100);
            const val = (maxRate*p/100).toFixed(0);
            return `<line x1="${ML}" y1="${y}" x2="${W-MR}" y2="${y}" stroke="${p===0?'#94A3B8':'#E5E7EB'}" stroke-width="1" stroke-dasharray="${p===0?'0':'3,3'}"/>
                    <text x="${ML-4}" y="${y+3}" text-anchor="end" font-size="9" fill="#94A3B8" font-family="monospace">${val}%</text>`;
          }).join('');

          // X-axis labels (every 6 MOB)
          const xLabels = [];
          for (let m = 0; m <= maxMOBChart; m += 6) {
            xLabels.push(`<text x="${xs(m)}" y="${H-6}" text-anchor="middle" font-size="9" fill="#94A3B8" font-family="monospace">M${m}</text>`);
          }

          // Color palette for cohorts (oldest = lightest, newest = brightest)
          const palette = ['#FECACA','#FCA5A5','#F87171','#EF4444','#DC2626','#910057'];
          const lines = cohorts.map((c, idx) => {
            const col = c.isWorst ? '#910057' : palette[idx % palette.length];
            const pts = c.points.map(p => `${xs(p.mob).toFixed(1)},${ys(p.rate).toFixed(1)}`).join(' ');
            const lastPt = c.points[c.points.length-1];
            return `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="${c.isWorst?2.5:1.5}" stroke-linejoin="round" stroke-linecap="round"/>
                    <circle cx="${xs(lastPt.mob)}" cy="${ys(lastPt.rate)}" r="3" fill="${col}" stroke="white" stroke-width="1.5"/>
                    <text x="${xs(lastPt.mob)+6}" y="${ys(lastPt.rate)+3}" font-size="9" fill="${col}" font-weight="${c.isWorst?700:500}" font-family="monospace">${c.q}</text>`;
          }).join('');

          return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;">
            ${grid}${lines}${xLabels.join('')}
            <text x="${ML+(W-ML-MR)/2}" y="${H+10}" text-anchor="middle" font-size="9" fill="var(--text-muted)">MOB (Months on Book) desde originación</text>
          </svg>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;">
            ${cohorts.map(c => `<span style="font-size:.6rem;font-family:var(--font-mono);color:${c.isWorst?'var(--red)':'var(--text-muted)'};background:var(--bg);padding:2px 6px;border-radius:3px;border:1px solid ${c.isWorst?'var(--red)':'var(--border)'};font-weight:${c.isWorst?700:400};">${c.q}: ${c.n} fac · ${c.finalRate.toFixed(1)}% @ M${c.currentMOB}</span>`).join('')}
          </div>`;
        })()}
        ${hiddenOlderCount > 0 || tinyCohortsCount > 0 ? `
        <div style="margin-top:6px;font-size:.6rem;color:var(--text-muted);font-style:italic;">
          <i class="ph ph-info" style="margin-right:3px;"></i>
          Vista: 8 cosechas más recientes con n≥${MIN_COHORT_N}.
          ${hiddenOlderCount > 0 ? `${hiddenOlderCount} cosecha${hiddenOlderCount>1?'s':''} anterior${hiddenOlderCount>1?'es':''} agrupada${hiddenOlderCount>1?'s':''} (no mostradas).` : ''}
          ${tinyCohortsCount > 0 ? `${tinyCohortsCount} cosecha${tinyCohortsCount>1?'s':''} excluida${tinyCohortsCount>1?'s':''} por n<${MIN_COHORT_N} (no significativas).` : ''}
        </div>` : ''}
        <div style="margin-top:10px;font-size:.68rem;color:var(--text-secondary);line-height:1.5;">
          ${(()=>{
            // H1.3: peor cosecha = búsqueda en TODAS las cosechas filtradas, no solo visibles
            const worst = vintAll.reduce((w,v) => v.distressRate > w.distressRate ? v : w, {distressRate:0,q:'—',n:0,distressOutPct:0});
            const trend = vintData.length >= 2 ? (vintData[vintData.length-1].distressRate - vintData[0].distressRate) : 0;
            const trendTxt = Math.abs(trend) < 5 ? 'estable' : trend < 0 ? 'mejorando ↓' : 'deteriorando ↑';
            const isWorstVisible = vintData.some(v => v.q === worst.q);
            const worstNote = isWorstVisible ? '' : ' (no visible — cosecha más antigua)';
            if (worst.distressRate > 20) {
              return `<i class="ph ph-warning" style="margin-right:4px;color:var(--yellow);"></i>Peor cosecha histórica: <strong>${worst.q}</strong>${worstNote} (${worst.distressRate.toFixed(1)}% por count · ${worst.distressOutPct.toFixed(1)}% por AUM · ${worst.n} fac). Tendencia 8 cosechas visibles: <strong>${trendTxt}</strong>.`;
            }
            return `<i class="ph ph-info" style="margin-right:4px;"></i>Cosechas dentro de rangos normales. Tendencia: <strong>${trendTxt}</strong>.`;
          })()}
        </div>
      </div>
    </div>

        <table class="ov-tbl" style="margin-bottom:14px;">
          <thead><tr><th>Borrower</th><th style="text-align:right;">RAROC</th><th style="text-align:right;">RWA</th><th>Rating</th></tr></thead>
          <tbody>
          ${[...facRAROC].sort((a,b)=>b.raroc-a.raroc).slice(0,5).map(x => `<tr>

            <td class="mono" style="text-align:right;color:var(--green);">${x.raroc.toFixed(1)}%</td>

        <div style="font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--red);margin-bottom:6px;">▼ Bottom 5 — Menor RAROC</div>
        <table class="ov-tbl">
          <thead><tr><th>Borrower</th><th style="text-align:right;">RAROC</th><th style="text-align:right;">RWA</th><th>Rating</th></tr></thead>
          <tbody>
          ${[...facRAROC].sort((a,b)=>a.raroc-b.raroc).slice(0,5).map(x => `<tr>
            <td style="font-size:.72rem;font-weight:500;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${x.f.borrower}</td>
            <td class="mono" style="text-align:right;color:var(--red);">${x.raroc.toFixed(1)}%</td>

        <div style="margin-top:10px;font-size:.62rem;color:var(--text-muted);line-height:1.4;">

        </div>

    <!-- F2.1: Stress Waterfall (per skill §5.7) -->
    <div class="ov-row" style="margin-top:14px;">
      <div class="ov-card" style="grid-column:1/-1;">
        <div class="ov-card-title"><i class="ph ph-trending-up" style="color:var(--red);"></i> Stress Waterfall — Escenario Adverso <span class="ov-card-sub">Descomposición del incremento de ECL bajo estrés (skill §5.7)</span></div>
        ${(()=>{
          const w = stressECL;
          const total = stressTotalECL;
          const maxBar = Math.max(w.base, total);
          const bar = (val, col, lbl, sub) => {
            const pct = Math.min((val/maxBar)*100, 100);
            return `<div style="display:grid;grid-template-columns:160px 1fr 130px;gap:10px;align-items:center;margin-bottom:8px;">
              <span style="font-size:.78rem;color:var(--text);font-weight:500;">${lbl}</span>
              <div style="height:22px;background:var(--bg);border-radius:4px;position:relative;overflow:hidden;">
                <div style="height:100%;width:${pct}%;background:${col};border-radius:4px;display:flex;align-items:center;padding:0 8px;color:#fff;font-size:.72rem;font-weight:700;font-family:var(--font-mono);">${fmtB(val)}</div>
              </div>
              <span style="font-size:.7rem;color:var(--text-secondary);">${sub}</span>
            </div>`;
          };
          return `
          ${bar(w.base, 'var(--blue)', 'ECL Base', `IFRS 9 actual · ${(w.base/totalOut*100).toFixed(2)}% AUM`)}
          ${bar(w.pdShock, '#D97706', '+ PD shock', 'PD × 1.5 (deterioro de calidad)')}
          ${bar(w.lgdShock, '#EA580C', '+ LGD shock', 'LGD 45% → 60% (recovery ↓)')}
          ${bar(w.cureRate, '#C2410C', '+ Cure rate ↓', '10% Stage 2 migra a Stage 3')}
          <div style="height:1px;background:var(--border);margin:8px 0;"></div>
          ${bar(total, 'var(--red)', '= ECL Estresado', `${((total-w.base)/w.base*100).toFixed(0)}% sobre base · ${(total/totalOut*100).toFixed(2)}% AUM`)}
          <div style="margin-top:12px;padding:8px 10px;background:var(--bg);border-radius:var(--radius-sm);font-size:.7rem;color:var(--text-secondary);line-height:1.5;">
            <i class="ph ph-info" style="margin-right:4px;"></i>
            <strong>Driver principal:</strong> ${(()=>{
              const drivers = [{n:'PD shock', v:w.pdShock},{n:'LGD shock', v:w.lgdShock},{n:'cure rate decline', v:w.cureRate}];
              drivers.sort((a,b) => b.v - a.v);
              return `${drivers[0].n} aporta ${fmtB(drivers[0].v)} (${(drivers[0].v/(total-w.base)*100).toFixed(0)}% del incremento)`;
            })()}. Mitigación: priorizar reprice de facilities BB/B antes de PD shock real.
          </div>`;
        })()}
      </div>
    </div>

/* ─── Quirografario Detail ───────────────────────────── */
// Seeded helpers (also used at render time)
function qr(seed) { const x = Math.sin(seed * 9301 + 49297) * 233280; return x - Math.floor(x); }
function qpick(seed, arr) { return arr[Math.floor(qr(seed) * arr.length)]; }
function qnum(seed, min, max, dec) { return parseFloat((qr(seed)*(max-min)+min).toFixed(dec||2)); }
function fmtDate(dt) { return `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`; }

function calcWAL(f) {
  const n = f.plazo;
  if (f.creditType === 'Bullet')     return parseFloat((n / 12).toFixed(1));
  if (f.creditType === 'Revolvente') return parseFloat((n / 12 * 0.5).toFixed(1));
  if (f.creditType === 'Alemán')     return parseFloat(((n + 1) / 2 / 12).toFixed(1)); // amortización lineal
  return parseFloat((n * 0.57 / 12).toFixed(1)); // Francés: pagos de capital crecientes → WAL ≈ 57% del plazo
}
function nextMeasDate(freq) {
  const dt = new Date(TODAY);
  if      (freq === 'Mensual')    dt.setMonth(dt.getMonth() + 1);
  else if (freq === 'Trimestral') dt.setMonth(dt.getMonth() + 3);
  else if (freq === 'Semestral')  dt.setMonth(dt.getMonth() + 6);
  else dt.setFullYear(dt.getFullYear() + 1);
  return fmtDate(dt);
}
function ratingColor(r) {
  // DS CXC §1: tokens de estados
  if (['A','A-'].includes(r))             return {bg:'#F0FDF4',tc:'#16A34A'};
  if (['BBB+','BBB','BBB-'].includes(r))  return {bg:'#F0F9FF',tc:'#0284C7'};
  if (['BB+','BB','BB-'].includes(r))     return {bg:'#FFFBEB',tc:'#D97706'};
  return {bg:'#FEF2F2',tc:'#DC2626'};
}

function buildTiieHistory(f) {
  if (!f.tiie) return '';
  const rateLabel = f.rateType === 'SOFR' ? 'SOFR' : (f.rateType || 'TIIE');
  const sourceNote = f.rateType === 'SOFR' ? 'Fed / CME — SOFR Term 1M' : 'Banxico — TIIE 28d';
  const MES = ["Ene '26","Feb '26","Mar '26","Abr '26","May '26"];
  // SOFR: deltas decrecientes distintos a TIIE (Fed cuts vs Banxico)
  const DLT = f.rateType === 'SOFR'
    ? [0.25, 0.18, 0.10, 0.03, 0.00]
    : [0.40, 0.28, 0.15, 0.05, 0.00];
  const hist = MES.map((m,k)=>({ m, base:+(f.tiie+DLT[k]).toFixed(2), total:+(f.tiie+DLT[k]+f.spread).toFixed(2) }));
  const maxT = Math.max(...hist.map(h=>h.total));
  const rows = hist.map(h=>{
    const w = Math.round((h.total/maxT)*100);
    const isCur = h===hist[hist.length-1];
    return `<div style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:.75rem;">
      <span style="width:48px;color:var(--text-muted);flex-shrink:0;">${h.m}</span>
      <span style="width:44px;color:var(--text-secondary);text-align:right;flex-shrink:0;font-family:var(--font-mono);">${h.base}%</span>
      <div style="flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;">
        <div style="height:100%;width:${w}%;background:var(--secondary);border-radius:3px;opacity:${isCur?1:.55};"></div>
      </div>
      <span style="width:44px;font-weight:700;text-align:right;flex-shrink:0;font-family:var(--font-mono);color:${isCur?'var(--secondary)':'var(--text)'};">${h.total}%</span>
    </div>`;
  }).join('');
  return `<div style="padding:6px 18px 4px;border-top:1px solid var(--border);">
    <div style="font-size:.65rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;">${rateLabel} — Historial mensual (+ spread ${f.spread}%)</div>
    ${rows}
    <div style="font-size:.68rem;color:var(--text-muted);margin-top:6px;padding-top:6px;border-top:1px solid var(--border);">Fuente: ${sourceNote} · Actualizado ${new Date(2026,4,14).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'})}</div>
  </div>`;
}


function genCovenants(f) {
  const i = f.idx;

  // Covenants financieros correctos para quirografario MX (CEBURES, créditos simples)
  // Fuente: Ley del Mercado de Valores + práctica de mercado BANORTE/BBVA/PROMECAP
  const DEFS = [
    { abbr:'DSCR',     name:'Cobertura de Servicio de Deuda (EBITDA / Principal + Intereses)', unit:'x',  threshold:1.20, big:true  },
    { abbr:'Leverage', name:'Apalancamiento Neto (Deuda Neta / EBITDA)',                        unit:'x',  threshold:4.00, big:false },
    { abbr:'ICR',      name:'Cobertura de Intereses (EBITDA / Gastos Financieros)',             unit:'x',  threshold:2.50, big:true  },
    { abbr:'ILC',      name:'Índice de Liquidez Corriente (Activo Circ. / Pasivo Circ.)',      unit:'x',  threshold:1.10, big:true  },
    { abbr:'Cap.Min',  name:'Capital Contable Mínimo (Patrimonio Absoluto)',                    unit:'$M', threshold: Math.max(f.outNum * 0.40, 50),               big:true  },
  ];

  const count = 2 + Math.floor(qr(i*17) * 3); // 2–4 covenants financieros
  const used = new Set();
  const chosen = [];
  for (let k = 0; k < count; k++) {
    let di, retry = 0;
    do { di = Math.floor(qr(i*23+k*7+retry++)*DEFS.length); } while (used.has(di) && retry < 50);
    used.add(di); chosen.push({...DEFS[di]});
  }

  const WTS = {
    COMPLIANT: ['COMPLIANT','COMPLIANT','COMPLIANT','COMPLIANT','COMPLIANT','PENDING'],
    WATCH:     ['COMPLIANT','COMPLIANT','WATCH','WATCH','WATCH','PENDING'],
    BREACH:    ['COMPLIANT','WATCH','WATCH','BREACH','BREACH','BREACH'],
  };
  const FREQS = ['Mensual','Trimestral','Semestral','Anual'];

  const numeric = chosen.map((cv, k) => {
    let cvStatus;
    if (k === 1 && i % 7 === 0) cvStatus = 'PENDING';
    else cvStatus = qpick(i*31+k*13, WTS[f.status] || WTS.COMPLIANT);
    const thr = cv.threshold;
    let actual, holgura;
    if (cv.big) {
      actual  = cvStatus==='BREACH' ? qnum(i*41+k,thr*.75,thr*.98) : cvStatus==='WATCH' ? qnum(i*41+k,thr*.98,thr*1.05) : qnum(i*41+k,thr*1.05,thr*1.4);
      holgura = parseFloat((actual-thr).toFixed(2));
    } else {
      actual  = cvStatus==='BREACH' ? qnum(i*41+k,thr*1.02,thr*1.4) : cvStatus==='WATCH' ? qnum(i*41+k,thr*.90,thr*1.02) : qnum(i*41+k,thr*.40,thr*.88);
      holgura = parseFloat((thr-actual).toFixed(2));
    }
    return { ...cv, cvStatus, actual, holgura, freq: qpick(i*53+k*7,FREQS) };
  });

  // ── Negative Pledge: el covenant más crítico del quirografario ──────────────
  // Prohíbe pignorar activos a terceros — su breach deja al lender aún más subordinado
  const negStatus = f.status==='BREACH' && qr(i*71)>0.55 ? 'BREACH'
    : f.status==='WATCH'  && qr(i*71)>0.75 ? 'WATCH' : 'COMPLIANT';
  const negPledge = {
    abbr:'Neg.Pledge', type:'binary',
    name:'Negative Pledge — Prohibición de pignorar activos a terceros',
    cvStatus: negStatus, freq:'Continuo',
    detail: negStatus==='BREACH' ? 'Pignoración detectada sobre activos clave — Aceleración activada'
          : negStatus==='WATCH'  ? 'Revisión legal en curso — Reporte de asesor pendiente'
          : 'Sin garantías reales otorgadas a terceros desde el cierre'
  };

  // ── Rating Trigger: distancia del rating actual al umbral de trigger ─────────
  // Trigger floor: BB+ (un notch bajo grado de inversión BBB-)
  // Al cruzarlo: las Afores venden forzosamente → spread se dispara → espiral
  const SCALE = ['A','A-','BBB+','BBB','BBB-','BB+','BB','BB-','B+'];
  const FLOOR = 'BB+';
  const trigIdx = SCALE.indexOf(FLOOR);
  const curIdx  = SCALE.indexOf(f.ratingInterno);
  const notches = trigIdx - curIdx; // >0 = sobre trigger, ≤0 = en/bajo trigger
  const rtStatus = notches < 0 ? 'BREACH' : notches === 0 ? 'WATCH' : notches === 1 ? 'WATCH' : 'COMPLIANT';
  const ratingTrigger = {
    abbr:'Rate.Trg', type:'rating',
    name:`Rating Trigger — Umbral de Afores: ${FLOOR} (escala nacional mx/HR)`,
    cvStatus: rtStatus, freq:'Continuo',
    currentRating: f.ratingInterno, notches, triggerFloor: FLOOR
  };

  return [...numeric, negPledge, ratingTrigger];
}

function fmtDateShort(dt) {
  const M = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return `${dt.getDate()} ${M[dt.getMonth()]} ${dt.getFullYear()}`;
}
function fmtAmt(v) { return '$' + Math.round(Math.abs(v)).toLocaleString('en-US'); }

function genSchedule(f) {
  // LIQUIDADO facilities have no pending payments — a paid-off loan has no schedule
  if (f.estadoFacility === 'LIQUIDADO') {
    return { future: [], past: [] };
  }
  const [sd,sm,sy] = f.fechaInicio.split('/').map(Number);
  const start  = new Date(sy, sm-1, sd);
  const today  = TODAY;
  const annR   = f.tasaFija || ((f.tiie||0) + f.spread); // annual rate %
  const r      = annR / 100 / 12;                         // monthly rate
  const P      = f.outNum * 1_000_000;                    // outstanding $
  const C      = f.comNum * 1_000_000;                    // commitment $
  const n      = f.plazo;                                  // term months
  const all    = [];

  const addRow = (dt, row) => {
    all.push({ ts: dt.getTime(), fecha: fmtDateShort(dt),
               isPast: dt < today, isNext: false, isOverdue: false, ...row });
  };

  /* ── BULLET ─────────────────────────────────────────────
     Monthly interest-only payments; full principal at maturity. */
  if (f.creditType === 'Bullet') {
    const intPmt = P * r;
    for (let m = 1; m <= n - 1; m++) {
      const dt = new Date(start); dt.setMonth(dt.getMonth() + m);
      addRow(dt, {
        icon:'💰', concepto:'Intereses mensuales', isBullet: false,
        sub: `Saldo: ${fmtAmt(P)} · Tasa: ${annR.toFixed(2)}% anual`,
        principal: 0, interes: intPmt, total: intPmt, balance: P,
        monto: fmtAmt(intPmt),
      });
    }
    const bt = new Date(start); bt.setMonth(bt.getMonth() + n);
    addRow(bt, {
      icon:'🏛️', concepto:'Amortización total · Bullet', isBullet: true,
      sub: `Capital: ${fmtAmt(P)} + Intereses último mes: ${fmtAmt(P * r)}`,
      principal: P, interes: P * r, total: P + P * r, balance: 0,
      monto: fmtAmt(P + P * r),
    });

  /* ── FRANCÉS (ANUALIDAD) ─────────────────────────────────
     Cuota constante. PMT = P·r / (1−(1+r)^−n).
     Cada período: intereses = saldo×r, principal = PMT−intereses. */
  } else if (f.creditType === 'Francés') {
    const pmt = r > 0 ? P * r / (1 - Math.pow(1 + r, -n)) : P / n;
    let bal = P;
    for (let m = 1; m <= n; m++) {
      const dt = new Date(start); dt.setMonth(dt.getMonth() + m);
      const intP  = bal * r;
      const prinP = Math.min(pmt - intP, bal);
      bal = Math.max(0, bal - prinP);
      addRow(dt, {
        icon:'💼', concepto:`Cuota #${m} · Monto fijo`, isBullet: false,
        sub: `Principal: ${fmtAmt(prinP)} · Intereses: ${fmtAmt(intP)} · Saldo restante: ${fmtAmt(bal)}`,
        principal: prinP, interes: intP, total: pmt, balance: bal,
        monto: fmtAmt(pmt),
      });
    }

  /* ── ALEMÁN (CAPITAL CONSTANTE) ──────────────────────────
     Principal fijo cada período. Intereses = saldo×r.
     Cuota total decrece conforme amortiza el saldo. */
  } else if (f.creditType === 'Alemán') {
    const prinP = P / n;
    let bal = P;
    for (let m = 1; m <= n; m++) {
      const dt = new Date(start); dt.setMonth(dt.getMonth() + m);
      const intP  = bal * r;
      bal = Math.max(0, bal - prinP);
      const total = prinP + intP;
      addRow(dt, {
        icon:'💼', concepto:`Cuota #${m} · Capital fijo`, isBullet: false,
        sub: `Capital: ${fmtAmt(prinP)} · Intereses: ${fmtAmt(intP)} · Saldo: ${fmtAmt(bal)}`,
        principal: prinP, interes: intP, total, balance: bal,
        monto: fmtAmt(total),
      });
    }

  /* ── REVOLVENTE ──────────────────────────────────────────
     Sin amortización programada. Cada mes: intereses sobre
     saldo dispuesto + commitment fee sobre no dispuesto.
     Capital se reembolsa al vencimiento. */
  } else {
    const commR = (f.commitmentFee || 0.5) / 100 / 12;
    for (let m = 1; m <= n; m++) {
      const dt = new Date(start); dt.setMonth(dt.getMonth() + m);
      const drawn   = Math.min(P, C) * Math.min(1, Math.max(0.10, qr(f.idx*7+m)));
      const undrawn = Math.max(0, C - drawn);
      const intP    = drawn  * r;
      const feeP    = undrawn * commR;
      const total   = intP + feeP;
      addRow(dt, {
        icon:'🔄', concepto:'Intereses + Comisión no dispuesto', isBullet: false,
        sub: `Dispuesto: ${fmtAmt(drawn)} → Int.: ${fmtAmt(intP)} | No disp.: ${fmtAmt(undrawn)} → Fee: ${fmtAmt(feeP)}`,
        principal: 0, interes: intP, commFee: feeP, total, balance: drawn,
        monto: fmtAmt(total),
      });
    }
    // Vencimiento — repago del saldo vivo
    const bt = new Date(start); bt.setMonth(bt.getMonth() + n);
    addRow(bt, {
      icon:'🏛️', concepto:'Vencimiento · Repago saldo revolvente', isBullet: true,
      sub: `Línea comprometida: ${fmtAmt(C)} · Plazo: ${n} meses`,
      principal: P, interes: 0, total: P, balance: 0,
      monto: fmtAmt(P),
    });
  }

  // Sort: future asc, past desc (most recent first)
  const future = all.filter(r => !r.isPast).sort((a,b) => a.ts - b.ts);
  const past   = all.filter(r =>  r.isPast).sort((a,b) => b.ts - a.ts);

  if (future.length) future[0].isNext = true;
  if ((f.estadoFacility === 'VENCIDO' || f.estadoFacility === 'EN REESTRUCTURA') && future.length) {
    future[0].isOverdue = true; future[0].isNext = false;
  }
  // TC-01 fix: si VENCIDO, los últimos 1-3 pagos pasados están en mora (no pagados)
  // El acreditado dejó de pagar antes del vencimiento — esta es la realidad financiera.
  if (f.estadoFacility === 'VENCIDO' && past.length) {
    // Past array está ordenado DESC (más reciente primero) — marcar los primeros 1-3 como overdue
    const numUnpaid = Math.min(3, past.length);
    for (let k = 0; k < numUnpaid; k++) {
      past[k].isOverdue = true;
      past[k].isPast = false; // ya no es "pasado pagado", es vencido sin pagar
    }
  }
  // EN REESTRUCTURA: último pago pasado en estado "Parcial" (representado como overdue + nota)
  if (f.estadoFacility === 'EN REESTRUCTURA' && past.length) {
    past[0].isOverdue = true;
    past[0].isPast = false;
  }

  // Display cap: bullet always shown + up to 4 regular rows
  const bullet   = future.find(r => r.isBullet);
  let futDisp    = future.filter(r => !r.isBullet).slice(0, bullet ? 4 : 5);
  if (bullet) futDisp.push(bullet);
  futDisp.sort((a,b) => a.ts - b.ts);

  return { future: futDisp, past: past.slice(0, 4) };
}

function renderQuiroDetail(f) {
  const covs   = genCovenants(f);
  const sched  = genSchedule(f);      // { future: [], past: [] }
  const baseR  = f.tieeFloor ? Math.max(f.tieeFloor, f.tiie||0) : (f.tiie||0);
  const eff    = parseFloat((f.tasaFija || (baseR + f.spread)).toFixed(2));

  const mora       = parseFloat((eff + 2.5).toFixed(2));
  const util       = Math.round((f.outNum / f.comNum) * 100);
  const lineaDisp  = f.comNum - f.outNum;
  const wal        = calcWAL(f);
  const debtTotal  = Math.round(f.outNum * f.debtTotalMult);
  const thisShare  = Math.min(100, Math.round((f.outNum / debtTotal) * 100));
  const rc         = ratingColor(f.ratingInterno);
  // Next payment
  const nxtPay       = sched.future[0] ?? null;
  const nxtPayMes    = nxtPay ? nxtPay.fecha.replace(/(\d+) (\w+) \d+/, '$1 $2') : '—';
  const nxtPayAmt    = nxtPay ? nxtPay.monto : '—';
  const nxtPayConc   = nxtPay
    ? (nxtPay.isBullet        ? 'Capital (Bullet)'
      : f.creditType === 'Revolvente' ? 'Disposición / Intereses'
      : f.creditType === 'Bullet'     ? 'Intereses'
      : 'Cuota (capital + intereses)')
    : '—';
  const nxtIsOverdue = nxtPay && nxtPay.isOverdue;

  // Dates / time elapsed
  const [vd,vm,vy]   = f.fechaVenc.split('/').map(Number);
  const [sd2,sm2,sy2] = f.fechaInicio.split('/').map(Number);
  const vencDate  = new Date(vy,vm-1,vd);
  const startDate = new Date(sy2,sm2-1,sd2);
  const today2    = TODAY;
  const diffDays  = Math.max(0, Math.floor((vencDate-today2)/86400000));
  const diffMons  = Math.floor(diffDays/30);
  const totalDays  = Math.max(1, Math.floor((vencDate-startDate)/86400000));
  const transcDays = Math.max(0, Math.floor((today2-startDate)/86400000));
  const transcPct  = Math.min(100, Math.round(transcDays/totalDays*100));
  const plazoMeses  = Math.round(transcDays/30);

  // ── Covenant status vars (still needed for table) ─────────
  const breachedCovs = covs.filter(c => c.cvStatus === 'BREACH');
  const watchCovs    = covs.filter(c => c.cvStatus === 'WATCH');

  // ── 5 KPIs ───────────────────────────────────────────────
  const utilColor = util >= 95 ? 'var(--red)' : util >= 80 ? 'var(--yellow)' : 'var(--green)';
  const kpis = `
    <div class="qd-kpi-row" style="grid-template-columns:repeat(5,1fr);">
      <div class="qd-kpi">
        <div class="qd-kpi-label">Outstanding</div>
        <div class="qd-kpi-val">${f.outstanding}</div>
        <div style="margin-top:7px;">
          <div style="height:5px;background:var(--border);border-radius:3px;overflow:hidden;">
            <div style="height:100%;width:${util}%;background:${utilColor};border-radius:3px;"></div>
          </div>
          <span style="font-size:.68rem;color:${utilColor};font-weight:700;margin-top:3px;display:block;">${util}% del commitment</span>
        </div>
      </div>
      <div class="qd-kpi">
        <div class="qd-kpi-label">Línea Disponible</div>
        <div class="qd-kpi-val${lineaDisp===0?' alert':''}">${lineaDisp===0?'$0':'$'+lineaDisp+'M'}</div>
        <div class="qd-kpi-sub">${f.creditType==='Revolvente'?'Commit. fee: '+f.commitmentFee+'% s/no disp.':f.creditType==='Bullet'?'Bullet — fully drawn':'Disponible de '+f.commitment}</div>
      </div>
      <div class="qd-kpi">
        <div class="qd-kpi-label">All-in Rate</div>
        <div class="qd-kpi-val${f.status==='BREACH'?' alert':''}">${eff}%</div>
        <div class="qd-kpi-sub">${f.rateType==='Fija'?'Tasa fija '+f.tasaFija+'%':f.rateType+' + '+f.spread+'%'}${f.tieeFloor?'<br>Floor: '+f.tieeFloor+'%':''}</div>
      </div>
      <div class="qd-kpi">
        <div class="qd-kpi-label">Próximo Pago</div>
        <div class="qd-kpi-val${nxtIsOverdue?' alert':''}" style="font-size:1.4rem;">${nxtPayMes}</div>
        <div class="qd-kpi-sub">${nxtPayConc} — ${nxtPayAmt}</div>
      </div>
      <div class="qd-kpi">
        <div class="qd-kpi-label">Vida Media (WAL)</div>
        <div class="qd-kpi-val">${wal}a</div>

                 : isW ? `<span class="qd-cv-watch">⚠ Watch</span>`
                 : `<span class="qd-cv-ok">✓ OK</span>`;

    // ── Binary covenant (Negative Pledge) ──────────────────
    if (cv.type === 'binary') {
      const binCol = isB?'var(--red)':isW?'var(--yellow)':'var(--green)';
      return `<tr class="${isB?'breach-row':isW?'watch-row':''}">
        <td><div class="qd-cv-name">${cv.abbr}</div><div class="qd-cv-desc">${cv.name}</div></td>
        <td colspan="3" style="font-size:.78rem;color:${binCol};">
          <span style="display:inline-flex;align-items:center;gap:6px;">
